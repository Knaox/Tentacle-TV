# Tentacle TV — LG webOS (IPK sideload)
#
# Déclenché par le tag `webos-vX.Y.Z` ou MANUELLEMENT. Jamais sur un push :
# pousser sur `main` ne doit rien livrer.
#
# La version vient de versions.json → champ `webos` (SOURCE UNIQUE). Le script
# `ipk.mjs` la reporte lui-même dans `appinfo.json` avant d'empaqueter, pour que
# les deux ne puissent pas diverger ; le job `version` vérifie en plus que le tag
# correspond (garde-fou CI, comme les autres cibles).
#
# LE PAQUET NE CONTIENT QUE LA COQUILLE. Le client React est servi par le serveur
# Tentacle sur `/tv` : corriger le client ne demande AUCUNE réinstallation. On ne
# republie un IPK que pour l'icône, le titre, le splash, l'identifiant, ou le
# comportement de la coquille elle-même.
#
# DEUX RELEASES, ET C'EST VOULU :
#   • `webos-vX.Y.Z` — l'historique, une par version, avec ses notes.
#   • `webos-latest` — un tag FIXE, réécrit à chaque livraison, qui porte l'IPK
#     sous un nom lui aussi fixe. Cela donne une adresse de téléchargement qui ne
#     change jamais, sur laquelle un script d'installation peut s'appuyer :
#
#         https://github.com/<dépôt>/releases/download/webos-latest/tentacle-tv.ipk
#
#     `releases/latest/download/…` ne conviendrait PAS : ce raccourci désigne la
#     dernière release du DÉPÔT, toutes cibles confondues — une livraison desktop
#     ou serveur la ferait pointer ailleurs.
#
# Notes de version : changelogs/webos.md (bloc « ## [X.Y.Z] », ### FR / ### EN).

name: Release webOS

on:
  push:
    tags: ["webos-v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Jusqu'où aller"
        type: choice
        options: [build, test, store]
        default: test
      version:
        description: "Version X.Y.Z à livrer (vide = versions.json inchangé)"
        type: string
        default: ""

# TROIS CRANS, comme les autres workflows :
#   • build — l'IPK en artefact du run. Aucune Release.
#   • test  — Release VERSIONNÉE « webos-vX.Y.Z » seule. L'adresse permanente
#             « webos-latest » NE BOUGE PAS : ce que les téléviseurs installés
#             tirent reste l'ancienne version.
#   • store — l'adresse permanente bascule elle aussi. C'est ce cran, et lui
#             seul, qui met la nouvelle coquille en service.

concurrency:
  # Pas de cancel-in-progress : deux runs écriraient la MÊME release
  # « webos-latest », qui est réécrite à chaque livraison.
  group: release-webos
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_ID: com.tentacletv.webos
  # Le nom que le script d'installation attendra, et qui ne doit jamais changer.
  IPK_STABLE: tentacle-tv.ipk
  # L'archive de l'installateur, sous un nom lui aussi fixe : c'est le seul
  # fichier qu'un utilisateur télécharge, et l'adresse est donnée telle quelle.
  INSTALLATEUR: installateur-tentacle-tv.zip

jobs:
  prepare:
    name: Préparer la livraison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.lire.outputs.version }}
      sha: ${{ steps.lire.outputs.sha }}
      channel: ${{ steps.lire.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/require-quality
        with:
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump versions.json (si une version est demandée)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          WANTED: ${{ inputs.version }}
        run: node .github/scripts/bump-version.mjs webos "$WANTED"

      - uses: ./.github/actions/push-main
        id: pushed
        if: steps.bump.outputs.changed == 'true'
        with:
          paths: ${{ steps.bump.outputs.files }}
          message: "release(webos) : v${{ inputs.version }}"

      - name: Lire versions.json, et vérifier le tag
        id: lire
        env:
          BUMPED_SHA: ${{ steps.pushed.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${BUMPED_SHA:-${{ github.sha }}}"
          git checkout --quiet "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # Un tag veut dire « livrer », donc le cran le plus haut.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then CHANNEL=store; else CHANNEL="${{ inputs.channel }}"; fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          VERSION="$(node -p "require('./versions.json').webos")"
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ]; then
            echo "::error::versions.json ne porte pas de champ « webos »."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version webOS : $VERSION"

          # Garde-fou : sur un tag, les deux doivent coïncider. La source reste
          # versions.json — le tag n'est qu'un déclencheur, jamais l'autorité.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ATTENDU="webos-v$VERSION"
            if [ "$GITHUB_REF_NAME" != "$ATTENDU" ]; then
              echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à versions.json ($ATTENDU)."
              exit 1
            fi
          fi

      # Le pré-vol : un bloc manquant donnait jusqu'ici une Release au corps
      # générique « Tentacle TV pour LG webOS — version X.Y.Z », sans que
      # personne ne voie passer l'oubli.
      - name: Pré-vol des notes de version
        if: steps.lire.outputs.channel != 'build'
        run: |
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/webos.md --version "${{ steps.lire.outputs.version }}" \
            --check github

  paquet:
    name: Construire l'IPK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` couvre TOUT le dépôt, backend compris, et le client
      # Prisma de celui-ci est un stub tant que `prisma generate` n'a pas
      # tourné : sans lui, chaque résultat de requête est `any` et une quinzaine
      # d'erreurs TS7006 tombent sur du code parfaitement sain. Elles ne se
      # voient jamais en local, où le client a été généré une fois pour toutes.
      - name: Générer le client Prisma
        run: pnpm --filter @tentacle-tv/backend db:generate

      - name: Contrôles
        run: |
          pnpm typecheck
          pnpm --filter @tentacle-tv/tv-webos test

      # Le client n'est pas dans l'IPK, mais on le construit quand même : une
      # coquille livrée alors que le client ne compile pas ne servirait à rien,
      # et l'échec doit tomber ici plutôt que sur la dalle.
      - name: Construire le client servi sur /tv
        run: pnpm --filter @tentacle-tv/tv-webos build

      - name: Empaqueter la coquille
        run: pnpm --filter @tentacle-tv/tv-webos ipk

      - name: Nommer le paquet d'une façon stable
        id: paquet
        run: |
          set -euo pipefail
          SOURCE="$(find apps/tv-webos/dist-ipk -name '*.ipk' -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "::error::Aucun IPK produit dans apps/tv-webos/dist-ipk."
            exit 1
          fi
          mkdir -p livraison
          # Deux exemplaires du MÊME paquet : l'un versionné pour l'historique,
          # l'autre au nom fixe pour l'adresse de téléchargement permanente.
          cp "$SOURCE" "livraison/${{ env.IPK_STABLE }}"
          cp "$SOURCE" "livraison/tentacle-tv-${{ needs.prepare.outputs.version }}.ipk"
          ls -l livraison
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      # L'installateur voyage à part : il ne s'installe pas SUR le téléviseur,
      # il tourne sur l'ordinateur de l'utilisateur et va chercher l'IPK à
      # l'adresse fixe ci-dessous. Le `-X` évite les métadonnées d'archive
      # inutiles ; `zip` conserve le bit d'exécution des lanceurs, sans lequel
      # un double-clic ne ferait rien sur macOS et sous Linux.
      - name: Empaqueter l'installateur
        run: |
          set -euo pipefail
          test -x apps/tv-webos/installateur/installer.sh
          test -x apps/tv-webos/installateur/Installer-Tentacle-TV.command
          # Le dossier est renommé : ce qui apparaît après décompression doit
          # dire ce que c'est, sur un bureau où il côtoiera autre chose. Le nom
          # reste en ASCII pur — un zip sans drapeau UTF-8 est relu en CP437 par
          # l'Explorateur de Windows, et un tiret cadratin y devient un déchet.
          mkdir -p atelier
          cp -R apps/tv-webos/installateur "atelier/Tentacle TV - LG webOS"
          # Le test sert la CI, pas l'utilisateur : il n'a rien à faire dans une
          # archive dont chaque fichier doit se justifier au premier coup d'oeil.
          rm -f "atelier/Tentacle TV - LG webOS/"*.test.mjs
          (cd atelier && zip -r -X "../livraison/${{ env.INSTALLATEUR }}" .)
          unzip -l "livraison/${{ env.INSTALLATEUR }}"

      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk-${{ needs.prepare.outputs.version }}
          path: |
            livraison/*.ipk
            livraison/${{ env.INSTALLATEUR }}
          if-no-files-found: error

      # Le awk maison qui extrayait le bloc cède la place à la bibliothèque
      # partagée : lui ne s'arrêtait pas au séparateur « --- » du pied de page
      # et embarquait les titres « ### FR » / « ### EN » tels quels.
      - name: Extraire les notes de version
        if: needs.prepare.outputs.channel != 'build'
        run: |
          node .github/scripts/release-notes.mjs \
            --changelog changelogs/webos.md --version "${{ needs.prepare.outputs.version }}" \
            --format github --out notes.md
          cat notes.md

      # L'historique : une release par version, jamais réécrite.
      - name: Release versionnée
        if: needs.prepare.outputs.channel != 'build' 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webos-v${{ needs.prepare.outputs.version }}
          name: webOS ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          files: |
            livraison/*.ipk
            livraison/${{ env.INSTALLATEUR }}
          make_latest: false

      # L'adresse permanente : même tag, réécrit à chaque fois.
      - name: Release à adresse fixe
        if: needs.prepare.outputs.channel == 'store' 
        uses: softprops/action-gh-release@v2
        with:
          tag_name: webos-latest
          name: webOS — dernière version
          body: |
            Dernier paquet LG webOS — **version ${{ needs.prepare.outputs.version }}**.

            Cette release est réécrite à chaque livraison : les deux adresses de
            téléchargement ci-dessous ne changent jamais.

            ## Installer sur un téléviseur

            Le script demande l'adresse du téléviseur et la phrase secrète
            affichées par l'application « Developer Mode », puis fait tout le
            reste — Node.js compris : s'il manque, une copie portable est installée. Prérequis
            sur le téléviseur :
            « Developer Mode » installé avec un compte développeur LG — gratuit,
            à créer sur <https://webostv.developer.lge.com>.

            > Dans l'application « Developer Mode », il ne suffit PAS de mettre
            > `Dev Mode Status` sur ON : il faut aussi activer **`Key Server`**,
            > après le redémarrage. C'est lui, et lui seul, qui fait publier au
            > téléviseur la clé sans laquelle rien ne s'installe — et qui fait
            > apparaître la phrase secrète, en bas à gauche de l'écran.

            Une seule ligne à coller : elle télécharge la dernière version et lance
            l'installation. Le guide complet : https://tentacletv.app/webos/

            **macOS et Linux** — dans Terminal, la même ligne pour les deux :

            ```bash
            cd "$(mktemp -d)" && curl -fsSL -O https://github.com/${{ github.repository }}/releases/download/webos-latest/${{ env.INSTALLATEUR }} && unzip -q ${{ env.INSTALLATEUR }} && cd "Tentacle TV - LG webOS" && bash installer.sh
            ```

            Sur une installation Linux minimale, `curl` et `unzip` peuvent
            manquer — `sudo apt install curl unzip` sur Debian et Ubuntu.

            **Windows** — dans PowerShell :

            ```powershell
            [Net.ServicePointManager]::SecurityProtocol='Tls12'; $ProgressPreference='SilentlyContinue'; $d="$env:TEMP\tentacle-tv"; Remove-Item $d -Recurse -Force -EA 0; mkdir $d | Out-Null; iwr https://github.com/${{ github.repository }}/releases/download/webos-latest/${{ env.INSTALLATEUR }} -OutFile "$d\i.zip"; Expand-Archive "$d\i.zip" $d -Force; cd "$d\Tentacle TV - LG webOS"; .\Installer-Tentacle-TV.cmd
            ```

            Sinon, l'archive seule — à décompresser, puis double-clic sur
            `Installer-Tentacle-TV.cmd` (Windows) :

            ```
            https://github.com/${{ github.repository }}/releases/download/webos-latest/${{ env.INSTALLATEUR }}
            ```

            > Sur macOS, ne double-cliquez pas sur le `.command` : le Finder
            > refuse d'ouvrir tout fichier téléchargé qui n'est pas signé par un
            > développeur Apple payant, et le clic droit › Ouvrir ne contourne
            > plus ce blocage depuis macOS 15. Le refus ne vise que le Finder —
            > la commande ci-dessus, elle, passe sans rien avoir à débloquer.

            ## Le paquet seul

            ```
            https://github.com/${{ github.repository }}/releases/download/webos-latest/${{ env.IPK_STABLE }}
            ```

            L'IPK ne contient que la coquille — le client est servi par le
            serveur Tentacle sur `/tv`, donc une mise à jour du serveur suffit à
            corriger l'application.
          files: |
            livraison/${{ env.IPK_STABLE }}
            livraison/${{ env.INSTALLATEUR }}
          make_latest: false

# Utilitaire : liste les PISTES Play (identifiants API exacts) de l'app
# com.tentacletv.mobile + leurs releases. Sert à identifier une piste fermée
# personnalisée (ex. la piste Android TV, homonyme de la piste mobile dans
# l'UI mais avec un identifiant API distinct). Dispatch manuel uniquement.

name: Play — lister les pistes

on:
  workflow_dispatch:

# Jeton en LECTURE par défaut : chaque job qui écrit (tag, Release, push,
# image) le déclare lui-même, au plus juste.
permissions:
  contents: read

jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Aucun `npm install` : le client Play maison (lib/play-api.mjs), zéro
      # dépendance — l'ancien `npm install googleapis` tournait sans lockfile
      # et AVEC les scripts d'installation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Lister les pistes (androidpublisher v3)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/play-list-tracks.mjs com.tentacletv.mobile

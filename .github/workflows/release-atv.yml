# Tentacle TV — Apple TV / tvOS (TestFlight, natif, SANS EAS)
#
# Déclenché par un tag `atv-v<version>-<build>` (ex. atv-v1.0.0-1) OU manuellement.
# Tag dédié Apple TV (l'Android TV a `tv-v*`). L'app tvOS partage la fiche App Store
# Connect `com.tentacle.mobile` (universal app : iOS + macOS + tvOS).
#   - <version> → MARKETING_VERSION (CFBundleShortVersionString)
#   - <build>   → CURRENT_PROJECT_VERSION (CFBundleVersion)
# Le projet tvOS (apps/tv/ios) référence ces variables dans Info.plist → override
# direct via build settings xcodebuild (pas de plutil nécessaire, contrairement à iOS).
#
# Build : pnpm install → pod install (tvOS) → xcodebuild archive/export → altool -t tvos.
# Signature MANUELLE : cert Apple Distribution + profil App Store tvOS fourni en secret
# (TVOS_PROVISIONING_PROFILE_BASE64). La signature auto (clé API) refuse de créer un profil
# de distribution pour une 1re app tvOS → on signe en manuel. Upload via clé API ASC.
#
# ⚠️ Pré-requis côté Apple : la plateforme **tvOS** doit être activée sur la fiche App
# Store Connect `com.tentacle.mobile` (App Store Connect → Tentacle TV → + tvOS), sinon
# l'upload est refusé « no tvOS version ». Bundle id du projet déjà réglé sur com.tentacle.mobile.

name: Release Apple TV (TestFlight)

on:
  push:
    tags: ["atv-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version marketing (CFBundleShortVersionString)"
        type: string
        default: "1.0.0"
      build:
        description: "Build number (CFBundleVersion) — incrémenter pour chaque upload TestFlight"
        type: string
        default: "1"
      submit:
        description: "Envoyer à App Store Connect / TestFlight (sinon artefact .ipa seulement)"
        type: boolean
        default: true

concurrency:
  group: release-atv-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_TEAM_ID: "96K3M57W49"
  TV_SCHEME: "TentacleTV"
  TV_WORKSPACE: "apps/tv/ios/TentacleTV.xcworkspace"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      submit: ${{ steps.p.outputs.submit }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REST="${GITHUB_REF_NAME#atv-v}"   # 1.0.0-1
            VERSION="${REST%-*}"
            BUILD="${REST##*-}"
            SUBMIT=true
          else
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            SUBMIT="${{ inputs.submit }}"
          fi
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "submit=$SUBMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Build + submit tvOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4

      # Même Xcode/SDK qu'en local (Xcode 26.3) → builds acceptés par App Store (SDK tvOS 26+).
      - name: Select Xcode 26.3 (identique au local)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: CocoaPods install (tvOS)
        working-directory: apps/tv/ios
        run: pod install --repo-update

      - name: Import Apple Distribution certificate
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/app.p12

      # Signature MANUELLE : la signature auto (clé API) refuse de minter un profil
      # de distribution pour cette 1re app tvOS et retombe sur « développement ». On
      # installe donc le profil App Store tvOS fourni en secret et on signe en manuel.
      - name: Install tvOS App Store provisioning profile
        env:
          PROFILE_B64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/d5674922-c9b2-4fdf-9f1d-bebbd04c708c.mobileprovision"

      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY}.p8
          cp ~/private_keys/AuthKey_${API_KEY}.p8 ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Archive (xcodebuild tvOS, signature manuelle)
        run: |
          xcodebuild archive \
            -workspace "$TV_WORKSPACE" \
            -scheme "$TV_SCHEME" \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/TentacleTV-tvos.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Tentacle TV tvOS App Store" \
            MARKETING_VERSION="${{ needs.setup.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.setup.outputs.build }}"

      - name: Export .ipa (App Store, tvOS)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tentacle.mobile</key>
              <string>Tentacle TV tvOS App Store</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TentacleTV-tvos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-tvOS-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Submit to TestFlight (tvOS)
        if: needs.setup.outputs.submit == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/ipa/*.ipa -t tvos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

      - name: Set release notes (App Store / TestFlight tvOS)
        if: needs.setup.outputs.submit == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: TV_OS
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ needs.setup.outputs.build }}
        run: node .github/scripts/asc-release-notes.mjs

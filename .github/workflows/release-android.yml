# Tentacle TV — Android mobile APK (test / sideload)
#
# Déclenché par un tag `apk-v<version>-<build>` (tag dédié Android mobile) OU
# manuellement. Build un APK release de l'app mobile, signé avec le debug.keystore
# du repo → installable et partageable (sideload), SANS keystore Play Store.
#   - versionName ← apps/mobile/app.json (expo.version) — source unique du « package »
#   - versionCode ← suffixe <build> du tag (ou numéro de run en manuel)
#   Le tag ne fixe plus la version : seule app.json fait foi.
#
# TODO (compte Play validé) : keystore release → secrets MOBILE_KEYSTORE_BASE64 /
#   _PASSWORD / MOBILE_KEY_ALIAS + signingConfigs.release dans build.gradle, puis
#   décoder le keystore ici avant assembleRelease (ou bundleRelease pour le .aab).
#
# Sur tag : APK publié en Release GitHub. En manuel : APK en artefact du run.

name: Release Android mobile (APK test)

on:
  push:
    tags: ["apk-v*"]
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build mobile APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build release APK (debug-signed)
        working-directory: apps/mobile/android
        run: |
          # versionName = version du « package » apps/mobile/app.json (source unique).
          # versionCode = numéro de build : suffixe du tag apk-v<version>-<build>,
          # sinon le numéro de run (manuel). Le tag ne fixe plus la version.
          VNAME=$(node -p "require('../app.json').expo.version")
          if [ "${{ github.event_name }}" = "push" ]; then
            REST="${GITHUB_REF_NAME#apk-v}"
            if [[ "$REST" == *-* ]]; then VCODE="${REST##*-}"; else VCODE="${{ github.run_number }}"; fi
          else
            VCODE="${{ github.run_number }}"
          fi
          ARGS="-PmobileVersionName=$VNAME -PmobileVersionCode=$VCODE"
          echo "Android mobile build → versionName=$VNAME (app.json) versionCode=$VCODE"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon $ARGS

      - name: Stage APK assets
        run: |
          mkdir -p dist-apk
          SRC=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          cp "$SRC" "dist-apk/tentacle-mobile.apk"
          if [ "${{ github.event_name }}" = "push" ]; then
            cp "$SRC" "dist-apk/tentacle-mobile-${GITHUB_REF_NAME}.apk"
          fi
          ls -l dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-mobile-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (tag only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tentacle TV (Android mobile) ${{ github.ref_name }}"
          prerelease: true
          body: |
            APK Android mobile (sideload, debug-signed — PAS le Play Store).

            > Build de test en attendant le keystore release Play Store.
            > Installer en autorisant les sources inconnues sur l'appareil.
          files: dist-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Tentacle TV — recherche de secrets (gitleaks)
#
# Le filet du crochet `.githooks/pre-commit` : il relit les commits qu'une
# poussée ou une pull request apporte, avec la MÊME config (`.gitleaks.toml`).
# Un `--no-verify`, une machine sans gitleaks ou un commit fait sur GitHub ne
# passent donc pas sans être relus.
#
# ⚠️ POURQUOI PAS TOUT L'HISTORIQUE. Il porte un secret ancien (signalé dans le
# rapport de sécurisation du 2026-10-22) qui ne s'efface pas sans réécrire
# l'historique — et qui ne s'excuse pas dans `.gitleaks.toml` non plus. Relu à
# chaque run, il rendrait ce job rouge pour toujours, donc ignoré. On relit les
# commits NOUVEAUX ; le dispatch et la tâche hebdomadaire relisent l'ARBRE.
#
# ⚠️ PAS D'ACTION TIERCE : le binaire officiel, version et somme SHA-256
# épinglées ci-dessous (vérifiées contre `gitleaks_<v>_checksums.txt` de la
# release). Pour monter de version, changer les deux ensemble.

name: Secrets

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks (binaire épinglé)
        run: |
          set -eu
          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$ARCHIVE"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Portée : les commits que l'évènement apporte. Base introuvable (branche
      # neuve, réécriture) → ce qui n'est pas encore sur origin/main.
      - name: Relire les commits apportés
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
          fi
          if ! git rev-parse --verify --quiet "${BASE}^{commit}" >/dev/null; then
            BASE=$(git merge-base origin/main "$HEAD" || true)
          fi
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD"; else RANGE="-1 $HEAD"; fi
          echo "Commits relus : $RANGE"
          gitleaks git --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="$RANGE" .

      - name: Relire l'arbre
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --no-banner .

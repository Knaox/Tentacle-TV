# Tentacle TV — L'IMAGE DU SERVEUR, construite et publiée à UN SEUL endroit
#
# Workflow RÉUTILISABLE (workflow_call). Il ne se lance pas seul : il est
# appelé par les deux livraisons qui touchent l'image Docker.
#
#   • server.yml, mode « server » — LE SERVEUR change (backend + client web,
#     construits depuis le commit figé). Le client LG servi sous /tv est REPRIS
#     de l'image en service (`:latest`), jamais celui du commit : une livraison
#     serveur ne change plus ce que voient les téléviseurs.
#   • webos.yml, mode « webos » — LE CLIENT LG change (construit par webos.yml,
#     reçu en artefact). Le serveur est l'image déjà publiée de sa version
#     (`:vX.Y.Z`, versions.json → server), reprise à l'octet près : elle n'est
#     pas reconstruite.
#
# Le Dockerfile rend cela possible : ses étapes « tv-client-build », « tv-client »
# et « server » se remplacent par des contextes nommés (voir son en-tête).
#
# RIEN DE CE QUI DÉCIDE N'EST ÉCRIT ICI. `.github/scripts/server-image-plan.mjs`
# lit le registre et rend étiquettes, contextes, labels et Release ; la décision
# vit dans lib/server-image.mjs, testée hors ligne (test/server-image.test.mjs).
# Ce fichier se contente d'exécuter le plan :
#
#   | mode   | test                | store                          | Release (store)           |
#   |--------|---------------------|--------------------------------|---------------------------|
#   | server | :vS                 | :vS + :latest                  | server-vS (server.md)     |
#   | webos  | :vS-webos-W         | :vS-webos-W + :latest          | server-vS-webos-W         |
#   |        |                     |                                | (server-webos.md, [W])    |
#
# Au cran build, l'image est construite et rien n'est poussé. Au cran dev
# (serveur seulement, la branche `dev`) : `:dev` + `:dev-<sha>`, jamais
# `:latest`, aucune Release.
#
# LA BASCULE DE `:latest` EST UN COMPARE-AND-SWAP. Le plan note l'empreinte de
# `:latest` ; le job qui la bascule la relit juste avant d'écrire et refuse si
# elle a changé — une livraison serveur et une livraison webOS lancées en même
# temps ne s'écrasent plus l'une l'autre en silence. Son groupe de concurrence
# est commun aux deux workflows : les deux bascules ne se croisent jamais.

name: Image serveur (commune)

on:
  workflow_call:
    inputs:
      mode:
        description: "server (server.yml) ou webos (webos.yml)"
        type: string
        required: true
      channel:
        description: "build | test | store | dev (serveur seulement)"
        type: string
        required: true
      sha:
        description: "Le commit figé par le job prepare de l'appelant"
        type: string
        required: true
      tv-client-artifact:
        description: "Mode webos : l'artefact du run qui porte le client LG construit (client/dist)"
        type: string
        default: ""
    secrets:
      KLIPY_API_KEY:
        required: false
    outputs:
      tags:
        description: "Étiquettes posées, séparées par des virgules (vide au cran build)"
        value: ${{ jobs.plan.outputs.tags }}
      server-version:
        value: ${{ jobs.plan.outputs.server-version }}
      client-version:
        description: "Version webOS du client LG embarqué (vide si non étiqueté)"
        value: ${{ jobs.plan.outputs.client-version }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: knaox/tentacle-tv
  # Là où le mode webos dépose le client reçu : le contexte nommé « tv-client »
  # du plan le désigne par ce chemin.
  CLIENT_DIR: tv-client-dist

# Jeton en LECTURE par défaut : chaque job qui écrit (tag, Release, push,
# image) le déclare lui-même, au plus juste.
permissions:
  contents: read

jobs:
  plan:
    name: Plan de l'image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      push: ${{ steps.plan.outputs.push }}
      tags: ${{ steps.plan.outputs.tags }}
      contexts: ${{ steps.plan.outputs.contexts }}
      labels: ${{ steps.plan.outputs.labels }}
      expect-latest: ${{ steps.plan.outputs.expect-latest }}
      server-version: ${{ steps.plan.outputs.server-version }}
      client-version: ${{ steps.plan.outputs.client-version }}
      release: ${{ steps.plan.outputs.release }}
      release-tag: ${{ steps.plan.outputs.release-tag }}
      release-title: ${{ steps.plan.outputs.release-title }}
      release-changelog: ${{ steps.plan.outputs.release-changelog }}
      release-version: ${{ steps.plan.outputs.release-version }}
      release-latest: ${{ steps.plan.outputs.release-latest }}
      release-header: ${{ steps.plan.outputs.release-header }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # versions.json est lu au commit figé : c'est lui qui dit quel serveur
      # et quel client sont en jeu, pas la tête de main.
      - name: Lire le registre et décider
        id: plan
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          CHANNEL: ${{ inputs.channel }}
          SHA: ${{ inputs.sha }}
        run: |
          node .github/scripts/server-image-plan.mjs plan \
            --mode "$MODE" --channel "$CHANNEL" --sha "$SHA" \
            --image "${REGISTRY}/${IMAGE_NAME}" --client-dir "$CLIENT_DIR"

  build:
    name: Construire (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    # Chaque architecture sur sa propre machine : l'étape finale du Dockerfile
    # contient des RUN, qu'aucune émulation ne ralentit ainsi.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}

      - name: Récupérer le client LG construit par webos.yml
        if: inputs.mode == 'webos'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.tv-client-artifact }}
          path: ${{ env.CLIENT_DIR }}

      # Le Dockerfile le vérifie aussi ; ici l'échec dit tout de suite que
      # c'est l'artefact, et non l'image, qui est en cause.
      - name: Vérifier le client LG reçu
        if: inputs.mode == 'webos'
        run: |
          if [ ! -f "${CLIENT_DIR}/index.html" ]; then
            echo "::error::L'artefact « ${{ inputs.tv-client-artifact }} » ne porte pas de index.html : rien ne part."
            exit 1
          fi
          du -sh "$CLIENT_DIR"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Ce qui remplace une étape du Dockerfile : l'image en service pour
          # le client (mode server), l'image publiée du serveur et le client
          # reçu (mode webos). Chaque image y est épinglée par son empreinte.
          build-contexts: ${{ needs.plan.outputs.contexts }}
          labels: ${{ needs.plan.outputs.labels }}
          # Clé Klipy niveau application (GIFs du chat WT) — secret facultatif :
          # absent, les GIFs sont simplement désactivés dans l'image produite.
          # Le mode webos ne reconstruit pas le serveur : la clé n'y sert pas.
          # APK_REFRESH change à chaque run ET à chaque relance : la couche des
          # paquets Alpine ne sort jamais du cache (voir le Dockerfile).
          build-args: |
            ${{ inputs.mode == 'server' && format('KLIPY_API_KEY={0}', secrets.KLIPY_API_KEY) || '' }}
            ${{ inputs.mode == 'server' && format('APK_REFRESH={0}-{1}', github.run_id, github.run_attempt) || '' }}
          # Le cache ne sert qu'au build du serveur. Le mode webos ne l'écrit
          # pas : sous la même portée, il remplacerait celui du serveur.
          cache-from: ${{ inputs.mode == 'server' && format('type=gha,scope={0}', matrix.arch) || '' }}
          cache-to: ${{ inputs.mode == 'server' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}
          # Au cran « build » l'image reste sur le runner : rien n'est poussé
          # dans le registre. Elle est chargée dans le démon Docker local
          # (étiquette `:scan-<arch>`, jamais poussée) pour que le contrôle de
          # sécurité ci-dessous la lise ; poussée, elle l'est par empreinte
          # seule, SANS étiquette : rien n'est visible avant le job merge.
          outputs: ${{ needs.plan.outputs.push == 'true' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME) || format('type=docker,name={0}/{1}:scan-{2}', env.REGISTRY, env.IMAGE_NAME, matrix.arch) }}

      # ── Contrôle de sécurité, AVANT toute étiquette ─────────────────────────
      # L'image d'une architecture n'existe encore que par son empreinte : si
      # elle porte une vulnérabilité CRITICAL ou HIGH CORRIGEABLE, ce job
      # échoue, son empreinte n'est pas transmise, et merge (qui pose les
      # étiquettes et bascule `:latest`) ne tourne pas. Une vulnérabilité
      # acceptée en connaissance de cause va dans .trivyignore, justifiée et
      # datée (voir l'en-tête du fichier).
      - name: Référence de l'image à contrôler
        id: scanref
        env:
          PUSH: ${{ needs.plan.outputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sbom
          if [ "$PUSH" = "true" ]; then
            echo "ref=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REGISTRY}/${IMAGE_NAME}:scan-${ARCH}" >> "$GITHUB_OUTPUT"
          fi

      # Une image poussée par empreinte est un INDEX (image + attestations) :
      # sans plateforme explicite, Trivy et syft y cherchent celle de leur
      # binaire et échouent (« no child with platform linux/amd64 », vécu à la
      # livraison 1.31.2 sur arm64).
      - name: Trivy — vulnérabilités CRITICAL / HIGH corrigeables (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"

      # Un secret gravé dans une couche (clé, jeton, .env oublié) : signalé,
      # pas bloquant — la clé Klipy y est gravée VOLONTAIREMENT (voir le
      # Dockerfile), et un faux positif ne doit pas retenir une livraison.
      - name: Trivy — secrets dans les couches (signalés)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ steps.scanref.outputs.ref }}
          scanners: secret
          format: table
          exit-code: "0"
          skip-setup-trivy: true

      # L'inventaire des composants (SPDX), gardé en artefact ; au cran test,
      # store ou dev, le job sign l'attache à l'image comme attestation signée.
      - name: SBOM (syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_PLATFORM: ${{ matrix.platform }}
        with:
          image: ${{ steps.scanref.outputs.ref }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: /tmp/sbom/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.arch }}
          path: /tmp/sbom/sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # Au cran build (sortie docker), l'empreinte n'est qu'indicative :
          # merge ne tourne pas. Jamais un artefact vide pour autant.
          digest="${digest:-sha256:local-${{ matrix.arch }}}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # ── Signature et attestation, par EMPREINTE, avant toute étiquette ────────
  # Cosign « keyless » : aucune clé à garder, le certificat éphémère de
  # Sigstore atteste que l'image vient de CE workflow de CE dépôt (jeton OIDC
  # de GitHub), et la signature est inscrite au journal public Rekor. Chaque
  # image d'architecture est signée et reçoit son SBOM en attestation ; merge
  # signe ensuite l'index multi-arch. Seul ce job (et merge) reçoit id-token.
  # Vérifier : docs/server/image-security.md.
  sign:
    name: Signer (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Download digest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom-${{ matrix.arch }}
          path: /tmp/sbom

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Signer l'image et attester son SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$REGISTRY_TOKEN" | cosign login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          DIGEST="sha256:$(ls /tmp/digests)"
          REF="${IMAGE}@${DIGEST}"
          echo "Signature de ${REF}"
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate /tmp/sbom/sbom.spdx.json "$REF"

  merge:
    name: Publier les étiquettes
    runs-on: ubuntu-latest
    needs: [plan, build, sign]
    if: needs.plan.outputs.push == 'true'
    timeout-minutes: 15
    # COMMUN à server.yml et webos.yml (même workflow appelé) : deux bascules
    # de `:latest` s'attendent au lieu de se croiser.
    concurrency:
      group: server-image-latest
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # La signature de l'index multi-arch (dernière étape).
      id-token: write
    steps:
      - name: Checkout repository (le script de relecture)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le compare-and-swap. `:latest` doit être EXACTEMENT l'image lue par le
      # plan : c'est d'elle que la moitié reprise a été tirée (le client en
      # mode server, le serveur en service en mode webos). Si une autre
      # livraison l'a basculée entre-temps, publier ici effacerait la sienne.
      - name: Vérifier que « :latest » n'a pas bougé depuis le plan
        if: needs.plan.outputs.expect-latest != ''
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          EXPECTED: ${{ needs.plan.outputs.expect-latest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          CODE=0
          CURRENT=$(node .github/scripts/server-image-plan.mjs digest "${IMAGE}:latest") || CODE=$?
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 3 ]; then
            echo "::error::Relecture de :latest impossible — rien n'est basculé."
            exit 1
          fi
          if [ "$CURRENT" != "$EXPECTED" ]; then
            echo "::error::« :latest » a changé pendant ce run (${EXPECTED} → ${CURRENT:-absente}) : une autre livraison est passée. Rien n'est basculé ; relance cette livraison, elle repartira de la nouvelle image."
            exit 1
          fi
          echo "✓ :latest est toujours ${EXPECTED}."

      - name: Créer le manifeste multi-arch et le pousser
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LIST <<< "$TAGS"
          ARGS=()
          for tag in "${LIST[@]}"; do ARGS+=(-t "${IMAGE}:${tag}"); done
          echo "Étiquettes posées : ${LIST[*]}"
          # shellcheck disable=SC2046
          docker buildx imagetools create "${ARGS[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspecter le manifeste
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAGS%%,*}"

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # L'index multi-arch, par son EMPREINTE (jamais par une étiquette, qui
      # peut bouger) : c'est lui que `docker pull …:latest` résout. Les images
      # d'architecture qu'il désigne sont déjà signées (job sign).
      - name: Signer l'index multi-arch
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAGS%%,*}" --format '{{json .Manifest}}' | jq -r .digest)
          case "$DIGEST" in sha256:*) ;; *) echo "::error::empreinte de l'index illisible"; exit 1 ;; esac
          echo "Signature de ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "### Image signée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Release GitHub — au cran STORE seulement ────────────────────────────────
  # server-vS pour le serveur (notes : changelogs/server.md [S]) ;
  # server-vS-webos-W pour une reconstruction webOS (notes DÉDIÉES :
  # changelogs/server-webos.md [W]). Les deux blocs sont exigés par le pré-vol
  # du job prepare de l'appelant, avant le moindre build.
  release:
    name: Release GitHub
    runs-on: ubuntu-latest
    needs: [plan, merge]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Corps de release
        env:
          HEADER: ${{ needs.plan.outputs.release-header }}
          CHANGELOG: ${{ needs.plan.outputs.release-changelog }}
          VERSION: ${{ needs.plan.outputs.release-version }}
        run: |
          set -euo pipefail
          printf '%s\n\n' "$HEADER" > release-body.md
          # Pas de « || true » : le pré-vol a garanti que le bloc existe, et une
          # Release au corps vide n'a jamais rendu service à personne.
          node .github/scripts/release-notes.mjs \
            --changelog "$CHANGELOG" --version "$VERSION" \
            --format github --out notes.md
          cat notes.md >> release-body.md
          cat release-body.md

      - name: Créer la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.release-tag }}
          TITLE: ${{ needs.plan.outputs.release-title }}
          LATEST: ${{ needs.plan.outputs.release-latest }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::la Release ${TAG} existe déjà — on la laisse en place."
            exit 0
          fi
          # Une reconstruction webOS ne prend pas « Latest » à une vraie
          # version ; le serveur garde le choix automatique d'avant.
          LATEST_FLAG=()
          [ "$LATEST" = "false" ] && LATEST_FLAG=(--latest=false)
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-body.md \
            --target "$SHA" \
            "${LATEST_FLAG[@]}"

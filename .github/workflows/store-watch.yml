name: Store Watch (manifeste stores)

# Aligne le manifeste d'auto-update sur ce que les stores servent REELLEMENT.
#
# macOS : le cran store de desktop.yml ne patche pas ce bloc, et c'est voulu —
# entre la soumission et l'approbation d'Apple il s'ecoule des heures, et
# patcher tout de suite faisait annoncer aux utilisateurs une version encore
# introuvable sur le store : une pop-up vers le vide.
#
# Play (mobile + TV) : depuis que play-publish.mjs pose les releases en
# « completed », le workflow de livraison patche lui-meme son bloc. Le veilleur
# ne sert plus qu'a rattraper ce qui lui echappe — une promotion faite a la main
# dans la console, ou un examen Google qui traine. Il n'interroge donc Play QUE
# si le manifeste et versions.json divergent : rien a detecter, aucun appel.
#
# Toutes les 30 minutes + declenchable a la main. Idempotent : ne committe que
# si la version servie differe du manifeste ET que son bloc changelog existe.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version macOS en vente (ASC)
        id: live
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
        run: |
          LIVE=$(node .github/scripts/asc-live-version.mjs)
          echo "Version en vente sur l'App Store : ${LIVE}"
          echo "live=${LIVE}" >> "$GITHUB_OUTPUT"
      - name: Comparer au manifeste
        id: cmp
        run: |
          CURRENT=$(node -p "require('./updates/store-versions.json').macAppStore.version")
          echo "Manifeste : ${CURRENT} — ASC : ${{ steps.live.outputs.live }}"
          if [ "${CURRENT}" = "${{ steps.live.outputs.live }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Patcher le bloc macAppStore
        if: steps.cmp.outputs.changed == 'true'
        run: |
          node .github/scripts/patch-store-manifest.mjs "${{ steps.live.outputs.live }}" --only=mac
      # ── Play : uniquement s'il y a quelque chose a rattraper ──────────────
      - name: Pistes Play a verifier
        id: play
        run: |
          set -euo pipefail
          CHECKS=""
          MOBILE_MANIFEST=$(node -p "require('./updates/store-versions.json').playMobile.version")
          TV_MANIFEST=$(node -p "require('./updates/store-versions.json').playTv.version")
          MOBILE_WANTED=$(jq -r .mobile versions.json)
          TV_WANTED=$(jq -r .tv versions.json)
          [ "$MOBILE_MANIFEST" != "$MOBILE_WANTED" ] && CHECKS="$CHECKS mobile"
          [ "$TV_MANIFEST" != "$TV_WANTED" ] && CHECKS="$CHECKS tv"
          echo "A verifier :${CHECKS:- rien}"
          echo "checks=$CHECKS" >> "$GITHUB_OUTPUT"

      - name: Aligner les blocs Play
        if: steps.play.outputs.checks != ''
        continue-on-error: true
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CHECKS: ${{ steps.play.outputs.checks }}
        run: |
          set -uo pipefail
          for what in $CHECKS; do
            if [ "$what" = "mobile" ]; then
              TRACK="alpha"; CL="changelogs/mobile.md"; ONLY="play-mobile"; KEY="playMobile"
            else
              TRACK="tv:Alpha"; CL="changelogs/tv.md"; ONLY="play-tv"; KEY="playTv"
            fi
            LIVE=$(node .github/scripts/play-live-version.mjs --package com.tentacletv.mobile --track "$TRACK") || continue
            CURRENT=$(node -p "require('./updates/store-versions.json').${KEY}.version")
            [ "$LIVE" = "$CURRENT" ] && { echo "${KEY} : deja ${LIVE}."; continue; }
            echo "${KEY} : ${CURRENT} -> ${LIVE}"
            node .github/scripts/patch-store-manifest.mjs "$LIVE" --changelog="$CL" --only="$ONLY" || true
          done

      # Un seul commit pour les blocs qui ont bouge — l'action ne fait rien si
      # rien n'a change, et rejoue le rebase si quelqu'un est passe devant.
      - uses: ./.github/actions/push-main
        with:
          paths: updates/store-versions.json
          message: "chore(update) : manifeste des versions en ligne (veilleur)"

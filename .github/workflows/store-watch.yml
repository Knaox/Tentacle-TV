name: Store Watch (manifeste stores)

# Ce que les boutiques servent REELLEMENT — et rien d'autre : le job `watch`
# lit chaque boutique (.github/scripts/store-live.mjs), aligne le manifeste
# d'auto-update sur ce qu'elles servent, et le commite.
#
# macOS : le cran store de desktop.yml ne patche pas ce bloc, et c'est voulu —
# entre la soumission et l'approbation d'Apple il s'ecoule des heures, et
# patcher tout de suite faisait annoncer aux utilisateurs une version encore
# introuvable sur le store : une pop-up vers le vide.
#
# Play (mobile + TV) : MEME REGLE depuis le 2026-09-29. mobile.yml et tv.yml
# patchaient leur bloc des l'envoi a Google, au cran test compris : le site
# affichait la 1.9.0 de la piste fermee alors que la production servait la
# 1.8.1. Seul le veilleur les patche, quand la PRODUCTION sert la version :
# API de rapports Play (releases actives, lecture seule) et, pour le
# telephone, la fiche publique en recoupement. AUCUNE edition Play n'est
# ouverte ici : une edition ouverte pendant une publication peut invalider
# la sienne, et ce veilleur tourne toutes les trente minutes.
#
# Toutes les 30 minutes + declenchable a la main. Idempotent : ne committe
# que ce qui a change. Rien n'y publie quoi que ce soit dans une boutique.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Versions en ligne et manifeste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Chaque source echoue seule : un avertissement, sa valeur a null, et le
      # bloc correspondant du manifeste n'est pas touche.
      - name: Ce que chaque boutique sert
        id: live
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/store-live.mjs --out "$RUNNER_TEMP/live.json"
          echo "En ligne : $(cat "$RUNNER_TEMP/live.json")"
          echo "live=$(cat "$RUNNER_TEMP/live.json")" >> "$GITHUB_OUTPUT"

      - name: Aligner le manifeste
        env:
          LIVE: ${{ steps.live.outputs.live }}
        run: |
          set -euo pipefail
          live() { node -e 'process.stdout.write(JSON.parse(process.env.LIVE)[process.argv[1]] ?? "")' "$1"; }
          field() { node -e 'const b = require("./updates/store-versions.json")[process.argv[1]]; process.stdout.write(String((b && b[process.argv[2]]) ?? ""))' "$1" "$2"; }

          MAC=$(live macos)
          if [ -n "$MAC" ] && [ "$MAC" != "$(field macAppStore version)" ]; then
            echo "macAppStore : $(field macAppStore version) -> ${MAC}"
            node .github/scripts/patch-store-manifest.mjs "$MAC" --only=mac
          fi

          # Play : ce que sert la PRODUCTION, piste inscrite dans le bloc.
          align_play() {  # <cle live> <bloc> <--only> <changelog> <piste>
            local version current
            version=$(live "$1")
            current="$(field "$2" version)/$(field "$2" track)"
            if [ -z "$version" ]; then
              echo "$2 : version servie en production inconnue, bloc inchange."
              return 0
            fi
            if [ "$current" = "${version}/$5" ]; then
              echo "$2 : deja ${version} ($5)."
              return 0
            fi
            echo "$2 : ${current} -> ${version}/$5"
            node .github/scripts/patch-store-manifest.mjs "$version" --changelog="$4" --only="$3" --track="$5" \
              || echo "::warning title=Veilleur des stores::$2 : bloc ${version} introuvable dans $4, bloc inchange."
          }
          align_play android playMobile play-mobile changelogs/mobile.md production
          align_play androidtv playTv play-tv changelogs/tv.md tv:production

      # Un seul commit pour les blocs qui ont bouge — l'action ne fait rien si
      # rien n'a change, et rejoue le rebase si quelqu'un est passe devant.
      - uses: ./.github/actions/push-main
        with:
          paths: updates/store-versions.json
          message: "chore(update) : manifeste des versions en ligne (veilleur)"

      # Comme avant le veilleur multi-boutiques : App Store Connect muet (cle
      # expiree, revoquee) rougit le run. Les autres sources, plus fragiles ou
      # optionnelles, ne laissent qu'un avertissement.
      - name: App Store Connect a repondu
        env:
          LIVE: ${{ steps.live.outputs.live }}
        run: |
          node -e 'if (!JSON.parse(process.env.LIVE).macos) { console.log("::error title=Veilleur des stores::App Store Connect muet — version macOS inconnue, bloc macAppStore fige."); process.exit(1) }'

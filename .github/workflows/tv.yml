# Tentacle TV — TV (Android TV + Apple TV), UN SEUL DÉCLENCHEMENT
#
# TROIS CRANS, choisis au lancement (`channel`) :
#   • build — construire et archiver les artefacts. Rien ne part nulle part.
#   • test  — piste Play FERMÉE « tv:Alpha » en `completed` (donc PUBLIÉE, plus
#             de draft à promouvoir à la main) et TestFlight tvOS distribué au
#             groupe externe avec demande d'examen bêta.
#   • store — production Play à 100 %, et App Store tvOS soumis à l'examen avec
#             mise en vente automatique à l'approbation. Aucun clic ensuite.
#
# `promote` (par défaut vrai, au cran store seulement) REPREND LE BINAIRE DÉJÀ
# TESTÉ au lieu d'en reconstruire un autre.
#
# TOUT EST FIGÉ SUR UN COMMIT : le job `prepare` publie un `sha`, et chaque job
# checkout CE sha — y compris `apple-tv-attach`, qui attend jusqu'à 35 minutes.
#
# La version vient de versions.json → `tv` (SOURCE UNIQUE). L'entrée `version`
# du dispatch la BUMPE : prepare écrit versions.json, aligne
# apps/tv/package.json, commite, tague `tv-vX.Y.Z` et pousse.
#
# Builds AUTO-INCRÉMENTÉS (minutes depuis 2024-01-01 UTC) :
#   • tvOS CFBundleVersion = BUILD
#   • Android versionCode  = 2000000000 + BUILD (préfixe form-factor TV : jamais
#     de collision avec les versionCode mobile de la MÊME fiche Play, et l'AAB
#     TV — leanback requis — n'est jamais servi aux téléphones)
#
# Android TV — distribution PLAY UNIQUEMENT (plus d'APK GitHub / tv-latest) :
#   • AAB signé release (keystore d'upload MOBILE_* réutilisé) → Play Console,
#     MÊME app que le mobile (com.tentacletv.mobile).
#   • L'AAB signé est aussi archivé en ARTEFACT du run.
#   • Sans secrets keystore : build debug-signed, publication Play sautée.
#
# Apple TV (continue-on-error : n'empêche jamais l'Android TV de sortir) :
#   • xcodebuild tvOS, signature MANUELLE (profil TVOS_PROVISIONING_PROFILE_BASE64),
#     upload TestFlight via clé API ASC. Fiche partagée com.tentacle.mobile.
#
# Notes de version : changelogs/tv.md (bloc « ## [X.Y.Z] », ### FR / ### EN),
# EXIGÉ par le pré-vol de `prepare`. Limites : Play 500 car., App Store 4000.
# (Plus de Release GitHub depuis que la TV passe par Play : l'ancien en-tête
# annonçait encore « GitHub illimité ».)

name: Release TV

on:
  push:
    tags: ["tv-v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Cibles : all, ou une liste séparée par des virgules (androidtv, appletv)"
        type: string
        default: all
      channel:
        description: "Jusqu'où aller"
        type: choice
        options: [build, test, store]
        default: test
      version:
        description: "Version X.Y.Z à livrer (vide = versions.json inchangé)"
        type: string
        default: ""
      promote:
        description: "Au cran store : reprendre le binaire déjà testé au lieu de reconstruire"
        type: boolean
        default: true

concurrency:
  group: release-tv-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_TEAM_ID: "96K3M57W49"
  TV_SCHEME: "TentacleTV"
  TV_WORKSPACE: "apps/tv/ios/TentacleTV.xcworkspace"
  # Piste Play des tests fermés ANDROID TV. Les pistes par form factor sont
  # PRÉFIXÉES dans l'API : « tv:Alpha » = piste fermée Alpha du form factor TV
  # (≠ « alpha » qui est la piste MOBILE, homonyme dans l'UI de la console).
  # Lister les identifiants exacts : workflow « Play — lister les pistes ».
  PLAY_TV_TRACK: "tv:Alpha"
  # Même règle pour la production : le form factor TV a la sienne. Le préfixe
  # exact NE SE DEVINE PAS — play-publish.mjs refuse une piste inconnue en
  # listant celles qui existent, et « Play — lister les pistes »
  # (play-tracks.yml) les affiche à la demande. À confirmer avant la première
  # livraison au cran store.
  PLAY_TV_PRODUCTION: "tv:production"
  PLAY_PACKAGE: "com.tentacletv.mobile"

jobs:
  # ── Ce qui rend tout le reste reproductible (voir mobile.yml, même forme) ──
  prepare:
    name: Préparer la livraison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      vcode: ${{ steps.plan.outputs.vcode }}
      channel: ${{ steps.plan.outputs.channel }}
      androidtv: ${{ steps.plan.outputs.androidtv }}
      appletv: ${{ steps.plan.outputs.appletv }}
      play_track: ${{ steps.plan.outputs.play_track }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/require-quality
        with:
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump versions.json (si une version est demandée)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          WANTED: ${{ inputs.version }}
        run: node .github/scripts/bump-version.mjs tv "$WANTED"

      - uses: ./.github/actions/push-main
        id: pushed
        if: steps.bump.outputs.changed == 'true'
        with:
          paths: ${{ steps.bump.outputs.files }}
          message: "release(tv) : v${{ inputs.version }}"

      - name: Poser le tag tv-v*
        if: steps.pushed.outputs.committed == 'true'
        env:
          TAG: tv-v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::le tag $TAG existe déjà — on le laisse en place."
          else
            git tag "$TAG" "${{ steps.pushed.outputs.sha }}"
            git push origin "$TAG"
          fi

      - name: Plan du run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_PROMOTE: ${{ inputs.promote }}
          BUMPED_SHA: ${{ steps.pushed.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${BUMPED_SHA:-${{ github.sha }}}"
          git checkout --quiet "$SHA"
          VERSION=$(jq -r .tv versions.json)
          BUILD=$(( ( $(date +%s) - 1704067200 ) / 60 ))
          VCODE=$(( 2000000000 + BUILD ))

          if [ "$EVENT" = "push" ]; then
            TARGETS="androidtv,appletv"; CHANNEL=store; PROMOTE=false
            if [[ ! "${GITHUB_REF_NAME}" =~ ^tv-v${VERSION}(-r[0-9]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} ≠ tv-v${VERSION}[-rN] (versions.json → tv). Mets à jour versions.json (source unique) ou corrige le tag."
              exit 1
            fi
          else
            TARGETS="$IN_TARGETS"; CHANNEL="$IN_CHANNEL"; PROMOTE="$IN_PROMOTE"
          fi
          [ "$TARGETS" = "all" ] && TARGETS="androidtv,appletv"

          want() { case ",$TARGETS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          plan() {
            want "$1" || { echo skip; return; }
            if [ "$CHANNEL" = "store" ] && [ "$PROMOTE" = "true" ]; then echo promote; else echo build; fi
          }
          ANDROID=$(plan androidtv); APPLE=$(plan appletv)
          [ "$CHANNEL" = "store" ] && TRACK="${PLAY_TV_PRODUCTION}" || TRACK="${PLAY_TV_TRACK}"

          echo "TV ${VERSION} — cran ${CHANNEL} · androidtv=${ANDROID} · appletv=${APPLE} · piste ${TRACK} · build ${BUILD} · sha ${SHA}"
          {
            echo "sha=$SHA"; echo "version=$VERSION"; echo "build=$BUILD"; echo "vcode=$VCODE"
            echo "channel=$CHANNEL"; echo "androidtv=$ANDROID"; echo "appletv=$APPLE"
            echo "play_track=$TRACK"; echo "tag=tv-v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Pré-vol des notes de version
        if: steps.plan.outputs.channel != 'build'
        run: |
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/tv.md --version "${{ steps.plan.outputs.version }}" \
            --check play --check asc:atv

  # ── Android TV : l'AAB seulement, la publication est le job « play ». ──────
  android-tv:
    needs: prepare
    if: needs.prepare.outputs.androidtv == 'build'
    name: Android TV (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Par défaut l'action installe « tools », paquet retiré du SDK : avec
          # les cmdline-tools 16.0 des runners, sdkmanager échoue avant le build.
          packages: platform-tools

      - name: Install NDK (matches build.gradle ndkVersion)
        run: sdkmanager "ndk;29.0.14206865"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/tv/android/**/*.gradle*', 'apps/tv/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # Keystore d'upload : le MÊME que le mobile (une clé peut signer plusieurs
      # apps ; ici c'est de toute façon la même app Play). Absent → debug-signed.
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MOBILE_KEYSTORE_BASE64 absent — APK debug-signed, upload Play sauté."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release (AAB)
        working-directory: apps/tv/android
        env:
          KS_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          ARGS="-PtvVersionName=${{ needs.prepare.outputs.version }} -PtvVersionCode=${{ needs.prepare.outputs.vcode }}"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ARGS="$ARGS -PtvKeystoreFile=$RUNNER_TEMP/upload.jks -PtvKeystorePassword=$KS_PASSWORD -PtvKeyAlias=$KS_ALIAS -PtvKeyPassword=$KS_KEY_PASSWORD"
          fi
          echo "Android TV build → versionName=${{ needs.prepare.outputs.version }} versionCode=${{ needs.prepare.outputs.vcode }}"
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon $ARGS

      # AAB signé toujours archivé : PREMIÈRE soumission Play (upload manuel
      # dans la console) et secours si l'API échoue.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-tv-aab
          path: apps/tv/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ── Play : envoi OU promotion. MÊME groupe de concurrence que mobile.yml —
  #    les deux écrivent la fiche com.tentacletv.mobile, et deux éditions
  #    concurrentes s'invalident l'une l'autre.
  play:
    needs: [prepare, android-tv]
    if: >-
      !cancelled() && needs.prepare.outputs.channel != 'build'
      && (needs.prepare.outputs.androidtv == 'promote'
          || (needs.prepare.outputs.androidtv == 'build' && needs['android-tv'].result == 'success'))
    name: Play Console (${{ needs.prepare.outputs.play_track }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: play-com.tentacletv.mobile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Récupérer l'AAB
        if: needs.prepare.outputs.androidtv == 'build'
        uses: actions/download-artifact@v4
        with:
          name: tentacle-tv-aab
          path: aab

      - name: Publier
        id: publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ needs.prepare.outputs.androidtv }}" = "promote" ]; then
            SOURCE="--promote-from ${{ env.PLAY_TV_TRACK }}"
          else
            SOURCE="--aab aab/app-release.aab"
          fi
          # shellcheck disable=SC2086
          node .github/scripts/play-publish.mjs \
            --package "${{ env.PLAY_PACKAGE }}" \
            --track "${{ needs.prepare.outputs.play_track }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --changelog changelogs/tv.md $SOURCE

      # Le manifeste est repris de `main` et non du sha figé : d'autres jobs
      # écrivent le même fichier, repartir d'une copie périmée effacerait leur
      # bloc. Le CHANGELOG, lui, reste celui du sha figé.
      - name: Aligner updates/store-versions.json
        if: steps.publish.outputs.committed == 'true'
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- updates/store-versions.json
          node .github/scripts/patch-store-manifest.mjs "${{ needs.prepare.outputs.version }}" \
            --changelog=changelogs/tv.md --only=play-tv
      - uses: ./.github/actions/push-main
        if: steps.publish.outputs.committed == 'true'
        with:
          paths: updates/store-versions.json
          message: "chore(update) : manifeste Play TV ${{ needs.prepare.outputs.version }} (${{ needs.prepare.outputs.play_track }})"

  # ── Apple TV ───────────────────────────────────────────────────────────────
  apple-tv:
    needs: prepare
    if: needs.prepare.outputs.appletv == 'build'
    name: Apple TV (tvOS TestFlight)
    runs-on: macos-latest
    timeout-minutes: 90
    # L'app tvOS reste à finaliser : son échec ne doit jamais retenir l'Android TV.
    continue-on-error: true
    # Ce `continue-on-error` fait passer un ÉCHEC pour un succès auprès de
    # `needs` : les jobs suivants ne peuvent donc pas se fier à `result`. Cette
    # sortie dit la vérité — l'envoi a-t-il vraiment eu lieu.
    outputs:
      uploaded: ${{ steps.upload.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4

      # Même Xcode/SDK qu'en local (builds acceptés par App Store, SDK tvOS 26+).
      - name: Select Xcode 26.3 (identique au local)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: CocoaPods install (tvOS)
        working-directory: apps/tv/ios
        run: pod install --repo-update

      - name: Import Apple Distribution certificate
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/app.p12

      # Signature MANUELLE : la signature auto (clé API) refuse de minter un profil
      # de distribution pour une 1re app tvOS → profil App Store tvOS en secret.
      - name: Install tvOS App Store provisioning profile
        env:
          PROFILE_B64: ${{ secrets.TVOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/d5674922-c9b2-4fdf-9f1d-bebbd04c708c.mobileprovision"

      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY}.p8
          cp ~/private_keys/AuthKey_${API_KEY}.p8 ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"

      - name: Archive (xcodebuild tvOS, signature manuelle)
        run: |
          xcodebuild archive \
            -workspace "$TV_WORKSPACE" \
            -scheme "$TV_SCHEME" \
            -configuration Release \
            -destination "generic/platform=tvOS" \
            -archivePath "$RUNNER_TEMP/TentacleTV-tvos.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Tentacle TV tvOS App Store" \
            MARKETING_VERSION="${{ needs.prepare.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ needs.prepare.outputs.build }}"

      - name: Export .ipa (App Store, tvOS)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tentacle.mobile</key>
              <string>Tentacle TV tvOS App Store</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TentacleTV-tvos.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-tvOS-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Envoi TestFlight (tvOS)
        id: upload
        if: needs.prepare.outputs.channel != 'build'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/ipa/*.ipa -t tvos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Poser les notes (App Store / TestFlight tvOS)
        if: needs.prepare.outputs.channel != 'build'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: TV_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/tv.md
        run: node .github/scripts/asc-release-notes.mjs

  # Attend le traitement ASC puis rattache et distribue. Le job amont est
  # `continue-on-error`, donc son échec passerait pour un succès auprès de
  # `needs` : on teste explicitement `outcome`, sans quoi ce job sonderait
  # pendant 35 minutes un build qui n'a jamais été envoyé.
  apple-tv-attach:
    needs: [prepare, apple-tv]
    if: >-
      needs.prepare.outputs.appletv == 'build'
      && needs.prepare.outputs.channel != 'build'
      && needs['apple-tv'].outputs.uploaded == 'true'
    name: Apple TV — rattacher et distribuer
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Attendre le traitement ASC + rattacher le build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: TV_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/tv.md
        run: node .github/scripts/asc-attach-build.mjs
      - name: Distribuer au groupe de test
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: TV_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_TVOS_ID }}
        run: node .github/scripts/asc-testflight-distribute.mjs

  apple-tv-review:
    needs: [prepare, apple-tv-attach]
    if: >-
      !cancelled() && needs.prepare.outputs.channel == 'store'
      && needs.prepare.outputs.appletv != 'skip'
      && (needs.prepare.outputs.appletv == 'promote' || needs['apple-tv-attach'].result == 'success')
    name: Apple TV — soumettre à l'examen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Les « Nouveautés » sont reposées ICI, juste avant l'envoi — même geste
      # que mac-review (desktop.yml). Au cran « promote », aucun autre job ne
      # les écrit : c'est le seul moyen de réparer des notes refusées sans
      # reconstruire, et sans elles la version ne peut pas entrer dans la
      # soumission (macOS 1.22.0 : « ✓ » refusé, 409). Mêmes variables que la
      # pose du premier passage ; au promote, BUILD ne désigne aucun build
      # existant : « À tester » est ignoré, seules les notes App Store partent.
      - name: Poser les notes (App Store)
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}

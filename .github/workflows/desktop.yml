# Tentacle TV — BUREAU (macOS App Store + Microsoft Store + Linux)
#
# TROIS CRANS, choisis au lancement (`channel`) :
#   • build — construire et archiver les artefacts. Rien ne part nulle part.
#   • test  — macOS : TestFlight + distribution au groupe externe.
#             Linux : Release GitHub en PRÉ-VERSION, manifeste NON patché — donc
#             l'auto-updater ne propose rien, mais le paquet est téléchargeable.
#             Windows : artefact MSIX seulement. Le Microsoft Store n'a PAS de
#             canal de test : une soumission y est publique par construction.
#   • store — macOS soumis à l'examen, mise en vente automatique à l'approbation.
#             Windows soumis au Microsoft Store (publication immédiate).
#             Linux : Release publiée et manifeste patché. Aucun clic ensuite.
#
# `promote` (par défaut vrai, au cran store) reprend ce qui a déjà été testé :
# macOS soumet le build DÉJÀ rattaché, Linux bascule sa pré-version en version
# publiée sans rien reconstruire. Windows fait exception — le Microsoft Store
# exige le paquet à chaque soumission, donc il rebâtit toujours.
#
# TOUT EST FIGÉ SUR UN COMMIT : le job `prepare` publie un `sha`, et chaque job
# checkout CE sha — y compris `mac-attach`, qui attend jusqu'à 35 minutes, et
# les jobs de manifeste, qui lisaient jusqu'ici le changelog à `main`.
#
# La version vient de versions.json → `desktop` (SOURCE UNIQUE). L'entrée
# `version` du dispatch la BUMPE : prepare écrit versions.json, aligne
# apps/desktop-electron/package.json (la version du bundle, lue par « À
# propos »), commite, tague `desktop-vX.Y.Z` et pousse.
#
# Build AUTO-INCRÉMENTÉ : minutes depuis 2024-01-01 UTC (CFBundleVersion).
#
# ⚠️ Microsoft Store : la version soumise doit être STRICTEMENT SUPÉRIEURE à la
# publiée. Re-livrer Windows exige donc un vrai bump, un suffixe -rN ne suffit pas.
#
# Notes de version : changelogs/desktop.md. Les blocs par canal « ## [mac-X.Y.Z] »
# et « ## [win-X.Y.Z] » remplacent le bloc nu pour ces cibles-là — le bloc nu
# dépasse régulièrement les 1500 caractères du Microsoft Store, qui coupe à la
# puce en silence. Le pré-vol de `prepare` dit AVANT le build de combien ça mord.

name: Release Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Cibles : all, ou une liste séparée par des virgules (macos, windows, linux)"
        type: string
        default: all
      channel:
        description: "Jusqu'où aller"
        type: choice
        options: [build, test, store]
        default: test
      version:
        description: "Version X.Y.Z à livrer (vide = versions.json inchangé)"
        type: string
        default: ""
      promote:
        description: "Au cran store : reprendre ce qui a déjà été testé (sans effet sur Windows)"
        type: boolean
        default: true

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  SIGN_APP: "Apple Distribution: Damien ROUGE (96K3M57W49)"
  SIGN_PKG: "3rd Party Mac Developer Installer: Damien ROUGE (96K3M57W49)"
  STORE_ID: "9NKHL0T84245"

jobs:
  # ── Ce qui rend tout le reste reproductible (voir mobile.yml, même forme) ──
  prepare:
    name: Préparer la livraison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      tag: ${{ steps.plan.outputs.tag }}
      siblings: ${{ steps.plan.outputs.siblings }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/require-quality
        with:
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump versions.json (si une version est demandée)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          WANTED: ${{ inputs.version }}
        run: node .github/scripts/bump-version.mjs desktop "$WANTED"

      - uses: ./.github/actions/push-main
        id: pushed
        if: steps.bump.outputs.changed == 'true'
        with:
          paths: ${{ steps.bump.outputs.files }}
          message: "release(desktop) : v${{ inputs.version }}"

      - name: Poser le tag desktop-v*
        if: steps.pushed.outputs.committed == 'true'
        env:
          TAG: desktop-v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::le tag $TAG existe déjà — on le laisse en place."
          else
            git tag "$TAG" "${{ steps.pushed.outputs.sha }}"
            git push origin "$TAG"
          fi

      - name: Plan du run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_PROMOTE: ${{ inputs.promote }}
          BUMPED_SHA: ${{ steps.pushed.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${BUMPED_SHA:-${{ github.sha }}}"
          git checkout --quiet "$SHA"
          VERSION=$(jq -r .desktop versions.json)
          BUILD=$(( ( $(date +%s) - 1704067200 ) / 60 ))
          TAG="desktop-v$VERSION"

          if [ "$EVENT" = "push" ]; then
            TARGETS="macos,windows,linux"; CHANNEL=store; PROMOTE=false
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "${GITHUB_REF_NAME}" =~ ^desktop-v${VERSION}(-r[0-9]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} ≠ desktop-v${VERSION}[-rN] (versions.json → desktop). Mets à jour versions.json (source unique) ou corrige le tag."
              exit 1
            fi
          else
            TARGETS="$IN_TARGETS"; CHANNEL="$IN_CHANNEL"; PROMOTE="$IN_PROMOTE"
          fi
          [ "$TARGETS" = "all" ] && TARGETS="macos,windows,linux"

          want() { case ",$TARGETS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          plan() {
            want "$1" || { echo skip; return; }
            if [ "$CHANNEL" = "store" ] && [ "$PROMOTE" = "true" ]; then echo promote; else echo build; fi
          }
          MACOS=$(plan macos); LINUX=$(plan linux)
          # Windows ne connaît pas la promotion : le Microsoft Store veut le
          # paquet à chaque soumission, il n'y a rien à « faire monter ».
          want windows && WINDOWS=build || WINDOWS=skip

          # Ce que la Release Linux peut honnêtement annoncer comme partant
          # avec elle. Une livraison Linux seule ne doit pas promettre l'App
          # Store et le Microsoft Store, comme elle le faisait en dur.
          SIBLINGS=""
          [ "$MACOS" != skip ] && SIBLINGS="macOS : App Store"
          if [ "$WINDOWS" != skip ]; then
            [ -n "$SIBLINGS" ] && SIBLINGS="$SIBLINGS — Windows : Microsoft Store" || SIBLINGS="Windows : Microsoft Store"
          fi

          echo "Desktop ${VERSION} — cran ${CHANNEL} · macos=${MACOS} · windows=${WINDOWS} · linux=${LINUX} · build ${BUILD} · sha ${SHA}"
          {
            echo "sha=$SHA"; echo "version=$VERSION"; echo "build=$BUILD"; echo "channel=$CHANNEL"
            echo "macos=$MACOS"; echo "windows=$WINDOWS"; echo "linux=$LINUX"
            echo "tag=$TAG"; echo "siblings=$SIBLINGS"
          } >> "$GITHUB_OUTPUT"

      # Le pré-vol demande les TROIS jeux de notes que le bureau consomme : le
      # canal « mac » pour App Store Connect, « win » pour le Microsoft Store,
      # et le bloc nu pour la Release Linux.
      - name: Pré-vol des notes de version
        if: steps.plan.outputs.channel != 'build'
        run: |
          CHECKS=""
          [ "${{ steps.plan.outputs.macos }}" != skip ] && CHECKS="$CHECKS --check asc:mac"
          [ "${{ steps.plan.outputs.windows }}" != skip ] && CHECKS="$CHECKS --check msstore:win"
          [ "${{ steps.plan.outputs.linux }}" != skip ] && CHECKS="$CHECKS --check github"
          # shellcheck disable=SC2086
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/desktop.md --version "${{ steps.plan.outputs.version }}" $CHECKS
  # ── macOS App Store (Electron) ───────────────────────────────────────────
  # 1) Chaîne LGPL par architecture : dylibs mpv/FFmpeg + paquet natif de koffi.
  #    Ce qui reste par architecture, c'est ce qui se COMPILE : mpv et FFmpeg
  #    (~1 h par runner), donc les deux tournent en parallèle.
  mac-libs:
    needs: prepare
    if: needs.prepare.outputs.macos == 'build'
    name: macOS libs LGPL (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            label: Apple Silicon
          - os: macos-15-intel
            arch: x64
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # mpv sans `gpl=true`, FFmpeg sans `--enable-gpl`, ni x264 ni x265 : la
      # LECTURE est intacte (les encodeurs GPL ne servent qu'à encoder) et le
      # script échoue de lui-même si un composant GPL ou un symbole `_lzma_*`
      # s'invite. C'est la chaîne déjà validée par Apple.
      - name: Build LGPL libmpv/FFmpeg
        run: bash apps/desktop-electron/scripts/build-mpv-lgpl-macos.sh

      # Le binaire natif de koffi n'existe QUE pour l'architecture du runner :
      # `pnpm install` n'installe pas le paquet de l'autre (contrainte `cpu` du
      # paquet). C'est donc ici qu'on le récolte — le paquet universel a besoin
      # des deux, sans quoi la lecture meurt sur la moitié des machines.
      - name: Rassembler dylibs + paquet natif koffi
        run: |
          mkdir -p sortie/lib
          cp apps/desktop-electron/lib/mpv/*.dylib sortie/lib/
          cp -R "node_modules/@koromix/koffi-darwin-${{ matrix.arch }}" sortie/koffi-pkg

      - name: Upload libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-libs-${{ matrix.arch }}
          path: sortie
          if-no-files-found: error
          retention-days: 5

  # 2) Paquet Electron universel + signature App Store + .pkg + envoi + notes
  mac-package:
    needs: [prepare, mac-libs]
    if: needs.prepare.outputs.macos == 'build'
    name: macOS universal package + envoi
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          # 24 et non 20 : la coquille s'appuie sur `node:sqlite`, et sa
          # compilation comme l'empaquetage tournent sous ce Node-là.
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Import signing certificates + provisioning profile
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PKG_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          PKG_CERT_PW: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          echo "$PKG_CERT" | base64 --decode > /tmp/pkg.p12
          security import /tmp/pkg.p12 -k build.keychain -P "$PKG_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "$PROFILE" | base64 --decode > /tmp/embedded.provisionprofile
          rm -f /tmp/app.p12 /tmp/pkg.p12

      # Une dylib mono-architecture dans un paquet universel ne se voit pas au
      # build : elle se voit au premier film, sur l'autre moitié du parc.
      - name: Fusionner les dylibs LGPL (arm64 ⊕ x86_64)
        run: |
          bash apps/desktop-electron/scripts/lipo-libs.sh \
            artifacts/mac-libs-arm64/lib \
            artifacts/mac-libs-x64/lib \
            /tmp/lib-universal

      # Le runner est en Apple Silicon : le paquet natif koffi x86_64 n'y est pas
      # installable, il vient du runner Intel.
      - name: Poser le paquet natif koffi x86_64
        run: |
          rm -rf node_modules/@koromix/koffi-darwin-x64
          cp -R artifacts/mac-libs-x64/koffi-pkg node_modules/@koromix/koffi-darwin-x64

      # `build:appstore` = build web avec `VITE_DIST_CHANNEL=appstore` (donc la
      # détection de MAJ passe par le manifeste du dépôt et l'ouverture de la
      # fiche App Store) + compilation de la coquille.
      - name: Build web (canal App Store) + coquille
        run: pnpm --filter @tentacle-tv/desktop-electron build:appstore

      # `--version` écrit la version DANS le paquet livré : c'est elle que rend
      # `app.getVersion()`, donc celle que la détection de mise à jour compare au
      # manifeste `updates/store-versions.json`. `--build` = CFBundleVersion.
      - name: Empaqueter, signer, .pkg
        run: |
          node apps/desktop-electron/scripts/package-macos.mjs \
            --lib /tmp/lib-universal \
            --arch universal \
            --version "${{ needs.prepare.outputs.version }}" \
            --build "${{ needs.prepare.outputs.build }}" \
            --sign "$SIGN_APP" \
            --pkg-sign "$SIGN_PKG" \
            --profile /tmp/embedded.provisionprofile \
            --pkg-out "$GITHUB_WORKSPACE/Tentacle-TV.pkg"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-AppStore-pkg
          path: "*.pkg"

      - name: Envoi à App Store Connect
        if: needs.prepare.outputs.channel != 'build'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY}.p8
          xcrun altool --upload-app -f *.pkg -t macos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

      # Notes FR+EN depuis changelogs/desktop.md (canal « mac »). Non bloquant :
      # le pré-vol a déjà garanti le bloc, et asc-attach-build les repose.
      - name: Poser les notes (App Store / TestFlight)
        if: needs.prepare.outputs.channel != 'build'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/asc-release-notes.mjs

  # 3) Attend le traitement ASC (~10-35 min), rattache le build et le distribue.
  mac-attach:
    needs: [prepare, mac-package]
    if: needs.prepare.outputs.macos == 'build' && needs.prepare.outputs.channel != 'build' && needs['mac-package'].result == 'success'
    name: macOS — rattacher et distribuer
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Attendre le traitement ASC + rattacher le build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/asc-attach-build.mjs
      - name: Distribuer au groupe de test
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_MACOS_ID }}
        run: node .github/scripts/asc-testflight-distribute.mjs

  # 4) Le dernier geste manuel côté Apple. Au cran store seulement.
  mac-review:
    needs: [prepare, mac-attach]
    if: >-
      !cancelled() && needs.prepare.outputs.channel == 'store'
      && needs.prepare.outputs.macos != 'skip'
      && (needs.prepare.outputs.macos == 'promote' || needs['mac-attach'].result == 'success')
    name: macOS — soumettre à l'examen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Les « Nouveautés » sont reposées ICI, juste avant l'envoi : au cran
      # « promote », aucun autre job ne les écrit, et c'est le seul moyen de
      # réparer des notes refusées sans reconstruire. Sans elles, la version
      # ne peut pas entrer dans la soumission (1.22.0 : « ✓ » refusé, 409).
      # Au promote, BUILD ne désigne aucun build existant : « À tester » est
      # alors ignoré, seules les notes App Store sont écrites.
      - name: Poser les notes (App Store)
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/asc-release-notes.mjs
      - name: Soumettre à l'examen App Store
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/asc-submit-review.mjs

  # ── Windows : MSIX + soumission Microsoft Store ────────────────────────────
  # Le Microsoft Store n'a PAS de canal de test : une soumission y est publique
  # par construction. Au cran « test », on s'arrête donc à l'artefact MSIX.
  windows-store:
    needs: prepare
    if: needs.prepare.outputs.windows == 'build'
    name: Windows MSIX + soumission Store
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          # 24 et non 20 : la coquille Electron s'appuie sur `node:sqlite`, et
          # le script d'empaquetage tourne sous ce Node-là.
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Injecter la version (versions.json) dans le paquet Electron
        # « À propos » lit `app.getVersion()`, c'est-à-dire la version du
        # package.json EMBARQUÉ. Sans ce patch, l'exe livré annonce la version
        # du dépôt au lieu de celle du tag. Même geste que côté Tauri, où la
        # version vivait dans `tauri.conf.json`.
        shell: pwsh
        run: node -e "const f='apps/desktop-electron/package.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');" "${{ needs.prepare.outputs.version }}"

      - name: Build + empaquetage Electron
        # `pnpm package` enchaîne le build web, la compilation de la coquille et
        # `@electron/packager`. Sortie : un dossier `Tentacle TV.exe` +
        # `resources/`, exactement ce que `makeappx` attend.
        working-directory: apps/desktop-electron
        run: pnpm package

      - name: Assemble MSIX payload + manifest versionné
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "msixstage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Le paquet Electron est repris EN ENTIER : l'exe, mais aussi les
          # locales, les .pak et les DLL de Chromium. En oublier une donne un
          # paquet qui s'installe et ne démarre pas.
          $paquet = "apps\desktop-electron\release\Tentacle TV-win32-x64"
          if (-not (Test-Path (Join-Path $paquet "Tentacle TV.exe"))) {
            throw "Sortie d'empaquetage introuvable : $paquet"
          }

          Copy-Item (Join-Path $paquet "*") $stage -Recurse -Force

          # Tuiles du Store : inchangées, elles appartiennent au manifeste.
          Copy-Item "apps\desktop-electron\msix\Assets" (Join-Path $stage "Assets") -Recurse
          $m = Get-Content "apps\desktop-electron\msix\Package.appxmanifest" -Raw
          $m = $m -creplace '\bVersion="[\d\.]+"', ('Version="' + $ver + '.0"')
          Set-Content (Join-Path $stage "AppxManifest.xml") $m -Encoding UTF8

          "STAGE=$stage" >> $env:GITHUB_ENV
          "MSIX_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Payload assemblé pour version $ver.0"
          Get-ChildItem $stage | Select-Object Name, Length

      - name: Pack MSIX (makeappx, non signé)
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          Write-Host "makeappx: $makeappx"
          $out = Join-Path $env:RUNNER_TEMP "TentacleTV.msix"
          & $makeappx pack /d "$env:STAGE" /p $out /nv /o
          if (-not (Test-Path $out)) { throw "MSIX non produit" }
          "MSIX_PATH=$out" >> $env:GITHUB_ENV

      - name: Upload MSIX (secours / upload manuel)
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-tv-msix
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: error

      - name: Zip MSIX (payload d'upload API)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "TentacleTV-msix.zip"
          Compress-Archive -Path $env:MSIX_PATH -DestinationPath $zip -Force
          "PACKAGE_ZIP=$zip" >> $env:GITHUB_ENV

      # Notes FR/EN depuis changelogs/desktop.md (canal « win », repli sur le
      # bloc nu). La soumission publie IMMÉDIATEMENT — d'où le cran store seul.
      - name: Soumettre au Microsoft Store (API, notes FR/EN, publication auto)
        if: needs.prepare.outputs.channel == 'store'
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
          STORE_ID: ${{ env.STORE_ID }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          PACKAGE_FILE_NAME: TentacleTV.msix
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/msstore-submit.mjs

  # ── Linux (.deb / .rpm / .pkg.tar.zst / AppImage) → Release desktop-vX.Y.Z ──
  #
  # ⚠️ `ubuntu-22.04` et pas plus récent, DÉLIBÉRÉMENT : la glibc est compatible
  # vers l'avant et jamais vers l'arrière. Une chaîne bâtie ici tourne sur Arch ;
  # l'inverse serait faux.
  linux:
    needs: prepare
    if: needs.prepare.outputs.linux == 'build'
    name: Linux .deb / .rpm / .pkg.tar.zst / AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # `rpm` fournit rpmbuild, `libarchive-tools` fournit bsdtar — fpm en a
      # besoin pour le .rpm et le .pkg.tar.zst respectivement, et échoue sans.
      - name: Outils d'empaquetage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools fakeroot

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      # La chaîne mpv est longue à bâtir (~40 min) et ne change que quand la
      # RECETTE change : la clé est l'empreinte du script, pas celle du dépôt.
      - name: Cache de la chaîne mpv LGPL
        uses: actions/cache@v4
        with:
          path: ~/.cache/tentacle-mpv-linux
          key: mpv-lgpl-linux-${{ hashFiles('apps/desktop-electron/scripts/build-mpv-linux.sh') }}

      - name: Chaîne mpv LGPL (bâtie si absente du cache)
        run: |
          if [ -f "$HOME/.cache/tentacle-mpv-linux/libmpv.so.2" ]; then
            echo "Chaîne restaurée depuis le cache :"
            ls -l "$HOME/.cache/tentacle-mpv-linux" | head -20
          else
            bash apps/desktop-electron/scripts/build-mpv-linux.sh \
              --sortie "$HOME/.cache/tentacle-mpv-linux"
          fi

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # Même geste que pour Windows et macOS : `app.getVersion()` lit le
      # package.json EMBARQUÉ, et c'est cette version que l'auto-updater compare
      # au manifeste. Sans ce patch, l'application se croirait à jour à vie.
      - name: Injecter la version (versions.json) dans le paquet Electron
        run: node -e "const f='apps/desktop-electron/package.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');" "${{ needs.prepare.outputs.version }}"

      - name: Empaqueter (les quatre formats)
        run: |
          pnpm --filter @tentacle-tv/desktop-electron package:linux -- \
            --lib "$HOME/.cache/tentacle-mpv-linux"

      - name: Rassembler les paquets et calculer les empreintes
        run: |
          mkdir -p dist-linux
          cp apps/desktop-electron/release-linux/paquets/*.deb        dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.rpm        dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.AppImage   dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.pacman     dist-linux/ 2>/dev/null || true
          # electron-builder nomme le paquet Arch `.pacman` ; l'écosystème, et le
          # script d'installation, attendent `.pkg.tar.zst`.
          for f in dist-linux/*.pacman; do
            [ -e "$f" ] && mv "$f" "${f%.pacman}.pkg.tar.zst"
          done
          # GitHub remplace l'espace des noms d'assets par un point → on normalise
          # AVANT le calcul des sommes (sinon URL d'auto-update en 404).
          for f in dist-linux/*; do
            b=$(basename "$f"); c=${b// /.}
            [ "$b" != "$c" ] && mv "$f" "dist-linux/$c"
          done
          echo "Paquets produits :"
          ls -l dist-linux
          ( cd dist-linux && : > SHA256SUMS
            for f in *.deb *.rpm *.AppImage *.pkg.tar.zst; do
              [ -e "$f" ] && sha256sum "$f" >> SHA256SUMS
            done )
          cat dist-linux/SHA256SUMS

      # Les paquets n'existaient QUE dans la Release, elle-même gatée sur le
      # tag : une livraison en dispatch les rendait inaccessibles.
      - name: Upload des paquets Linux (livraison hors tag)
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-linux-packages
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.AppImage
            dist-linux/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload SHA256SUMS pour le job manifest
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-sums-main
          path: dist-linux/SHA256SUMS
          if-no-files-found: error

      - name: Corps de release (notes changelog + guide d'installation)
        if: needs.prepare.outputs.channel != 'build'
        env:
          SIBLINGS: ${{ needs.prepare.outputs.siblings }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          V="${{ needs.prepare.outputs.version }}"
          node .github/scripts/release-notes.mjs \
            --changelog changelogs/desktop.md --version "$V" \
            --format github --out notes.md
          {
            echo "Application desktop **Tentacle TV** ${V} pour Linux."
            # Cette ligne était écrite EN DUR : une livraison Linux seule
            # promettait l'App Store et le Microsoft Store sans rien y envoyer.
            [ -n "$SIBLINGS" ] && echo "(${SIBLINGS}, publiés par le même run.)"
            [ "$CHANNEL" = "test" ] && echo "" && echo "> **Pré-version** — la mise à jour automatique ne la propose pas encore."
            echo ""
            if [ -s notes.md ]; then echo "## Nouveautés"; echo ""; cat notes.md; echo ""; fi
            echo "| Paquet | Distributions |"
            echo "|--------|---------------|"
            echo "| \`.deb\` | Debian, Ubuntu, Mint, Pop!_OS… |"
            echo "| \`.rpm\` | Fedora, openSUSE, RHEL… |"
            echo "| \`.pkg.tar.zst\` | **Arch / Manjaro / EndeavourOS** (pacman natif) |"
            echo "| \`.AppImage\` | Universel — toute distribution |"
            echo ""
            echo "## Installation"
            echo ""
            echo "**Le plus simple (toute distribution)** — détecte le format, installe le bon"
            echo "paquet et pose l'entrée de menu :"
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/Knaox/Tentacle-TV/main/scripts/install-linux.sh | sh"
            echo '```'
            echo ""
            echo "## Lecteur vidéo"
            echo "Le lecteur **mpv est embarqué** dans les quatre paquets — rien à installer."
            echo "Le HDR demande une session **Wayland** avec un compositeur qui gère la"
            echo "gestion de couleur (KDE Plasma 6.2+, GNOME 48+, Hyprland) et un pilote"
            echo "Mesa 25.1+ ou NVIDIA 595+. Sous X11 la vidéo est tone-mappée : X.Org n'a"
            echo "pas de gestion de couleur et n'en aura pas."
          } > release-body.md
          cat release-body.md

      # PRÉ-VERSION au cran test : le paquet est téléchargeable, mais le
      # manifeste n'est pas patché — l'auto-updater ne propose rien.
      - name: Créer la Release GitHub
        if: needs.prepare.outputs.channel != 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: "Tentacle TV Desktop ${{ needs.prepare.outputs.version }}"
          prerelease: ${{ needs.prepare.outputs.channel == 'test' }}
          body_path: release-body.md
          files: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.AppImage
            dist-linux/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Promotion Linux : la pré-version déjà publiée au cran test devient une
  # version pleine. Rien n'est reconstruit — ce sont les paquets TESTÉS qui
  # deviennent ceux que l'auto-updater propose.
  linux-promote:
    needs: prepare
    if: needs.prepare.outputs.linux == 'promote'
    name: Linux — publier la pré-version testée
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Basculer la Release en version pleine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::aucune Release ${TAG} à promouvoir. Livre d'abord au cran « test », ou relance au cran « store » sans « reprendre ce qui a été testé »."
            exit 1
          fi
          gh release edit "$TAG" --prerelease=false --latest
          echo "Release ${TAG} publiée."

  # ── Manifeste d'auto-update (updates/store-versions.json, bloc « linux ») ──
  # Au cran STORE seulement : au cran test, la Release est une pré-version et
  # l'auto-updater ne doit rien proposer.
  manifest:
    needs: [prepare, linux, linux-promote]
    if: >-
      !cancelled() && needs.prepare.outputs.channel == 'store'
      && needs.prepare.outputs.linux != 'skip'
      && (needs.linux.result == 'success' || needs['linux-promote'].result == 'success')
    name: Manifeste auto-update (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # En promotion, les sommes viennent de la Release elle-même : le job de
      # build n'a pas tourné, mais ses paquets sont en ligne.
      - name: Récupérer SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "${{ needs.prepare.outputs.linux }}" = "promote" ]; then
            gh release download "$TAG" --pattern SHA256SUMS --clobber
          fi

      - name: Récupérer SHA256SUMS (artefact du build)
        if: needs.prepare.outputs.linux == 'build'
        uses: actions/download-artifact@v4
        with:
          name: tentacle-sums-main

      - name: Ajouter SHA256SUMS à la Release
        if: needs.prepare.outputs.linux == 'build'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Le manifeste est repris de `main` : c'est un fichier que d'autres jobs
      # écrivent aussi, et repartir d'une copie périmée effacerait leur bloc.
      # Le CHANGELOG, lui, reste celui du sha figé — c'est tout l'objet du
      # changement : ces jobs lisaient main, donc une retouche poussée pendant
      # le run partait dans le manifeste.
      - name: Patcher le bloc linux (version/tag/assets/sha256 + notes)
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- updates/store-versions.json
          node .github/scripts/patch-linux-manifest.mjs \
            "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.tag }}" SHA256SUMS
          node .github/scripts/patch-store-manifest.mjs \
            "${{ needs.prepare.outputs.version }}" --only=linux
      - uses: ./.github/actions/push-main
        with:
          paths: updates/store-versions.json
          message: "chore(update) : manifeste linux ${{ needs.prepare.outputs.tag }}"

  # Bloc microsoftStore, DÉCOUPLÉ du job linux : une livraison Windows seule
  # doit patcher son bloc, et desktop-v1.13.1 était parti avec un manifeste
  # périmé parce que ce patch vivait en queue du job Linux.
  #
  # Le bloc macAppStore, lui, n'est PAS patché ici : entre la soumission et
  # l'approbation d'Apple il s'écoule des heures, et l'annoncer au run faisait
  # pointer la pop-up de mise à jour vers une version introuvable. C'est
  # store-watch.yml qui le pose quand ASC la déclare en vente.
  manifest-stores:
    needs: [prepare, windows-store]
    if: needs.prepare.outputs.channel == 'store' && needs.prepare.outputs.windows == 'build' && needs['windows-store'].result == 'success'
    name: Manifeste stores (Microsoft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patcher le bloc microsoftStore
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- updates/store-versions.json
          node .github/scripts/patch-store-manifest.mjs \
            "${{ needs.prepare.outputs.version }}" --only=ms
      - uses: ./.github/actions/push-main
        with:
          paths: updates/store-versions.json
          message: "chore(update) : manifeste Microsoft Store ${{ needs.prepare.outputs.version }}"


# Tentacle TV — DESKTOP (macOS App Store + Microsoft Store + Linux), UN SEUL TAG
#
# Déclenché par le tag `desktop-vX.Y.Z` (ou manuellement). La version vient de
# versions.json → champ `desktop` (SOURCE UNIQUE — le tag doit correspondre,
# garde-fou au job `version`). Le numéro de build (CFBundleVersion) est
# AUTO-INCRÉMENTÉ : minutes écoulées depuis 2024-01-01 UTC — strictement
# croissant, jamais réutilisé (exigence App Store Connect).
#
# Coquille de bureau : Electron pour les trois systèmes. Tauri a été retiré.
#
# Jobs indépendants (un échec Apple ne bloque pas Linux, etc.) :
#   • mac-*        → app Electron universelle (arm64+x86_64), dylibs mpv/FFmpeg
#     LGPL vendorées, bac à sable → App Store / TestFlight
#   • windows-store → MSIX non signé (makeappx) → soumission API Microsoft Store
#   • linux/arch/manifest → .deb/.rpm/AppImage/.pkg.tar.zst → Release GitHub
#     `desktop-vX.Y.Z` + manifeste d'auto-update (updates/store-versions.json)
#
# Notes de version : changelogs/desktop.md (bloc « ## [X.Y.Z] », ### FR / ### EN).
# Limites gérées : App Store 4000 car., Microsoft Store 1500, GitHub illimité.
#
# Secrets : APPLE_DISTRIBUTION_CERT_BASE64/_PASSWORD, MAC_INSTALLER_CERT_BASE64/_PASSWORD,
#   MAS_PROVISIONING_PROFILE_BASE64, APPLE_API_KEY/_ISSUER/_KEY_CONTENT,
#   PARTNER_TENANT_ID / PARTNER_CLIENT_ID / PARTNER_CLIENT_SECRET.

name: Release Desktop

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      submit:
        description: "Soumettre aux stores (App Store / Microsoft Store) — sinon artefacts seulement"
        type: boolean
        default: true
      target:
        description: "Quel OS construire (build partiel via dispatch)"
        type: choice
        options: [all, macos, windows, linux]
        default: all

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  SIGN_APP: "Apple Distribution: Damien ROUGE (96K3M57W49)"
  SIGN_PKG: "3rd Party Mac Developer Installer: Damien ROUGE (96K3M57W49)"
  STORE_ID: "9NKHL0T84245"
  DESKTOP_CHANGELOG: "changelogs/desktop.md"

jobs:
  # 0) Version depuis versions.json + build auto-incrémenté + garde-fou tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      submit: ${{ steps.v.outputs.submit }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VERSION=$(jq -r .desktop versions.json)
          BUILD=$(( ( $(date +%s) - 1704067200 ) / 60 ))
          if [ "${{ github.event_name }}" = "push" ]; then
            IS_TAG=true; SUBMIT=true
            # Suffixe -rN optionnel = RE-LIVRAISON de la même version (tag git
            # unique, version marketing inchangée, build auto-incrémenté).
            if [[ ! "${GITHUB_REF_NAME}" =~ ^desktop-v${VERSION}(-r[0-9]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} ≠ desktop-v${VERSION}[-rN] (versions.json → desktop). Mets à jour versions.json (source unique) ou corrige le tag."
              exit 1
            fi
          else
            IS_TAG=false; SUBMIT="${{ inputs.submit }}"
          fi
          echo "Desktop ${VERSION} (build ${BUILD}, submit=${SUBMIT})"
          { echo "version=$VERSION"; echo "build=$BUILD"; echo "submit=$SUBMIT"; echo "is_tag=$IS_TAG"; } >> "$GITHUB_OUTPUT"

  # ── macOS App Store (Electron) ───────────────────────────────────────────
  # 1) Chaîne LGPL par architecture : dylibs mpv/FFmpeg + paquet natif de koffi.
  #    Plus aucune chaîne Rust ici : la coquille macOS sort d'Electron, comme
  #    Windows. Ce qui reste par architecture, c'est ce qui se COMPILE : mpv et
  #    FFmpeg (~1 h par runner), donc les deux tournent en parallèle.
  mac-libs:
    needs: version
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS libs LGPL (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            label: Apple Silicon
          - os: macos-15-intel
            arch: x64
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # mpv sans `gpl=true`, FFmpeg sans `--enable-gpl`, ni x264 ni x265 : la
      # LECTURE est intacte (les encodeurs GPL ne servent qu'à encoder) et le
      # script échoue de lui-même si un composant GPL ou un symbole `_lzma_*`
      # s'invite. C'est la chaîne déjà validée par Apple.
      - name: Build LGPL libmpv/FFmpeg
        run: bash apps/desktop-electron/scripts/build-mpv-lgpl-macos.sh

      # Le binaire natif de koffi n'existe QUE pour l'architecture du runner :
      # `pnpm install` n'installe pas le paquet de l'autre (contrainte `cpu` du
      # paquet). C'est donc ici qu'on le récolte — le paquet universel a besoin
      # des deux, sans quoi la lecture meurt sur la moitié des machines.
      - name: Rassembler dylibs + paquet natif koffi
        run: |
          mkdir -p sortie/lib
          cp apps/desktop-electron/lib/mpv/*.dylib sortie/lib/
          cp -R "node_modules/@koromix/koffi-darwin-${{ matrix.arch }}" sortie/koffi-pkg

      - name: Upload libs artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-libs-${{ matrix.arch }}
          path: sortie
          if-no-files-found: error
          retention-days: 5

  # 2) Paquet Electron universel + signature App Store + .pkg + envoi + notes
  mac-package:
    needs: [version, mac-libs]
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos'
    name: macOS universal package + submit
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 et non 20 : la coquille s'appuie sur `node:sqlite`, et sa
          # compilation comme l'empaquetage tournent sous ce Node-là.
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Import signing certificates + provisioning profile
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PKG_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          PKG_CERT_PW: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          echo "$PKG_CERT" | base64 --decode > /tmp/pkg.p12
          security import /tmp/pkg.p12 -k build.keychain -P "$PKG_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "$PROFILE" | base64 --decode > /tmp/embedded.provisionprofile
          rm -f /tmp/app.p12 /tmp/pkg.p12

      # Une dylib mono-architecture dans un paquet universel ne se voit pas au
      # build : elle se voit au premier film, sur l'autre moitié du parc.
      - name: Fusionner les dylibs LGPL (arm64 ⊕ x86_64)
        run: |
          bash apps/desktop-electron/scripts/lipo-libs.sh \
            artifacts/mac-libs-arm64/lib \
            artifacts/mac-libs-x64/lib \
            /tmp/lib-universal

      # Le runner est en Apple Silicon : le paquet natif koffi x86_64 n'y est pas
      # installable, il vient du runner Intel.
      - name: Poser le paquet natif koffi x86_64
        run: |
          rm -rf node_modules/@koromix/koffi-darwin-x64
          cp -R artifacts/mac-libs-x64/koffi-pkg node_modules/@koromix/koffi-darwin-x64

      # `build:appstore` = build web avec `VITE_DIST_CHANNEL=appstore` (donc la
      # détection de MAJ passe par le manifeste du dépôt et l'ouverture de la
      # fiche App Store) + compilation de la coquille.
      - name: Build web (canal App Store) + coquille
        run: pnpm --filter @tentacle-tv/desktop-electron build:appstore

      # `--version` écrit la version DANS le paquet livré : c'est elle que rend
      # `app.getVersion()`, donc celle que la détection de mise à jour compare au
      # manifeste `updates/store-versions.json`. `--build` = CFBundleVersion.
      - name: Empaqueter, signer, .pkg
        run: |
          node apps/desktop-electron/scripts/package-macos.mjs \
            --lib /tmp/lib-universal \
            --arch universal \
            --version "${{ needs.version.outputs.version }}" \
            --build "${{ needs.version.outputs.build }}" \
            --sign "$SIGN_APP" \
            --pkg-sign "$SIGN_PKG" \
            --profile /tmp/embedded.provisionprofile \
            --pkg-out "$GITHUB_WORKSPACE/Tentacle-TV.pkg"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-AppStore-pkg
          path: "*.pkg"

      - name: Submit to App Store Connect
        if: needs.version.outputs.submit == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY}.p8
          xcrun altool --upload-app -f *.pkg -t macos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

      # Notes FR+EN depuis changelogs/desktop.md (bloc « ## [X.Y.Z] »). Non bloquant.
      - name: Set release notes (App Store / TestFlight)
        if: needs.version.outputs.submit == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/asc-release-notes.mjs

  # 3) Attend le traitement ASC puis rattache le build à la version App Store.
  mac-attach:
    needs: [version, mac-package]
    if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'macos') && needs.version.outputs.submit == 'true'
    name: macOS attach build to App Store version
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for ASC processing + attach build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/asc-attach-build.mjs

  # ── Microsoft Store (MSIX) ───────────────────────────────────────────────
  # Windows sort d'ELECTRON depuis la 1.20.0, macOS l'a rejoint — seul Linux
  # reste sur Tauri.
  # Ce job n'a donc plus de chaîne Rust : le lecteur reste le même libmpv,
  # piloté par koffi. Le MSIX, lui, ne change pas d'identité (Name + Publisher
  # inchangés), ce qui préserve la mise à jour et le conteneur de données de
  # l'utilisateur — donc sa session et ses films téléchargés.
  windows-store:
    needs: version
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    name: Windows MSIX + soumission Store
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 et non 20 : la coquille Electron s'appuie sur `node:sqlite`, et
          # le script d'empaquetage tourne sous ce Node-là.
          node-version: 24

      - uses: pnpm/action-setup@v4

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Injecter la version (versions.json) dans le paquet Electron
        # « À propos » lit `app.getVersion()`, c'est-à-dire la version du
        # package.json EMBARQUÉ. Sans ce patch, l'exe livré annonce la version
        # du dépôt au lieu de celle du tag. Même geste que côté Tauri, où la
        # version vivait dans `tauri.conf.json`.
        shell: pwsh
        run: node -e "const f='apps/desktop-electron/package.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');" "${{ needs.version.outputs.version }}"

      - name: Build + empaquetage Electron
        # `pnpm package` enchaîne le build web, la compilation de la coquille et
        # `@electron/packager`. Sortie : un dossier `Tentacle TV.exe` +
        # `resources/`, exactement ce que `makeappx` attend.
        working-directory: apps/desktop-electron
        run: pnpm package

      - name: Assemble MSIX payload + manifest versionné
        shell: pwsh
        run: |
          $ver = "${{ needs.version.outputs.version }}"
          $stage = Join-Path $env:RUNNER_TEMP "msixstage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # Le paquet Electron est repris EN ENTIER : l'exe, mais aussi les
          # locales, les .pak et les DLL de Chromium. En oublier une donne un
          # paquet qui s'installe et ne démarre pas.
          $paquet = "apps\desktop-electron\release\Tentacle TV-win32-x64"
          if (-not (Test-Path (Join-Path $paquet "Tentacle TV.exe"))) {
            throw "Sortie d'empaquetage introuvable : $paquet"
          }

          Copy-Item (Join-Path $paquet "*") $stage -Recurse -Force

          # Tuiles du Store : inchangées, elles appartiennent au manifeste.
          Copy-Item "apps\desktop\msix\Assets" (Join-Path $stage "Assets") -Recurse
          $m = Get-Content "apps\desktop\msix\Package.appxmanifest" -Raw
          $m = $m -creplace '\bVersion="[\d\.]+"', ('Version="' + $ver + '.0"')
          Set-Content (Join-Path $stage "AppxManifest.xml") $m -Encoding UTF8

          "STAGE=$stage" >> $env:GITHUB_ENV
          "MSIX_VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Payload assemblé pour version $ver.0"
          Get-ChildItem $stage | Select-Object Name, Length

      - name: Pack MSIX (makeappx, non signé)
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                 Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $makeappx = Join-Path $sdk.FullName "x64\makeappx.exe"
          Write-Host "makeappx: $makeappx"
          $out = Join-Path $env:RUNNER_TEMP "TentacleTV.msix"
          & $makeappx pack /d "$env:STAGE" /p $out /nv /o
          if (-not (Test-Path $out)) { throw "MSIX non produit" }
          "MSIX_PATH=$out" >> $env:GITHUB_ENV

      - name: Upload MSIX (secours / upload manuel)
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-tv-msix
          path: ${{ env.MSIX_PATH }}
          if-no-files-found: error

      - name: Zip MSIX (payload d'upload API)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "TentacleTV-msix.zip"
          Compress-Archive -Path $env:MSIX_PATH -DestinationPath $zip -Force
          "PACKAGE_ZIP=$zip" >> $env:GITHUB_ENV

      # Notes FR/EN depuis changelogs/desktop.md (repli « ## [X.Y.Z] » nu).
      - name: Soumettre au Microsoft Store (API, notes FR/EN, publication auto)
        if: needs.version.outputs.submit == 'true'
        env:
          PARTNER_TENANT_ID: ${{ secrets.PARTNER_TENANT_ID }}
          PARTNER_CLIENT_ID: ${{ secrets.PARTNER_CLIENT_ID }}
          PARTNER_CLIENT_SECRET: ${{ secrets.PARTNER_CLIENT_SECRET }}
          STORE_ID: ${{ env.STORE_ID }}
          PACKAGE_ZIP: ${{ env.PACKAGE_ZIP }}
          PACKAGE_FILE_NAME: TentacleTV.msix
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: changelogs/desktop.md
        run: node .github/scripts/msstore-submit.mjs

  # ── Linux (.deb / .rpm / .pkg.tar.zst / AppImage) → Release desktop-vX.Y.Z ──
  #
  # Electron, comme Windows et macOS. La coquille Tauri a été retirée.
  #
  # ⚠️ `ubuntu-22.04` et pas plus récent, DÉLIBÉRÉMENT : la glibc est compatible
  # vers l'avant et jamais vers l'arrière. Une chaîne bâtie ici tourne sur Arch ;
  # bâtie sur Arch, elle ne tournerait pas ici.
  linux:
    needs: version
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux'
    name: Linux .deb / .rpm / .pkg.tar.zst / AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # `rpm` fournit rpmbuild, `libarchive-tools` fournit bsdtar — fpm en a
      # besoin pour le .rpm et le .pkg.tar.zst respectivement, et échoue sans.
      - name: Outils d'empaquetage
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools fakeroot

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      # La chaîne mpv est longue à bâtir (~40 min) et ne change que quand la
      # RECETTE change : la clé est l'empreinte du script, pas celle du dépôt.
      - name: Cache de la chaîne mpv LGPL
        uses: actions/cache@v4
        with:
          path: ~/.cache/tentacle-mpv-linux
          key: mpv-lgpl-linux-${{ hashFiles('apps/desktop-electron/scripts/build-mpv-linux.sh') }}

      - name: Chaîne mpv LGPL (bâtie si absente du cache)
        run: |
          if [ -f "$HOME/.cache/tentacle-mpv-linux/libmpv.so.2" ]; then
            echo "Chaîne restaurée depuis le cache :"
            ls -l "$HOME/.cache/tentacle-mpv-linux" | head -20
          else
            bash apps/desktop-electron/scripts/build-mpv-linux.sh \
              --sortie "$HOME/.cache/tentacle-mpv-linux"
          fi

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # Même geste que pour Windows et macOS : `app.getVersion()` lit le
      # package.json EMBARQUÉ, et c'est cette version que l'auto-updater compare
      # au manifeste. Sans ce patch, l'application se croirait à jour à vie.
      - name: Injecter la version (versions.json) dans le paquet Electron
        run: node -e "const f='apps/desktop-electron/package.json';const fs=require('fs');const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');" "${{ needs.version.outputs.version }}"

      - name: Empaqueter (les quatre formats)
        run: |
          pnpm --filter @tentacle-tv/desktop-electron package:linux -- \
            --lib "$HOME/.cache/tentacle-mpv-linux"

      - name: Rassembler les paquets et calculer les empreintes
        run: |
          mkdir -p dist-linux
          cp apps/desktop-electron/release-linux/paquets/*.deb        dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.rpm        dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.AppImage   dist-linux/ 2>/dev/null || true
          cp apps/desktop-electron/release-linux/paquets/*.pacman     dist-linux/ 2>/dev/null || true
          # electron-builder nomme le paquet Arch `.pacman` ; l'écosystème, et le
          # script d'installation, attendent `.pkg.tar.zst`.
          for f in dist-linux/*.pacman; do
            [ -e "$f" ] && mv "$f" "${f%.pacman}.pkg.tar.zst"
          done
          # GitHub remplace l'espace des noms d'assets par un point → on normalise
          # AVANT le calcul des sommes (sinon URL d'auto-update en 404).
          for f in dist-linux/*; do
            b=$(basename "$f"); c=${b// /.}
            [ "$b" != "$c" ] && mv "$f" "dist-linux/$c"
          done
          echo "Paquets produits :"
          ls -l dist-linux
          ( cd dist-linux && : > SHA256SUMS
            for f in *.deb *.rpm *.AppImage *.pkg.tar.zst; do
              [ -e "$f" ] && sha256sum "$f" >> SHA256SUMS
            done )
          cat dist-linux/SHA256SUMS

      # Les paquets n'existaient QUE dans la Release, elle-même gatée sur le
      # tag : une livraison en dispatch les rendait inaccessibles.
      - name: Upload des paquets Linux (livraison hors tag)
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-linux-packages
          path: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.AppImage
            dist-linux/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload SHA256SUMS pour le job manifest
        uses: actions/upload-artifact@v4
        with:
          name: tentacle-sums-main
          path: dist-linux/SHA256SUMS
          if-no-files-found: error

      - name: Corps de release (notes changelog + guide d'installation)
        if: needs.version.outputs.is_tag == 'true'
        run: |
          V="${{ needs.version.outputs.version }}"
          node .github/scripts/release-notes.mjs \
            --changelog changelogs/desktop.md --version "$V" \
            --format github --out notes.md || true
          {
            echo "Application desktop **Tentacle TV** ${V} pour Linux."
            echo "(macOS : App Store — Windows : Microsoft Store, publiés par ce même tag.)"
            echo ""
            if [ -s notes.md ]; then echo "## Nouveautés"; echo ""; cat notes.md; echo ""; fi
            echo "| Paquet | Distributions |"
            echo "|--------|---------------|"
            echo "| \`.deb\` | Debian, Ubuntu, Mint, Pop!_OS… |"
            echo "| \`.rpm\` | Fedora, openSUSE, RHEL… |"
            echo "| \`.pkg.tar.zst\` | **Arch / Manjaro / EndeavourOS** (pacman natif) |"
            echo "| \`.AppImage\` | Universel — toute distribution |"
            echo ""
            echo "## Installation"
            echo ""
            echo "**Le plus simple (toute distribution)** — détecte le format, installe le bon"
            echo "paquet et pose l'entrée de menu :"
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/Knaox/Tentacle-TV/main/scripts/install-linux.sh | sh"
            echo '```'
            echo ""
            echo "## Lecteur vidéo"
            echo "Le lecteur **mpv est embarqué** dans les quatre paquets — rien à installer."
            echo "Le HDR demande une session **Wayland** avec un compositeur qui gère la"
            echo "gestion de couleur (KDE Plasma 6.2+, GNOME 48+, Hyprland) et un pilote"
            echo "Mesa 25.1+ ou NVIDIA 595+. Sous X11 la vidéo est tone-mappée : X.Org n'a"
            echo "pas de gestion de couleur et n'en aura pas."
          } > release-body.md
          cat release-body.md

      - name: Create versioned GitHub Release
        if: needs.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tentacle TV Desktop ${{ needs.version.outputs.version }}"
          prerelease: false
          body_path: release-body.md
          files: |
            dist-linux/*.deb
            dist-linux/*.rpm
            dist-linux/*.AppImage
            dist-linux/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Manifeste d'auto-update (updates/store-versions.json, bloc « linux ») ──
  manifest:
    name: Publier le manifeste d'auto-update
    needs: [version, linux]
    if: (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'linux') && needs.version.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: tentacle-sums-main
          path: sums-main
      - name: Reprendre le SHA256SUMS
        # Un seul fichier depuis que les quatre formats sortent du même job :
        # electron-builder produit le paquet pacman lui-même, il n'y a plus de
        # conteneur Arch à faire tourner ni de deuxième somme à recoller.
        run: |
          cp sums-main/SHA256SUMS SHA256SUMS
          echo "SHA256SUMS complet :"; cat SHA256SUMS
      - name: Ajouter SHA256SUMS à la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch du bloc linux (version/tag/assets/sha256)
        run: |
          node .github/scripts/patch-linux-manifest.mjs "${{ needs.version.outputs.version }}" "${GITHUB_REF_NAME}" SHA256SUMS
      - name: Commit + push sur main
        run: |
          git config user.name "tentacle-bot"
          git config user.email "bot@tentacletv.app"
          git add updates/store-versions.json
          git commit -m "chore(update): manifeste linux ${GITHUB_REF_NAME}" || { echo "rien à committer"; exit 0; }
          git pull --rebase origin main
          git push origin main

  # ── Manifeste stores (macAppStore + microsoftStore) — job INDEPENDANT ──────
  # Volontairement decouple du job linux : les blocs stores etaient patches en
  # queue du job manifest (needs: linux+arch, gate target linux/all). Un job
  # Linux en echec — ou une relivraison en dispatch cible macos/windows —
  # laissait donc le manifeste macOS/Windows perime : c'est exactement ce qui
  # est arrive au tag desktop-v1.13.1, reste annonce 1.13.0, et AUCUNE notif de
  # mise a jour n'est partie alors que la version etait sur l'App Store. Ce job
  # ne depend que du tag. Les deux jobs committent le meme fichier (blocs
  # differents) : le `git pull --rebase` de chacun resout la course.
  manifest-stores:
    name: Publier le manifeste stores
    needs: version
    if: needs.version.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch des blocs stores (microsoftStore + notes linux)
        # --only=ms : le bloc macAppStore n'est PLUS patche au tag. Le tag
        # precede la review Apple de plusieurs heures — patcher ici faisait
        # annoncer une version introuvable sur le store. C'est store-watch.yml
        # qui l'aligne sur l'etat READY_FOR_SALE d'App Store Connect.
        run: |
          node .github/scripts/patch-store-manifest.mjs "${{ needs.version.outputs.version }}" --only=ms
      - name: Commit + push sur main
        run: |
          git config user.name "tentacle-bot"
          git config user.email "bot@tentacletv.app"
          git add updates/store-versions.json
          git commit -m "chore(update): manifeste stores ${GITHUB_REF_NAME}" || { echo "rien à committer"; exit 0; }
          git pull --rebase origin main
          git push origin main

# Tentacle TV — analyse statique de sécurité (CodeQL)
#
# Requêtes « security-extended » (config : .github/codeql/codeql-config.yml)
# sur le TypeScript/JavaScript de tout le monorepo, et sur les workflows
# eux-mêmes (langage « actions » : injections d'expressions, permissions,
# déclencheurs dangereux). Les alertes arrivent dans Security › Code scanning.
#
# Aucune compilation : `build-mode: none` lit les sources telles quelles, sans
# `pnpm install` — donc sans exécuter le moindre script d'un paquet.

name: CodeQL

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Téléversement du rapport SARIF dans Code scanning.
      security-events: write
      # Lecture des runs (exigée par l'action sur un dépôt privé).
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "actions"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

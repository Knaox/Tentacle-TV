# Tentacle TV — iOS (TestFlight, natif, SANS EAS)
#
# Déclenché par un tag `ios-v<version>-<build>` (ex. ios-v1.2.2-41) OU manuellement.
# Tag dédié iOS (le macOS a `mac-v*`, l'Android mobile `apk-v*`). macOS et iOS
# partagent la même fiche App Store Connect (bundle com.tentacle.mobile), mais se
# déploient indépendamment.
#   - <version> → MARKETING_VERSION (CFBundleShortVersionString)
#   - <build>   → CURRENT_PROJECT_VERSION (CFBundleVersion ; à incrémenter pour
#                 ré-uploader une même version sur TestFlight sans collision)
#
# Build : pnpm install → pod install → xcodebuild archive/export → altool upload.
# Signature AUTOMATIQUE : -allowProvisioningUpdates + clé API App Store Connect
# (Apple gère le provisioning profile App Store) ; le cert Apple Distribution est
# importé depuis les secrets déjà en place pour le macOS.
#
# Secrets (déjà présents pour le macOS, rien de neuf à fournir) :
#   APPLE_DISTRIBUTION_CERT_BASE64 / _PASSWORD,
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_CONTENT.

name: Release iOS (TestFlight)

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version marketing (CFBundleShortVersionString)"
        type: string
        default: "1.2.2"
      build:
        description: "Build number (CFBundleVersion) — incrémenter pour chaque upload TestFlight"
        type: string
        default: "41"
      submit:
        description: "Envoyer à App Store Connect / TestFlight (sinon artefact .ipa seulement)"
        type: boolean
        default: true

concurrency:
  group: release-ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_TEAM_ID: "96K3M57W49"
  IOS_SCHEME: "TentacleTV"
  IOS_WORKSPACE: "apps/mobile/ios/TentacleTV.xcworkspace"
  IOS_BUNDLE_ID: "com.tentacle.mobile"
  IOS_PROFILE_NAME: "Tentacle TV iOS App Store CI"

jobs:
  # 0) Détermine version / build / submit depuis le tag ou les inputs
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      submit: ${{ steps.p.outputs.submit }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REST="${GITHUB_REF_NAME#ios-v}"   # 1.2.2-41
            VERSION="${REST%-*}"
            BUILD="${REST##*-}"
            SUBMIT=true
          else
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            SUBMIT="${{ inputs.submit }}"
          fi
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "submit=$SUBMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: Build + submit iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4

      # Même Xcode/SDK qu'en local (Xcode 26.3 / SDK iOS 26.2) → builds identiques et
      # acceptés par App Store (qui exige le SDK iOS 26+). Sans ça le runner prend un
      # Xcode 16 (SDK 18.5) → rejet « must be built with the iOS 26 SDK ».
      - name: Select Xcode 26.3 (identique au local)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: |
          pod install --repo-update

      - name: Import Apple Distribution certificate
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/app.p12

      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY}.p8
          cp ~/private_keys/AuthKey_${API_KEY}.p8 ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"

      # Profil App Store généré via l'API App Store Connect (aucun secret
      # supplémentaire) : la signature AUTOMATIQUE créait un certificat
      # « Apple Development » sur chaque runner éphémère jusqu'à saturer le
      # quota du compte. Ici : signature MANUELLE avec le cert Distribution du
      # keychain + profil recréé de façon idempotente (delete + create → il
      # référence toujours NOTRE certificat).
      - name: Provision App Store profile (API ASC)
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          JWT=$(ruby -e '
            require "openssl"; require "base64"; require "json"
            key = OpenSSL::PKey.read(File.read(ENV.fetch("ASC_KEY_PATH")))
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            header  = b64.(JSON.dump({ alg: "ES256", kid: ENV.fetch("API_KEY"), typ: "JWT" }))
            now     = Time.now.to_i
            payload = b64.(JSON.dump({ iss: ENV.fetch("API_ISSUER"), iat: now, exp: now + 1200, aud: "appstoreconnect-v1" }))
            data    = "#{header}.#{payload}"
            der     = key.sign(OpenSSL::Digest.new("SHA256"), data)
            r, s    = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\x00".b) }
            puts "#{data}.#{b64.(r + s)}"
          ')
          api() { curl -sf -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" "$@"; }
          BASE="https://api.appstoreconnect.apple.com/v1"

          # Certificat Distribution du keychain → id API (match par n° de série)
          SERIAL=$(security find-certificate -c "Apple Distribution" -p build.keychain \
            | openssl x509 -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]')
          CERTS=$(api "$BASE/certificates?filter%5BcertificateType%5D=DISTRIBUTION&limit=200")
          CERT_ID=$(echo "$CERTS" | jq -r --arg s "$SERIAL" \
            '[.data[] | select((.attributes.serialNumber | ascii_upcase) == $s)][0].id // empty')
          if [ -z "$CERT_ID" ]; then
            COUNT=$(echo "$CERTS" | jq '.data | length')
            if [ "$COUNT" = "1" ]; then CERT_ID=$(echo "$CERTS" | jq -r '.data[0].id');
            else echo "::error::Certificat Distribution du keychain (serial $SERIAL) introuvable côté API ($COUNT candidats)"; exit 1; fi
          fi

          BUNDLE_DB_ID=$(api "$BASE/bundleIds?filter%5Bidentifier%5D=$IOS_BUNDLE_ID&limit=200" \
            | jq -r --arg b "$IOS_BUNDLE_ID" '[.data[] | select(.attributes.identifier == $b)][0].id')
          [ -n "$BUNDLE_DB_ID" ] && [ "$BUNDLE_DB_ID" != "null" ] || { echo "::error::bundleId $IOS_BUNDLE_ID introuvable"; exit 1; }

          # Idempotent : purge l'ancien profil du même nom puis (re)crée
          NAME_ENC=$(python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["IOS_PROFILE_NAME"]))')
          OLD_ID=$(api "$BASE/profiles?filter%5Bname%5D=$NAME_ENC" | jq -r '.data[0].id // empty')
          [ -n "$OLD_ID" ] && api -X DELETE "$BASE/profiles/$OLD_ID" >/dev/null || true
          PROFILE=$(api -X POST "$BASE/profiles" -d "$(jq -n \
            --arg name "$IOS_PROFILE_NAME" --arg bid "$BUNDLE_DB_ID" --arg cid "$CERT_ID" \
            '{data:{type:"profiles",attributes:{name:$name,profileType:"IOS_APP_STORE"},
              relationships:{bundleId:{data:{type:"bundleIds",id:$bid}},
                             certificates:{data:[{type:"certificates",id:$cid}]}}}}')")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | jq -r '.data.attributes.profileContent' | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/tentacle-ios-ci.mobileprovision"
          echo "Profil « $IOS_PROFILE_NAME » installé (cert $CERT_ID)"

      # L'Info.plist code la version en dur (pas de $(MARKETING_VERSION)) → on la
      # patche directement, sinon le tag n'aurait aucun effet sur le build uploadé.
      - name: Set version / build (Info.plist)
        run: |
          PLIST=apps/mobile/ios/TentacleTV/Info.plist
          plutil -replace CFBundleShortVersionString -string "${{ needs.setup.outputs.version }}" "$PLIST"
          plutil -replace CFBundleVersion -string "${{ needs.setup.outputs.build }}" "$PLIST"
          plutil -p "$PLIST" | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Archive (xcodebuild, signature manuelle Distribution)
        run: |
          xcodebuild archive \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TentacleTV.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export .ipa (App Store)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TentacleTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-iOS-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Submit to TestFlight
        if: needs.setup.outputs.submit == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/ipa/*.ipa -t ios \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

      # Notes FR+EN depuis CHANGELOG.md (« Nouveautés » App Store ; « À tester »
      # TestFlight si le build est déjà traité). Non bloquant.
      - name: Set release notes (App Store / TestFlight iOS)
        if: needs.setup.outputs.submit == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          CHANNEL: ios
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ needs.setup.outputs.build }}
        run: node .github/scripts/asc-release-notes.mjs

  # Attend le traitement ASC (~10-35 min) puis rattache le build à la version
  # App Store (+ « À tester » TestFlight) → il ne reste qu'à « Soumettre pour
  # examen ». Job séparé (ubuntu) ; continue-on-error : échec visible mais run
  # global vert.
  attach-build:
    needs: [setup, build]
    if: needs.setup.outputs.submit == 'true'
    name: Attach build to App Store version
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for ASC processing + attach build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          CHANNEL: ios
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ needs.setup.outputs.build }}
        run: node .github/scripts/asc-attach-build.mjs

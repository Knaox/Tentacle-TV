# Tentacle TV — Mac App Store build (universal, LGPL, sandbox)
#
# Workflow MANUEL : construit l'app macOS universelle (Apple Silicon + Intel) avec
# un libmpv/FFmpeg recompilé en LGPL (sans x264/x265, sans --enable-gpl), signée
# pour le Mac App Store (sandbox), packagée en .pkg et envoyée à App Store Connect.
#
# macOS est distribué EXCLUSIVEMENT via le Mac App Store (le DMG est retiré).
# La version App Store est forcée à 1.0.0 par src-tauri/tauri.appstore.conf.json
# (les autres plateformes ne sont pas affectées).
#
# Secrets requis (GitHub → Settings → Secrets → Actions) :
#   APPLE_DISTRIBUTION_CERT_BASE64   : cert « Apple Distribution » (.p12) en base64
#   APPLE_DISTRIBUTION_CERT_PASSWORD : mot de passe du .p12
#   MAC_INSTALLER_CERT_BASE64        : cert « 3rd Party Mac Developer Installer » (.p12) base64
#   MAC_INSTALLER_CERT_PASSWORD      : mot de passe du .p12 installer
#   MAS_PROVISIONING_PROFILE_BASE64  : provisioning profile Mac App Store (.provisionprofile) base64
#   APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_CONTENT : clé App Store Connect (réutilisable depuis release.yml)

name: Release Mac App Store

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Envoyer le .pkg à App Store Connect (sinon artefact seulement)"
        type: boolean
        default: false

concurrency:
  group: release-appstore-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  SIGN_APP: "Apple Distribution: Damien ROUGE (96K3M57W49)"
  SIGN_PKG: "3rd Party Mac Developer Installer: Damien ROUGE (96K3M57W49)"

jobs:
  # 1) Build par architecture : dylibs LGPL + app Tauri (sandbox, sans private-api)
  build-arch:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: Apple Silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # libmpv + FFmpeg recompilés LGPL pour l'arch native → src-tauri/lib
      - name: Build LGPL libmpv/FFmpeg
        run: bash apps/desktop/scripts/build-mpv-lgpl-macos.sh

      # App Tauri : config App Store (version 1.0.0, transparent off), SANS la
      # feature macos-private-api (interdite en sandbox), bundle .app uniquement.
      - name: Build Tauri app (App Store config)
        env:
          VITE_DIST_CHANNEL: appstore
        run: |
          cd apps/desktop
          pnpm tauri build \
            --config src-tauri/tauri.appstore.conf.json \
            --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' \
            --target ${{ matrix.target }} \
            --bundles app

      # tar préserve permissions + symlinks du .app (upload-artifact les casserait)
      - name: Tar .app
        run: |
          cd "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          tar -czf "$RUNNER_TEMP/app-${{ matrix.target }}.tar.gz" "Tentacle TV.app"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ runner.temp }}/app-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # 2) Fusion universelle + signature App Store + .pkg + upload
  package:
    name: Universal package + submit
    needs: build-arch
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import signing certificates + provisioning profile
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PKG_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          PKG_CERT_PW: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          echo "$PKG_CERT" | base64 --decode > /tmp/pkg.p12
          security import /tmp/pkg.p12 -k build.keychain -P "$PKG_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "$PROFILE" | base64 --decode > /tmp/embedded.provisionprofile
          rm -f /tmp/app.p12 /tmp/pkg.p12

      - name: Extract per-arch .app bundles
        run: |
          mkdir -p arm64 x86_64
          tar -xzf artifacts/app-aarch64-apple-darwin/app-aarch64-apple-darwin.tar.gz -C arm64
          tar -xzf artifacts/app-x86_64-apple-darwin/app-x86_64-apple-darwin.tar.gz -C x86_64

      # lipo des deux .app (binaire + dylibs) → .app universelle, dylibs déplacées
      # dans Contents/Frameworks (emplacement App Store), signature inside-out, .pkg.
      - name: Build universal package
        run: |
          bash apps/desktop/scripts/package-appstore-universal.sh \
            "arm64/Tentacle TV.app" \
            "x86_64/Tentacle TV.app" \
            /tmp/embedded.provisionprofile \
            "$SIGN_APP" "$SIGN_PKG"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-AppStore-pkg
          path: "*.pkg"

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY}.p8
          xcrun altool --upload-app -f *.pkg -t macos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

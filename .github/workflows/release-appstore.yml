# Tentacle TV — Mac App Store (universal, LGPL, sandbox)
#
# Déclenché par un tag `mac-v<version>-<build>` (ex. mac-v1.0.0-3) OU manuellement.
#   - <version> → CFBundleShortVersionString (version marketing)
#   - <build>   → CFBundleVersion (build number TestFlight ; à incrémenter pour
#                 ré-uploader une même version sans collision)
# Construit l'app macOS universelle (Apple Silicon + Intel) avec libmpv/FFmpeg
# recompilé en LGPL, signée Mac App Store (sandbox), .pkg → App Store Connect /
# TestFlight, et remplit les notes (FR+EN) depuis CHANGELOG.md.
#
# Secrets : APPLE_DISTRIBUTION_CERT_BASE64/_PASSWORD, MAC_INSTALLER_CERT_BASE64/_PASSWORD,
#   MAS_PROVISIONING_PROFILE_BASE64, APPLE_API_KEY/_ISSUER/_KEY_CONTENT.

name: Release Mac App Store

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version marketing (CFBundleShortVersionString)"
        type: string
        default: "1.0.0"
      build:
        description: "Build number (CFBundleVersion) — incrémenter pour chaque upload TestFlight"
        type: string
        default: "1"
      submit:
        description: "Envoyer à App Store Connect / TestFlight (sinon artefact seulement)"
        type: boolean
        default: true

concurrency:
  group: release-appstore-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  SIGN_APP: "Apple Distribution: Damien ROUGE (96K3M57W49)"
  SIGN_PKG: "3rd Party Mac Developer Installer: Damien ROUGE (96K3M57W49)"

jobs:
  # 0) Détermine version / build / submit depuis le tag ou les inputs
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      submit: ${{ steps.p.outputs.submit }}
      draft: ${{ steps.p.outputs.draft }}
      make_latest: ${{ steps.p.outputs.make_latest }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REST="${GITHUB_REF_NAME#mac-v}"   # 1.0.0-3
            VERSION="${REST%-*}"
            BUILD="${REST##*-}"
            SUBMIT=true
          else
            VERSION="${{ inputs.version }}"
            BUILD="${{ inputs.build }}"
            SUBMIT="${{ inputs.submit }}"
          fi
          # Release GitHub : 1er build d'une version (build == 1) → publiée + « Latest » ;
          # ré-upload de build (même version, build > 1) → brouillon. L'upload
          # TestFlight a lieu dans les deux cas (étape « Submit » inconditionnelle).
          if [ "$BUILD" = "1" ]; then DRAFT=false; LATEST=true; else DRAFT=true; LATEST=false; fi
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "submit=$SUBMIT"
            echo "draft=$DRAFT"
            echo "make_latest=$LATEST"
          } >> "$GITHUB_OUTPUT"

  # 1) Build par architecture : dylibs LGPL + app Tauri (sandbox, sans private-api)
  build-arch:
    needs: setup
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: Apple Silicon
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build LGPL libmpv/FFmpeg
        run: bash apps/desktop/scripts/build-mpv-lgpl-macos.sh

      # Override version (tag) + ad-hoc sign (la signature Apple se fait au job package).
      - name: Build Tauri app (App Store config)
        env:
          VITE_DIST_CHANNEL: appstore
        run: |
          cd apps/desktop
          pnpm tauri build \
            --config src-tauri/tauri.appstore.conf.json \
            --config '{"version":"${{ needs.setup.outputs.version }}","bundle":{"macOS":{"signingIdentity":"-"}}}' \
            --target ${{ matrix.target }} \
            --bundles app

      - name: Tar .app
        run: |
          cd "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          tar -czf "$RUNNER_TEMP/app-${{ matrix.target }}.tar.gz" "Tentacle TV.app"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: ${{ runner.temp }}/app-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # 2) Fusion universelle + signature App Store + .pkg + upload + notes
  package:
    needs: [setup, build-arch]
    name: Universal package + submit
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import signing certificates + provisioning profile
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PKG_CERT: ${{ secrets.MAC_INSTALLER_CERT_BASE64 }}
          PKG_CERT_PW: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
          PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          echo "$PKG_CERT" | base64 --decode > /tmp/pkg.p12
          security import /tmp/pkg.p12 -k build.keychain -P "$PKG_CERT_PW" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          echo "$PROFILE" | base64 --decode > /tmp/embedded.provisionprofile
          rm -f /tmp/app.p12 /tmp/pkg.p12

      - name: Extract per-arch .app bundles
        run: |
          mkdir -p arm64 x86_64
          tar -xzf artifacts/app-aarch64-apple-darwin/app-aarch64-apple-darwin.tar.gz -C arm64
          tar -xzf artifacts/app-x86_64-apple-darwin/app-x86_64-apple-darwin.tar.gz -C x86_64

      - name: Build universal package
        run: |
          bash apps/desktop/scripts/package-appstore-universal.sh \
            "arm64/Tentacle TV.app" \
            "x86_64/Tentacle TV.app" \
            /tmp/embedded.provisionprofile \
            "$SIGN_APP" "$SIGN_PKG" \
            "${{ needs.setup.outputs.build }}"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tentacle-TV-AppStore-pkg
          path: "*.pkg"

      - name: Submit to App Store Connect
        if: needs.setup.outputs.submit == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY}.p8
          xcrun altool --upload-app -f *.pkg -t macos \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

      # Notes FR+EN depuis CHANGELOG.md (bloc « ## [mac-<version>] », repli
      # « ## [<version>] ») : « Nouveautés » App Store ; « À tester » TestFlight
      # si le build est déjà traité. Non bloquant.
      - name: Set release notes (App Store / TestFlight)
        if: needs.setup.outputs.submit == 'true'
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          CHANNEL: mac
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ needs.setup.outputs.build }}
        run: node .github/scripts/asc-release-notes.mjs

      # Notes de la Release GitHub : bloc « ## [mac-<version>] » (repli
      # « ## [<version>] ») en markdown brut, sinon texte par défaut.
      - name: Extract CHANGELOG notes
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          node .github/scripts/release-notes.mjs \
            --channel mac --version "$VERSION" --format github --lang both \
            --out release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Tentacle TV pour macOS — version $VERSION." > release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo "_Distribution : Mac App Store / TestFlight (build ${{ needs.setup.outputs.build }})._"
          } >> release-notes.md

      # Release GitHub : brouillon pour un ré-upload de build, publiée + « Latest »
      # pour une nouvelle version (build == 1). N'affecte PAS l'upload TestFlight.
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Tentacle TV (macOS) v${{ needs.setup.outputs.version }} (build ${{ needs.setup.outputs.build }})"
          body_path: release-notes.md
          draft: ${{ needs.setup.outputs.draft }}
          make_latest: ${{ needs.setup.outputs.make_latest }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3) Attend le traitement ASC (~10-35 min) puis rattache le build à la version
  #    App Store (+ « À tester » TestFlight) → il ne reste qu'à « Soumettre pour
  #    examen ». Job séparé (ubuntu) pour ne pas retenir un runner macOS ;
  #    continue-on-error : échec visible mais run global vert.
  attach-build:
    needs: [setup, package]
    if: needs.setup.outputs.submit == 'true'
    name: Attach build to App Store version
    runs-on: ubuntu-latest
    timeout-minutes: 50
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for ASC processing + attach build
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: MAC_OS
          CHANNEL: mac
          VERSION: ${{ needs.setup.outputs.version }}
          BUILD: ${{ needs.setup.outputs.build }}
        run: node .github/scripts/asc-attach-build.mjs

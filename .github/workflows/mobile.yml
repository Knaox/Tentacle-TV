# Tentacle TV — MOBILE (iOS + Android), UN SEUL DÉCLENCHEMENT
#
# TROIS CRANS, choisis au lancement (`channel`) :
#   • build — construire et archiver les artefacts. Rien ne part nulle part.
#   • test  — piste Play INTERNE « internal » en `completed` : sans examen de
#             Google, les testeurs ont la mise à jour dès qu'elle est traitée,
#             comme TestFlight (décision du 2026-10-20). Et TestFlight
#             distribué au groupe externe avec demande d'examen bêta.
#   • store — production Play à 100 %, et App Store soumis à l'examen avec
#             mise en vente automatique à l'approbation. Aucun clic ensuite.
#             La piste interne « internal » reçoit le même binaire : ses
#             testeurs ont la version de production, comme TestFlight garde le
#             build soumis à Apple. Avant le commit Play et avant l'envoi à
#             Apple, la release est RELUE chez le store et comparée à la
#             livraison (version, binaire, notes) : un écart refuse tout
#             (lib/release-check.mjs).
#
# `promote` (par défaut vrai, au cran store seulement) REPREND LE BINAIRE DÉJÀ
# TESTÉ au lieu d'en reconstruire un autre : le versionCode servi par la piste
# interne passe en production, et la version App Store part à l'examen avec le
# DERNIER build TestFlight de la version. Décoché, tout est reconstruit. Une cible qui
# n'a RIEN à reprendre (aucun run de test pour cette version) se construit
# aussi : `prepare` le vérifie avant le moindre job (promote-probe.mjs).
#
# TOUT EST FIGÉ SUR UN COMMIT. Le job `prepare` publie un `sha`, et chaque job
# checkout CE sha — y compris `ios-attach`, qui attend jusqu'à 35 minutes. Une
# retouche de changelog poussée pendant un run ne peut donc pas partir au store.
#
# La version vient de versions.json → `mobile` (SOURCE UNIQUE). L'entrée
# `version` du dispatch la BUMPE : prepare écrit versions.json, aligne
# apps/mobile/package.json, commite, tague `mobile-vX.Y.Z` et pousse — aucune
# commande locale. Le tag reste accepté comme déclencheur, au cran `store`.
#
# Build AUTO-INCRÉMENTÉ (minutes depuis 2024-01-01 UTC) :
#   • iOS CFBundleVersion = BUILD   (Info.plist patché via plutil — la version y
#     est codée en dur, pas de $(MARKETING_VERSION))
#   • Android versionCode = BUILD   (mobile = form factor de BASE, PAS de préfixe ;
#     la TV utilise 2000000000 + BUILD → jamais de collision sur la fiche Play
#     partagée com.tentacletv.mobile, et l'AAB TV n'est jamais servi aux téléphones)
#
# iOS  : xcodebuild archive, signature MANUELLE (cert Distribution + profil App
#        Store recréé de façon idempotente via l'API ASC), altool upload TestFlight.
#        Fiche App Store Connect com.tentacle.mobile (partagée mac/iOS/tvOS).
# Android : AAB signé release (keystore d'upload MOBILE_*). Sans keystore : build
#        debug-signed, publication Play sautée. AAB toujours archivé en artefact.
#
# Notes de version : changelogs/mobile.md (bloc « ## [X.Y.Z] », ### FR / ### EN).
# Le bloc est EXIGÉ par le pré-vol de `prepare` — un bloc manquant ne donne plus
# une publication silencieusement sans notes, il arrête le run avant le build.
# Limites : Play 500 car., App Store 4000. UN seul bloc sert iOS ET Android.

name: Release Mobile

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      targets:
        description: "Cibles : all, ou une liste séparée par des virgules (android, ios)"
        type: string
        default: all
      channel:
        description: "Jusqu'où aller"
        type: choice
        options: [build, test, store]
        default: test
      version:
        description: "Version X.Y.Z à livrer (vide = versions.json inchangé)"
        type: string
        default: ""
      promote:
        description: "Au cran store : reprendre le binaire déjà testé au lieu de reconstruire"
        type: boolean
        default: true

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_TEAM_ID: "96K3M57W49"
  IOS_SCHEME: "TentacleTV"
  IOS_WORKSPACE: "apps/mobile/ios/TentacleTV.xcworkspace"
  IOS_BUNDLE_ID: "com.tentacle.mobile"
  IOS_PROFILE_NAME: "Tentacle TV iOS App Store CI"
  # L'extension de widget de la Live Activity des transferts (embarquée dans
  # l'app) : son propre identifiant, son propre profil.
  IOS_EXT_BUNDLE_ID: "com.tentacle.mobile.TransferLiveActivity"
  IOS_EXT_PROFILE_NAME: "Tentacle TV iOS Live Activity App Store CI"
  # L'extension de PARTAGE (« Partager vers Tentacle TV », import d'une playlist) :
  # son identifiant (créé au premier passage, comme celui de la Live Activity),
  # son profil. Aucun App Group, aucune capacité.
  IOS_SHARE_BUNDLE_ID: "com.tentacle.mobile.ShareToTentacle"
  IOS_SHARE_PROFILE_NAME: "Tentacle TV iOS Share App Store CI"
  # Piste Play des TESTS INTERNES mobile (cran test, et source de la reprise
  # au cran store). « internal » = piste du téléphone, à ne pas confondre avec
  # « tv:internal » (piste TV préfixée par form factor, même fiche
  # com.tentacletv.mobile). Lister les identifiants exacts : workflow
  # « Play — lister les pistes » (play-tracks.yml).
  PLAY_MOBILE_TRACK: "internal"
  PLAY_PACKAGE: "com.tentacletv.mobile"

# Jeton en LECTURE par défaut : chaque job qui écrit (tag, Release, push,
# image) le déclare lui-même, au plus juste.
permissions:
  contents: read

jobs:
  # ── Ce qui rend tout le reste reproductible ────────────────────────────────
  # Sort un `sha` que TOUS les jobs suivants checkout. Refuse de partir si la
  # qualité n'est pas verte sur ce commit, ou si le changelog n'a pas son bloc.
  prepare:
    name: Préparer la livraison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      vcode: ${{ steps.plan.outputs.vcode }}
      channel: ${{ steps.plan.outputs.channel }}
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      play_track: ${{ steps.plan.outputs.play_track }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Le filet du crochet pre-push : rattrape un --no-verify ou une machine
      # dont core.hooksPath n'est pas posé. Porte sur le commit DISPATCHÉ, donc
      # avant le bump ci-dessous (qui ne touche que versions.json, un changelog
      # et un package.json).
      # Depuis une autre branche que main : build ou test, jamais le store ni un bump.
      - uses: ./.github/actions/store-from-main
        with:
          channel: ${{ inputs.channel || 'store' }}
          bump: ${{ inputs.version }}

      - uses: ./.github/actions/require-quality
        with:
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # Le bump est posé PAR LA CI : aucune commande locale à jouer. Le tag
      # suit, et c'est le commit de bump qui devient le sha figé du run.
      - name: Bump versions.json (si une version est demandée)
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          WANTED: ${{ inputs.version }}
        run: node .github/scripts/bump-version.mjs mobile "$WANTED"

      - uses: ./.github/actions/push-main
        id: pushed
        if: steps.bump.outputs.changed == 'true'
        with:
          paths: ${{ steps.bump.outputs.files }}
          message: "release(mobile) : v${{ inputs.version }}"

      - name: Poser le tag mobile-v*
        if: steps.pushed.outputs.committed == 'true'
        env:
          TAG: mobile-v${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::le tag $TAG existe déjà — on le laisse en place."
          else
            git tag "$TAG" "${{ steps.pushed.outputs.sha }}"
            git push origin "$TAG"
          fi

      # Le plan du run : quelle version, quel build, et QUE FAIRE de chaque
      # cible. « promote » n'est pas un cran mais un raccourci du cran store :
      # rien n'est reconstruit, on porte en production ce qui a été testé.
      - name: Plan du run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_TARGETS: ${{ inputs.targets }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_PROMOTE: ${{ inputs.promote }}
          BUMPED_SHA: ${{ steps.pushed.outputs.sha }}
          # Le pré-contrôle de la reprise (promote-probe.mjs).
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          SHA="${BUMPED_SHA:-${{ github.sha }}}"
          git checkout --quiet "$SHA"
          VERSION=$(jq -r .mobile versions.json)
          BUILD=$(( ( $(date +%s) - 1704067200 ) / 60 ))
          VCODE=$BUILD   # mobile = form factor de base : versionCode = BUILD (TV = 2e9+BUILD)

          if [ "$EVENT" = "push" ]; then
            # Un tag veut dire « livrer », donc le cran le plus haut. Le suffixe
            # -rN reste une RE-LIVRAISON de la même version marketing.
            TARGETS="android,ios"; CHANNEL=store; PROMOTE=false
            if [[ ! "${GITHUB_REF_NAME}" =~ ^mobile-v${VERSION}(-r[0-9]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} ≠ mobile-v${VERSION}[-rN] (versions.json → mobile). Mets à jour versions.json (source unique) ou corrige le tag."
              exit 1
            fi
          else
            TARGETS="$IN_TARGETS"; CHANNEL="$IN_CHANNEL"; PROMOTE="$IN_PROMOTE"
          fi
          [ "$TARGETS" = "all" ] && TARGETS="android,ios"

          want() { case ",$TARGETS," in *",$1,"*) return 0 ;; *) return 1 ;; esac; }
          plan() {  # cible → build | promote | skip
            want "$1" || { echo skip; return; }
            if [ "$CHANNEL" = "store" ] && [ "$PROMOTE" = "true" ]; then echo promote; else echo build; fi
          }
          ANDROID=$(plan android); IOS=$(plan ios)

          # Rien à reprendre (aucun run de test pour cette version) : la cible
          # se CONSTRUIT. Sans ce contrôle, la promotion Play portait en
          # production le binaire de la version PRÉCÉDENTE sous le nouveau
          # numéro. Même règle que desktop.yml.
          if [ "$ANDROID" = promote ]; then
            ANDROID=$(LABEL=Android PLAY_PACKAGE="$PLAY_PACKAGE" FORM_FACTOR=phone PLAY_SOURCE_TRACK="$PLAY_MOBILE_TRACK" VERSION="$VERSION" node .github/scripts/promote-probe.mjs play)
          fi
          if [ "$IOS" = promote ]; then
            IOS=$(LABEL=iOS PLATFORM=IOS VERSION="$VERSION" node .github/scripts/promote-probe.mjs asc)
          fi
          [ "$CHANNEL" = "store" ] && TRACK=production || TRACK="${PLAY_MOBILE_TRACK}"

          echo "Mobile ${VERSION} — cran ${CHANNEL} · android=${ANDROID} · ios=${IOS} · piste ${TRACK} · build ${BUILD} · sha ${SHA}"
          {
            echo "sha=$SHA"; echo "version=$VERSION"; echo "build=$BUILD"; echo "vcode=$VCODE"
            echo "channel=$CHANNEL"; echo "android=$ANDROID"; echo "ios=$IOS"
            echo "play_track=$TRACK"; echo "tag=mobile-v$VERSION"
          } >> "$GITHUB_OUTPUT"

      # LA GARDE DE LICENCE iOS. Les binaires MPVKit du fork Streamyfin sont
      # GPL : jamais vers TestFlight ni l'App Store. Seule la Release LGPL de
      # mpvkit.yml passe (lib/podspec-license.mjs). Le cran build reste libre.
      - name: Licence du lecteur iOS (MPVKit LGPL)
        if: steps.plan.outputs.channel != 'build' && steps.plan.outputs.ios != 'skip'
        run: node .github/scripts/check-podspec-license.mjs apps/mobile/ios/MPVKit.podspec

      # LA GARDE DE LICENCE Android. Firebase (propriétaire) est dans l'APK :
      # aucun lecteur GPL ne peut l'y côtoyer, et les AAR de android/maven-local
      # doivent se déclarer LGPL (lib/android-player-license.mjs).
      - name: Licence des lecteurs Android (pas de GPL à côté de Firebase)
        if: steps.plan.outputs.channel != 'build' && steps.plan.outputs.android != 'skip'
        run: node .github/scripts/check-android-player-license.mjs mobile

      # LE PRÉ-VOL. Un bloc de changelog manquant donnait jusqu'ici une
      # publication SANS NOTES, en silence : `release-notes.mjs` sort en 0 sans
      # écrire de fichier, et les étapes enchaînaient avec « || true ».
      - name: Pré-vol des notes de version
        if: steps.plan.outputs.channel != 'build'
        run: |
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/mobile.md --version "${{ steps.plan.outputs.version }}" \
            --check play --check asc:ios

  # ── Android : l'AAB seulement. La publication est un job à part (voir « play »),
  #    pour que la sérialisation avec la TV dure des secondes et non l'heure du build.
  android:
    needs: prepare
    if: needs.prepare.outputs.android == 'build'
    name: Android mobile (AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-mobile-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-mobile-

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # NDK 29.0.14206865 (android.ndkVersion dans gradle.properties et app.json) :
      # celui avec lequel libmpv-android 1.0.0 est construit — son libmpv.so
      # exige le libc++ de cette génération, et c'est le libc++_shared.so du NDK
      # de l'app qui est paqueté. Le runner ne le préinstalle pas forcément.
      - name: NDK 29 (libmpv-android)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
      - name: Decode upload keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::MOBILE_KEYSTORE_BASE64 absent — AAB debug-signed, upload Play sauté."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # google-services.json (Firebase/FCM) : fichier client non commité (repo public),
      # restauré depuis un secret base64. Requis par le plugin google-services au build.
      - name: Decode google-services.json (Firebase/FCM)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.MOBILE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > apps/mobile/android/app/google-services.json
            echo "google-services.json restauré (Firebase/FCM)."
          else
            echo "::error::Secret MOBILE_GOOGLE_SERVICES_JSON absent — le build Android échouera (plugin google-services). Ajoute-le dans Settings → Secrets → Actions."
            exit 1
          fi

      - name: Build release (AAB)
        working-directory: apps/mobile/android
        env:
          KS_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          ARGS="-PmobileVersionName=${{ needs.prepare.outputs.version }} -PmobileVersionCode=${{ needs.prepare.outputs.vcode }}"
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ARGS="$ARGS -PmobileKeystoreFile=$RUNNER_TEMP/upload.jks -PmobileKeystorePassword=$KS_PASSWORD -PmobileKeyAlias=$KS_ALIAS -PmobileKeyPassword=$KS_KEY_PASSWORD"
          fi
          echo "Android mobile build → versionName=${{ needs.prepare.outputs.version }} versionCode=${{ needs.prepare.outputs.vcode }}"
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon $ARGS

      # AAB signé toujours archivé : PREMIÈRE soumission Play (upload manuel dans la
      # console) et secours si l'API échoue.
      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tentacle-mobile-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # ── Play : envoi OU promotion, en une édition. Sérialisé avec tv.yml : Android
  #    TV et Android mobile partagent la fiche com.tentacletv.mobile, et deux
  #    éditions concurrentes s'invalident l'une l'autre.
  play:
    needs: [prepare, android]
    if: >-
      !cancelled() && needs.prepare.outputs.channel != 'build'
      && (needs.prepare.outputs.android == 'promote'
          || (needs.prepare.outputs.android == 'build' && needs.android.result == 'success'))
    name: Play Console (${{ needs.prepare.outputs.play_track }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Lecture seule : ce job ne commite plus le manifeste (voir plus bas).
    permissions:
      contents: read
    concurrency:
      group: play-com.tentacletv.mobile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Récupérer l'AAB
        if: needs.prepare.outputs.android == 'build'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tentacle-mobile-aab
          path: aab

      - name: Publier
        id: publish
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ needs.prepare.outputs.android }}" = "promote" ]; then
            SOURCE="--promote-from ${{ env.PLAY_MOBILE_TRACK }}"
          else
            SOURCE="--aab aab/app-release.aab"
          fi
          # Au cran store, la piste interne reçoit aussi le binaire de production
          # (sans effet à la promotion : elle le sert déjà).
          ALSO=""
          if [ "${{ needs.prepare.outputs.channel }}" = "store" ]; then
            ALSO="--also-track ${{ env.PLAY_MOBILE_TRACK }}"
          fi
          # shellcheck disable=SC2086
          node .github/scripts/play-publish.mjs \
            --package "${{ env.PLAY_PACKAGE }}" \
            --track "${{ needs.prepare.outputs.play_track }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --changelog changelogs/mobile.md $SOURCE $ALSO

      # Le manifeste (updates/store-versions.json) n'est PLUS patché ici. Il
      # l'était dès l'envoi à Google, cran test compris : le site affichait une
      # version de piste fermée, ou une version encore à l'examen. C'est le
      # veilleur (store-watch.yml) qui patche le bloc playMobile, quand la
      # PRODUCTION sert réellement la version — la règle du bloc macAppStore.

  # ── iOS ────────────────────────────────────────────────────────────────────
  ios:
    needs: prepare
    if: needs.prepare.outputs.ios == 'build'
    name: Build + envoi iOS
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      # Même Xcode/SDK qu'en local (Xcode 26.3 / SDK iOS 26.2) → builds acceptés par
      # App Store (qui exige le SDK iOS 26+).
      - name: Select Xcode 26.3 (identique au local)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      # Le binaire MPVKit (257 Mio) est téléchargé par CocoaPods : mis en cache
      # avec les pods, clé sur le lockfile ET le podspec qui porte l'URL/la somme.
      - name: Cache CocoaPods
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile.lock', 'apps/mobile/ios/MPVKit.podspec') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Import Apple Distribution certificate
        env:
          APP_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          APP_CERT_PW: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$APP_CERT" | base64 --decode > /tmp/app.p12
          security import /tmp/app.p12 -k build.keychain -P "$APP_CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/app.p12

      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/private_keys/AuthKey_${API_KEY}.p8
          cp ~/private_keys/AuthKey_${API_KEY}.p8 ~/.appstoreconnect/private_keys/
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"

      # Profil App Store recréé via l'API ASC (signature MANUELLE avec le cert
      # Distribution du keychain + profil idempotent : delete + create → il
      # référence toujours NOTRE certificat).
      - name: Provision App Store profile (API ASC)
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          JWT=$(ruby -e '
            require "openssl"; require "base64"; require "json"
            key = OpenSSL::PKey.read(File.read(ENV.fetch("ASC_KEY_PATH")))
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            header  = b64.(JSON.dump({ alg: "ES256", kid: ENV.fetch("API_KEY"), typ: "JWT" }))
            now     = Time.now.to_i
            payload = b64.(JSON.dump({ iss: ENV.fetch("API_ISSUER"), iat: now, exp: now + 1200, aud: "appstoreconnect-v1" }))
            data    = "#{header}.#{payload}"
            der     = key.sign(OpenSSL::Digest.new("SHA256"), data)
            r, s    = OpenSSL::ASN1.decode(der).value.map { |i| i.value.to_s(2).rjust(32, "\x00".b) }
            puts "#{data}.#{b64.(r + s)}"
          ')
          api() { curl -sf -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" "$@"; }
          BASE="https://api.appstoreconnect.apple.com/v1"

          # Certificat Distribution du keychain → id API (match par n° de série)
          SERIAL=$(security find-certificate -c "Apple Distribution" -p build.keychain \
            | openssl x509 -noout -serial | cut -d= -f2 | tr '[:lower:]' '[:upper:]')
          CERTS=$(api "$BASE/certificates?filter%5BcertificateType%5D=DISTRIBUTION&limit=200")
          CERT_ID=$(echo "$CERTS" | jq -r --arg s "$SERIAL" \
            '[.data[] | select((.attributes.serialNumber | ascii_upcase) == $s)][0].id // empty')
          if [ -z "$CERT_ID" ]; then
            COUNT=$(echo "$CERTS" | jq '.data | length')
            if [ "$COUNT" = "1" ]; then CERT_ID=$(echo "$CERTS" | jq -r '.data[0].id');
            else echo "::error::Certificat Distribution du keychain (serial $SERIAL) introuvable côté API ($COUNT candidats)"; exit 1; fi
          fi

          # Un profil par identifiant : l'app, puis l'extension de la Live
          # Activity (son identifiant est créé s'il n'existe pas encore).
          provision() {
            local bundle="$1" name="$2" file="$3" create="${4:-}"
            local bid
            bid=$(api "$BASE/bundleIds?filter%5Bidentifier%5D=$bundle&limit=200" \
              | jq -r --arg b "$bundle" '[.data[] | select(.attributes.identifier == $b)][0].id')
            if { [ -z "$bid" ] || [ "$bid" = "null" ]; } && [ -n "$create" ]; then
              bid=$(api -X POST "$BASE/bundleIds" -d "$(jq -n --arg id "$bundle" --arg n "$create" \
                '{data:{type:"bundleIds",attributes:{identifier:$id,name:$n,platform:"IOS"}}}')" | jq -r '.data.id')
              echo "Identifiant $bundle créé"
            fi
            [ -n "$bid" ] && [ "$bid" != "null" ] || { echo "::error::bundleId $bundle introuvable"; exit 1; }

            # Idempotent : purge l'ancien profil du même nom puis (re)crée
            local enc old profile
            enc=$(NAME="$name" python3 -c 'import urllib.parse,os;print(urllib.parse.quote(os.environ["NAME"]))')
            old=$(api "$BASE/profiles?filter%5Bname%5D=$enc" | jq -r '.data[0].id // empty')
            [ -n "$old" ] && api -X DELETE "$BASE/profiles/$old" >/dev/null || true
            profile=$(api -X POST "$BASE/profiles" -d "$(jq -n \
              --arg name "$name" --arg bid "$bid" --arg cid "$CERT_ID" \
              '{data:{type:"profiles",attributes:{name:$name,profileType:"IOS_APP_STORE"},
                relationships:{bundleId:{data:{type:"bundleIds",id:$bid}},
                               certificates:{data:[{type:"certificates",id:$cid}]}}}}')")
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$profile" | jq -r '.data.attributes.profileContent' | base64 --decode \
              > "$HOME/Library/MobileDevice/Provisioning Profiles/$file"
            echo "Profil « $name » installé (cert $CERT_ID)"
          }
          provision "$IOS_BUNDLE_ID" "$IOS_PROFILE_NAME" tentacle-ios-ci.mobileprovision
          provision "$IOS_EXT_BUNDLE_ID" "$IOS_EXT_PROFILE_NAME" tentacle-ios-ext-ci.mobileprovision "Tentacle TV Live Activity"
          provision "$IOS_SHARE_BUNDLE_ID" "$IOS_SHARE_PROFILE_NAME" tentacle-ios-share-ci.mobileprovision "Tentacle TV Share"

      # L'Info.plist code la version EN DUR (pas de $(MARKETING_VERSION)) → on la
      # patche directement depuis le job `version` (versions.json + build auto).
      - name: Set version / build (Info.plist)
        run: |
          PLIST=apps/mobile/ios/TentacleTV/Info.plist
          # Les extensions (Live Activity, partage) portent EXACTEMENT la version de l'app (App Store l'exige).
          for PLIST in "$PLIST" apps/mobile/ios/TransferLiveActivity/Info.plist apps/mobile/ios/ShareToTentacle/Info.plist; do
            plutil -replace CFBundleShortVersionString -string "${{ needs.prepare.outputs.version }}" "$PLIST"
            plutil -replace CFBundleVersion -string "${{ needs.prepare.outputs.build }}" "$PLIST"
            plutil -p "$PLIST" | grep -E "CFBundleShortVersionString|CFBundleVersion"
          done

      # Build de diffusion (TestFlight/App Store) → APNs production. L'entitlement
      # committé est `development` (pour les builds Xcode locaux) ; on force
      # `production` ici pour matcher le profil de provisioning Distribution.
      - name: Force production APNs entitlement
        run: |
          ENT=apps/mobile/ios/TentacleTV/TentacleTV.entitlements
          plutil -replace aps-environment -string production "$ENT"
          plutil -p "$ENT" | grep aps-environment

      # Un profil PAR CIBLE : passé en ligne de commande, PROVISIONING_PROFILE_SPECIFIER
      # vaudrait aussi pour l'extension, que le profil de l'app ne couvre pas.
      - name: Profils par cible (app, extensions Live Activity et partage)
        run: |
          node .github/scripts/ios-target-profiles.mjs apps/mobile/ios/TentacleTV.xcodeproj/project.pbxproj \
            "TentacleTV=$IOS_PROFILE_NAME" "TransferLiveActivity=$IOS_EXT_PROFILE_NAME" "ShareToTentacle=$IOS_SHARE_PROFILE_NAME"

      - name: Archive (xcodebuild, signature manuelle Distribution)
        run: |
          xcodebuild archive \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/TentacleTV.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"

      - name: Export .ipa (App Store)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key><string>${IOS_PROFILE_NAME}</string>
              <key>${IOS_EXT_BUNDLE_ID}</key><string>${IOS_EXT_PROFILE_NAME}</string>
              <key>${IOS_SHARE_BUNDLE_ID}</key><string>${IOS_SHARE_PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TentacleTV.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Tentacle-TV-iOS-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      - name: Envoi TestFlight
        if: needs.prepare.outputs.channel != 'build'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/ipa/*.ipa -t ios \
            --apiKey "$API_KEY" --apiIssuer "$API_ISSUER"

  # Attend le traitement ASC (~10-35 min), puis DISTRIBUE le build au groupe de
  # test — sans quoi un build TestFlight reste visible mais n'atteint personne.
  # Aucune version App Store ici : une autre peut être en examen, et ASC
  # refuserait. Seul ios-review (cran store) l'ouvre et y rattache le build.
  ios-attach:
    needs: [prepare, ios]
    if: needs.prepare.outputs.ios == 'build' && needs.prepare.outputs.channel != 'build' && needs.ios.result == 'success'
    name: iOS — distribuer sur TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Les blocs `env` sont recopiés d'une étape à l'autre : GitHub Actions ne
      # sait pas lire les ancres YAML (« &x » / « <<: *x »), le workflow serait
      # refusé au chargement.
      - name: Attendre le traitement ASC + « À tester »
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/mobile.md
        run: node .github/scripts/asc-await-build.mjs
      - name: Distribuer au groupe de test
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          ASC_BETA_GROUP_ID: ${{ secrets.ASC_BETA_GROUP_ID }}
        run: node .github/scripts/asc-testflight-distribute.mjs
      # Délai dépassé ou build invalide : l'état brut des derniers builds, sans le
      # filtre preReleaseVersion qui peut cacher un build rejeté.
      - name: État des builds ASC (diagnostic)
        if: failure()
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
        run: node .github/scripts/asc-list-builds.mjs

  # Le dernier geste manuel côté Apple : soumettre à l'examen, et mettre en
  # vente dès l'approbation. Au cran store seulement.
  ios-review:
    needs: [prepare, ios-attach]
    if: >-
      !cancelled() && needs.prepare.outputs.channel == 'store'
      && needs.prepare.outputs.ios != 'skip'
      && (needs.prepare.outputs.ios == 'promote' || needs['ios-attach'].result == 'success')
    name: iOS — soumettre à l'examen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      # Les « Nouveautés » sont reposées ICI, juste avant l'envoi — même geste
      # que mac-review (desktop.yml). Au cran « promote », aucun autre job ne
      # les écrit : c'est le seul moyen de réparer des notes refusées sans
      # reconstruire, et sans elles la version ne peut pas entrer dans la
      # soumission (macOS 1.22.0 : « ✓ » refusé, 409). Mêmes variables que la
      # pose du premier passage ; au promote, BUILD ne désigne aucun build
      # existant : « À tester » est ignoré, seules les notes App Store partent.
      - name: Poser les notes (App Store)
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          CHANGELOG: changelogs/mobile.md
        run: node .github/scripts/asc-release-notes.mjs
      - name: Soumettre à l'examen App Store
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_CONTENT }}
          BUNDLE_ID: com.tentacle.mobile
          PLATFORM: IOS
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANGELOG: changelogs/mobile.md
        run: node .github/scripts/asc-submit-review.mjs

  # ── L'offre de sources (GPL / LGPL) : une Release « sources-<tag> » à part,
  #    en parallèle de la livraison — rien ne l'attend (sources.yml).
  sources:
    needs: prepare
    if: needs.prepare.outputs.channel == 'test' || needs.prepare.outputs.channel == 'store'
    permissions:
      contents: write
    uses: ./.github/workflows/sources.yml
    with:
      app: mobile
      tag: ${{ needs.prepare.outputs.tag }}
      sha: ${{ needs.prepare.outputs.sha }}

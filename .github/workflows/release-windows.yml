# Tentacle TV — Windows (installeur téléchargeable)
#
# Déclenché par un tag `win-v<version>-<build>`. Build l'app Tauri Windows avec
# la CONFIG DE BASE (tauri.conf.json) — exactement comme un `pnpm tauri build`
# local qui fonctionne — PAS la config Microsoft Store (sandbox) qui produisait
# un build qui ne s'ouvrait pas.
#
# Produit NSIS (.exe) + MSI, publiés en Release GitHub. WebView2 est téléchargé
# à l'installation s'il est absent (déjà préinstallé sur Windows 10/11).
#
# NB : build NON signé (pas de cert) -> SmartScreen affichera un avertissement
# « Éditeur inconnu » à la 1re installation (clic « Informations complémentaires
# → Exécuter quand même »). Pour signer : ajouter un cert en secret plus tard.
#
# La soumission au Microsoft Store reste séparée (release-store.yml) et nécessite
# un compte Entra ID lié au Partner Center.

name: Release Windows (installeur)

on:
  push:
    tags: ["win-v*"]

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    name: Build Windows (NSIS + MSI)
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install dependencies (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Build Windows app (config de base)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis,msi
          tagName: ${{ github.ref_name }}
          releaseName: "Tentacle TV (Windows) ${{ github.ref_name }}"
          releaseBody: |
            Installeur Windows (NSIS .exe + MSI).
            WebView2 est téléchargé automatiquement à l'installation s'il est absent.
            Build non signé : si Windows affiche « Éditeur inconnu », cliquez sur
            « Informations complémentaires » → « Exécuter quand même ».
          releaseDraft: false
          prerelease: false

# Tentacle TV — SERVEUR (backend + web, image Docker multi-arch)
#
# DÉCLENCHEMENT À LA DEMANDE, PLUS AU PUSH. Publier le serveur était jusqu'ici
# un effet de bord de `git push origin main` : chaque poussée reconstruisait et
# republiait `:latest`, y compris les commits de manifeste du bot (ce workflow
# n'avait aucun filtre `paths:`). La mise en service est redevenue un geste —
# celui qu'on pose depuis la page de déploiement.
#
# TROIS CRANS, choisis au lancement (`channel`) :
#   • build — l'image est construite, rien n'est poussé. Vérifie que ça compile.
#   • test  — image poussée en `:vX.Y.Z` SEULEMENT. `:latest` ne bouge pas, donc
#             la production ne suit pas : on peut tirer la version à la main
#             pour l'éprouver.
#   • store — `:latest` bascule et la Release GitHub `server-vX.Y.Z` est créée.
#             C'est ce cran, et lui seul, qui met en service.
#
# ET UN CRAN DE DÉVELOPPEMENT, « dev » : `:dev` et `:dev-<sha>`, jamais
# `:latest` ni `:vX.Y.Z`, ni Release, ni bump — l'image de la branche `dev`,
# pour qui veut l'éprouver avant une livraison. C'est la SEULE exception au
# « rien ne part d'un push » : une poussée sur `dev` qui touche le serveur le
# lance d'elle-même (et rend sans objet la précédente, encore en cours).
#
# L'image Docker EST le serveur : une seule cible, `docker`.
#
# ⚠️ LE CLIENT LG N'EN FAIT PLUS PARTIE. L'image sert aussi, sous /tv, le client
# des téléviseurs LG ; il était jusqu'ici reconstruit depuis le commit à chaque
# livraison serveur, qui changeait donc l'interface de la TV sans le dire. Ce
# workflow le REPREND désormais de l'image en service (`:latest`) : seul
# webos.yml livre un nouveau client LG — il reconstruit alors l'image, avec ce
# même serveur. La construction et la publication vivent dans le workflow
# commun server-image.yml (mode « server »).
#
# La version vient de versions.json → `server` (SOURCE UNIQUE). L'entrée
# `version` du dispatch la BUMPE : prepare écrit versions.json, aligne
# apps/backend/package.json, commite et pousse — `minServer` reste à la main,
# c'est une exigence et non une livraison.
#
# CETTE VERSION EST AUSSI CELLE DE TENTACLE SERVER POUR WINDOWS (décision du
# 2026-10-12) : avec l'entrée `windows` (crans test et store), UN SEUL RUN livre
# l'image Docker PUIS le paquet Windows — server-windows.yml appelé comme un job
# (workflow_call), au même cran, à la même version, sur le commit figé de ce
# run — paquet S.0. Ses notes sont CELLES DU SERVEUR (même bloc ## [S] de
# changelogs/server.md, mesuré aussi contre la limite du Microsoft Store). Son
# pré-vol (variables du Store, ce bloc) se joue ici, AVANT le bump.
#
# Notes de la Release : changelogs/server.md (bloc « ## [X.Y.Z] », ### FR/### EN),
# EXIGÉ par le pré-vol de `prepare` — un bloc manquant ne donne plus une Release
# au corps vide, il arrête le run avant le build.

name: Server (Docker)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Jusqu'où aller"
        type: choice
        options: [build, test, store, dev]
        default: test
      version:
        description: "Version X.Y.Z à livrer (vide = versions.json inchangé)"
        type: string
        default: ""
      # Livrer AUSSI Tentacle Server pour Windows dans ce run (server-windows.yml
      # appelé après l'image), au même cran, à la même version, avec les mêmes
      # notes. Crans test et store seulement ; jamais par une poussée sur dev.
      windows:
        description: "Livrer aussi Tentacle Server pour Windows (même cran, même version — test et store seulement)"
        type: boolean
        default: false
  # Le cran dev, et lui seul : ce qui change l'image du serveur, sur `dev`.
  push:
    branches: [dev]
    paths:
      - "apps/backend/**"
      - "apps/web/**"
      - "packages/**"
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - "versions.json"
      - "compat/jellyfin.json"
      - ".github/workflows/server.yml"
      - ".github/workflows/server-image.yml"
      - ".github/scripts/lib/server-image.mjs"
      - ".github/scripts/server-image-plan.mjs"

# Les livraisons s'attendent (rien ne s'y perd). Une poussée sur dev rend la
# précédente sans objet : elle l'annule.
concurrency:
  group: ${{ github.event_name == 'push' && 'server-dev' || 'release-server' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ── Ce qui rend tout le reste reproductible (voir mobile.yml, même forme) ──
  prepare:
    name: Préparer la livraison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      # Une poussée sur dev n'a pas d'entrées : c'est le cran dev.
      channel: ${{ inputs.channel || 'dev' }}
      windows: ${{ steps.windows.outputs.windows }}
    steps:
      - name: Le cran dev ne bumpe jamais
        if: inputs.channel == 'dev' && inputs.version != ''
        run: |
          echo "::error::Le cran dev publie :dev sans toucher aux versions : laisse « version » vide."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Depuis une autre branche que main : build ou test, jamais le store ni un bump.
      - uses: ./.github/actions/store-from-main
        with:
          channel: ${{ inputs.channel || 'dev' }}
          bump: ${{ inputs.version }}

      - uses: ./.github/actions/require-quality
        with:
          sha: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # L'app Windows enchaînée ? Seulement aux crans test et store — refusé
      # ici, AVANT le bump, plutôt qu'un run Windows qui échouerait après la
      # livraison du serveur. Une poussée sur dev n'a pas d'entrées : jamais.
      - name: Enchaîner Tentacle Server pour Windows ?
        id: windows
        env:
          CHANNEL: ${{ inputs.channel || 'dev' }}
          WINDOWS: ${{ inputs.windows || false }}
        run: node .github/scripts/server-windows-plan.mjs follow-up --channel "$CHANNEL" --windows "$WINDOWS"

      # Ce que server-windows.yml exigera, vérifié dès maintenant : où part la
      # soumission, l'identité de Partner Center, et le bloc ## [S] de
      # changelogs/server.md (S = la version que ce run va livrer) mesuré contre
      # la limite du Microsoft Store — l'app publie LES MÊMES notes que le
      # serveur ; au-delà de 1 500 caractères par langue, un avertissement dit
      # de combien la coupe à la puce va mordre.
      - name: Pré-vol de l'app Windows
        if: steps.windows.outputs.windows == 'true'
        env:
          CHANNEL: ${{ inputs.channel }}
          WANTED: ${{ inputs.version }}
          SERVER_WINDOWS_STORE_ID: ${{ vars.SERVER_WINDOWS_STORE_ID }}
          SERVER_WINDOWS_FLIGHT_ID: ${{ vars.SERVER_WINDOWS_FLIGHT_ID }}
          IDENTITY_NAME: ${{ vars.SERVER_WINDOWS_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.SERVER_WINDOWS_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.SERVER_WINDOWS_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          node .github/scripts/server-windows-plan.mjs store --channel "$CHANNEL"
          if [ -z "$IDENTITY_NAME" ] || [ -z "$PUBLISHER" ] || [ -z "$PUBLISHER_DISPLAY_NAME" ]; then
            echo "::error::Variables SERVER_WINDOWS_IDENTITY_NAME, SERVER_WINDOWS_PUBLISHER et SERVER_WINDOWS_PUBLISHER_DISPLAY_NAME requises pour livrer l'app Windows (Partner Center › Identité du produit)."
            exit 1
          fi
          VERSION="${WANTED:-$(jq -r .server versions.json)}"
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/server.md --version "$VERSION" --check msstore

      - name: Bump versions.json (si une version est demandée)
        id: bump
        if: inputs.version != ''
        env:
          WANTED: ${{ inputs.version }}
        run: node .github/scripts/bump-version.mjs server "$WANTED"

      - uses: ./.github/actions/push-main
        id: pushed
        if: steps.bump.outputs.changed == 'true'
        with:
          paths: ${{ steps.bump.outputs.files }}
          message: "release(server) : v${{ inputs.version }}"

      - name: Plan du run
        id: plan
        env:
          BUMPED_SHA: ${{ steps.pushed.outputs.sha }}
        run: |
          set -euo pipefail
          SHA="${BUMPED_SHA:-${{ github.sha }}}"
          git checkout --quiet "$SHA"
          VERSION=$(jq -r .server versions.json)
          echo "Serveur ${VERSION} — cran ${{ inputs.channel || 'dev' }} · sha ${SHA}"
          { echo "sha=$SHA"; echo "version=$VERSION"; } >> "$GITHUB_OUTPUT"

      - name: Pré-vol des notes de version
        if: inputs.channel == 'store'
        run: |
          node .github/scripts/check-changelog.mjs \
            --changelog changelogs/server.md --version "${{ steps.plan.outputs.version }}" \
            --check github

  # ── L'image : construite, étiquetée et publiée par le workflow COMMUN ─────
  # Même workflow que la reconstruction webOS (webos.yml) : une seule façon de
  # pousser l'image, et une seule bascule de `:latest`, protégée par un
  # compare-and-swap. Le client LG y est repris de l'image en service, jamais
  # construit depuis ce commit ; la Release server-vX.Y.Z (cran store) dit
  # lequel elle embarque.
  image:
    name: Image
    needs: prepare
    uses: ./.github/workflows/server-image.yml
    permissions:
      contents: write
      packages: write
      # Signature keyless (cosign) de l'image par server-image.yml : un
      # workflow appelé ne reçoit jamais plus que ce que son appelant lui donne.
      id-token: write
    with:
      mode: server
      channel: ${{ needs.prepare.outputs.channel }}
      sha: ${{ needs.prepare.outputs.sha }}
    secrets:
      KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}

  # ── L'offre de sources (GPL / LGPL) : une Release « sources-<tag> » à part,
  #    en parallèle de la livraison — rien ne l'attend (sources.yml).
  sources:
    needs: prepare
    if: needs.prepare.outputs.channel == 'test' || needs.prepare.outputs.channel == 'store'
    permissions:
      contents: write
    uses: ./.github/workflows/sources.yml
    with:
      app: server
      tag: server-v${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}

  # ── Tentacle Server pour Windows, dans le MÊME run (entrée `windows`) ──────
  # Un seul run : image Docker + paquet Windows. Une fois l'image publiée — et
  # `:latest` basculé au cran store (le job `image` comprend la bascule et la
  # Release) —, server-windows.yml est APPELÉ comme un job (workflow_call) au
  # MÊME cran, à la MÊME version (celle que ce run vient d'écrire), sur le MÊME
  # commit figé : pas de second bump. Ses gardes (« :vS » existe, `:latest` = ce
  # serveur au cran store) passent donc d'elles-mêmes. Le cran dev ne l'appelle
  # jamais (`follow-up` le refuse ; une poussée sur dev n'a pas d'entrée).
  # Les permissions données ici bornent celles des jobs appelés : contents
  # write pour le tag server-windows-vS, actions read pour la garde qualité,
  # packages read pour le registre.
  windows:
    name: Tentacle Server pour Windows
    needs: [prepare, image]
    if: needs.prepare.outputs.windows == 'true'
    uses: ./.github/workflows/server-windows.yml
    permissions:
      contents: write
      actions: read
      packages: read
    with:
      channel: ${{ needs.prepare.outputs.channel }}
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit

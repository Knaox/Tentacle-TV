<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tentacle-logo-pirate.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' blob: data: https: http:; media-src 'self' blob: https: http:; connect-src 'self' https: http: ws: wss: http://ipc.localhost ipc:; font-src 'self' https://fonts.gstatic.com; frame-src 'self' blob: https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <title>Tentacle</title>
    <script>
      // NE PAS placer de commentaire HTML entre <!doctype> et la balise
      // ouvrante : Vite y injecte le preamble react-refresh et le client HMR
      // par heuristique, et un commentaire a cet endroit les AVALE — ils se
      // retrouvent commentes, React refresh ne s'initialise jamais et l'app
      // meurt sur « @vitejs/plugin-react can't detect preamble ».
      //
      // L'attribut `data-theme` remplace l'ancienne classe `dark`, qui etait
      // INERTE : Tailwind n'est pas configure en darkMode:"class" et aucune
      // variante `dark:` n'existe dans le code.
      //
      // Pose data-theme AVANT le premier paint. Sans ce bloc, l'app s'ouvre en
      // sombre (valeurs de :root) puis bascule en clair au montage de React —
      // le flash est très visible sur desktop où la fenêtre s'ouvre déjà peinte.
      // Volontairement inline et sans dépendance : tout report après le parsing
      // du bundle réintroduirait le flash.
      (function () {
        var dark = true; // rendu historique de l'app, et repli si tout echoue
        try {
          var mode = localStorage.getItem("tentacle_theme_mode");
          if (mode !== "light" && mode !== "dark") mode = "auto"; // défaut + valeurs corrompues
          dark =
            mode === "dark" ||
            (mode === "auto" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          // localStorage indisponible (mode privé, WebView verrouillée).
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", dark ? "dark" : "light");

        // Peint un fond opaque DES MAINTENANT. Tant que la feuille de style
        // n'est pas appliquee, rien ne peint : sur une fenetre Tauri sans
        // fond, on verrait le BUREAU. En dev c'est tres visible, Vite
        // injectant le CSS via le graphe JS.
        //
        // Sur macOS la fenetre est desormais OPAQUE hors lecture — une fenetre
        // `transparent: true` y coute environ huit fois plus de GPU en
        // permanence, page immobile comprise (bug Tauri #15471), et la
        // transparence n'est demandee que le temps d'une lecture, quand mpv
        // dessine sous la webview. Windows, lui, la garde en permanence : les
        // controles HTML du lecteur y sont dessines par-dessus la video a
        // travers la webview. Ce repli sert donc les deux cas.
        //
        // Style inline, donc prioritaire : `ThemeProvider` le retire au montage
        // (`releaseBootBackground`) pour rendre la main a `--surface-0` et ne
        // pas figer la surcharge admin ni la bascule de schema.
        root.style.background = dark ? "#000000" : "#F4F4F7";
      })();
    </script>
  </head>
  <body class="bg-tentacle-bg text-content-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

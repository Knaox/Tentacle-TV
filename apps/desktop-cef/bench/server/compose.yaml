# Banc local JETABLE : Tentacle + Jellyfin pour le proto CEF.
#
# Adapté d'une COPIE de `stacks/tentacle-full/compose.yaml` du dépôt Tentacle (lu,
# jamais modifié). Écarts, et pourquoi :
#  - ports 3471 (Tentacle) et 8471 (Jellyfin), liés à 127.0.0.1 : rien n'est
#    publié sur le réseau, et les ports par défaut (3000, 8096) servent ailleurs ;
#  - pas de port de découverte UDP : inutile en local, et il entrerait en
#    collision avec d'autres Jellyfin du Mac ;
#  - pas de `jellyfin-init` : les médias sont montés en LECTURE SEULE depuis
#    `~/.cache/tentacle-cef/media` (fabriqués par les sessions vidéo-HDR et
#    octave), le banc n'y crée rien ;
#  - données dans des volumes nommés du projet `tentacle-cef-banc` : `banc.sh
#    reset` les efface, rien d'autre n'est touché ;
#  - REMOTE_CHECK_URL off : le banc ne parle à aucun service extérieur.
name: tentacle-cef-banc

services:
  jellyfin:
    image: jellyfin/jellyfin:12
    restart: "no"
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:8471:8096"
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:?MEDIA_PATH manquant (banc.sh le pose)}:/media:ro

  tentacle:
    image: ${TENTACLE_IMAGE:-ghcr.io/knaox/tentacle-tv:latest}
    restart: "no"
    depends_on:
      jellyfin:
        condition: service_started
    environment:
      TENTACLE_STACK: full
      TENTACLE_HOST_PORT: "3471"
      JELLYFIN_HOST_PORT: "8471"
      JELLYFIN_INTERNAL_URL: http://jellyfin:8096
      REMOTE_CHECK_URL: "off"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:3471:3000"
    volumes:
      - tentacle-data:/app/apps/backend/data

volumes:
  tentacle-data:
  jellyfin-config:
  jellyfin-cache:

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    // Firebase / FCM (notifications push Android) — lu au build par le plugin ci-dessous.
    classpath('com.google.gms:google-services:4.4.2')
  }
}

// Le NDK de l'app est celui de `android.ndkVersion` (gradle.properties) : posé
// ici, avant le plugin racine d'Expo, qui ne fixe `ndkVersion` que s'il manque —
// expo-build-properties 1.0 ne connaît pas cette clé, et la table des propriétés
// `android.*` du plugin de settings non plus.
def requestedNdk = findProperty('android.ndkVersion')
if (requestedNdk) {
  ext.ndkVersion = requestedNdk
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.offlinestorage'
version = '1.0.0'

android {
  namespace "expo.modules.offlinestorage"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // `JsKeepAlive` : la tâche headless qui garde les minuteurs du JavaScript en
  // marche pendant un transfert (HeadlessJsTaskContext). Version tenue par l'app.
  implementation 'com.facebook.react:react-android'
}

buildscript {
    ext {
        buildToolsVersion = "36.1.0"
        minSdkVersion = 26
        // RN 0.81 : ses AAR sont compilés en compileSdk 36 — AGP refuse de les
        // consommer depuis un compileSdk inférieur. targetSdk reste 34 (niveau
        // exigé par Play pour le form factor TV) : le monter changerait le
        // comportement runtime sans rien apporter ici.
        compileSdkVersion = 36
        targetSdkVersion = 34
        // NDK 29 : libmpv-android 1.0.0 est construit avec (LLVM 20), et son
        // libmpv.so attend le `std::from_chars` flottant d'un libc++ de cette
        // génération. Le libc++_shared.so de l'app (celui du NDK de l'app) gagne
        // au paquetage sur celui de l'AAR : construit avec le 27.1, libmpv ne se
        // chargeait pas (« cannot locate symbol », mesuré à l'émulateur sur le
        // mobile). Un libc++ plus récent lit les binaires plus anciens, pas
        // l'inverse. La règle Play « pages de 16 Ko » est acquise depuis le
        // NDK 28 (alignement ELF 16 Ko par défaut ; le
        // -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON de reanimated/screens devient
        // redondant). Le workflow tv.yml installe la MÊME version (sdkmanager).
        ndkVersion = "29.0.14206865"
        kotlinVersion = "2.1.20"
    }
}

plugins {
    // AGP ≥ 8.5.1 aligne aussi les .so non compressées sur 16 Ko DANS le zip
    // de l'AAB — l'autre moitié de la règle 16 Ko, que l'AGP 8.2.2 précédent
    // ne faisait pas. 8.11.0 = version de référence de RN 0.81.
    id("com.android.application") version "8.11.0" apply false
    id("org.jetbrains.kotlin.android") version "2.1.20" apply false
    id("com.facebook.react.rootproject")
}

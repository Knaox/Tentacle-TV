apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tentacletv"
    defaultConfig {
        // MÊME app Play Console que le mobile (fiche unique, form factor TV —
        // piste de tests fermés dédiée « Tests fermés - Alpha »). Le namespace
        // reste com.tentacletv : le code Kotlin ne bouge pas.
        applicationId "com.tentacletv.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Surchargés par le tag CI (tv-v<version>-<build>) via -PtvVersionName / -PtvVersionCode.
        // NB : variable locale + appel sans parenthèses pour éviter l'ambiguïté Groovy
        // `versionCode (...) as int` (parsée comme appel void → « Value is null » dès qu'un
        // -PtvVersionCode est passé, sur AGP récent). Même correctif que l'app mobile.
        def resolvedTvVersionCode = (project.findProperty('tvVersionCode') ?: '6').toString().toInteger()
        def resolvedTvVersionName = (project.findProperty('tvVersionName') ?: '1.0.0').toString()
        versionCode resolvedTvVersionCode
        versionName resolvedTvVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Renseignée par le CI (-PtvKeystoreFile / -PtvKeystorePassword /
            // -PtvKeyAlias / -PtvKeyPassword) — même keystore d'upload que le
            // mobile (secrets MOBILE_*). Absente en local → bloc vide, et le
            // release buildType retombe sur la signature debug (dev/sideload local).
            def ksFile = project.findProperty('tvKeystoreFile')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword project.findProperty('tvKeystorePassword')
                keyAlias project.findProperty('tvKeyAlias')
                keyPassword project.findProperty('tvKeyPassword')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signé release si le CI fournit la keystore (AAB Play + APK GitHub),
            // sinon debug-signed (build local).
            signingConfig project.hasProperty('tvKeystoreFile') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("dev.jdtech.mpv:libmpv:0.5.1")

    // Media3 ExoPlayer — aligned with react-native-video (1.8.0)
    implementation "androidx.media3:media3-exoplayer:1.8.0"
    implementation "androidx.media3:media3-exoplayer-hls:1.8.0"
    implementation "androidx.media3:media3-ui:1.8.0"

    // Jellyfin FFmpeg decoder — AV1 (dav1d) + audio codec fallback
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.8.0+1"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        def jscFlavor = 'org.webkit:android-jsc:+'
        implementation(jscFlavor)
    }
}

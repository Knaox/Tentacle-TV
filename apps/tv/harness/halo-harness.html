<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Tentacle TV — harnais de halo</title>
    <!--
      Le halo de bannière de la RÉFÉRENCE (web/desktop), recomposé hors app aux
      cotes réelles du rendu téléviseur (1920×1080, carte 1526×670 à 242,54) —
      pour juger le rendu natif au pixel plutôt qu'à l'œil.

      Les règles ci-dessous sont la copie exacte de `HeroAmbilight.tsx` et de
      `--hero-ambilight-*` (surfaces.css) : source 128 px posée dans une boîte à
      12,5 % puis `scale(8)`, donc `blur(6px)` y vaut 48 px effectifs.

      PROTOCOLE (voir aussi TVHeroAmbilightFilter.tsx) :
        1. Capturer le simulateur — `xcrun simctl io booted screenshot tv.png`.
           Le panneau simulateur intégré ne rend rien pour tvOS : Simulator.app.
        2. En extraire l'œuvre, pour comparer la MÊME affiche des deux côtés :
             magick tv.png -crop 1526x670+242+54 +repage card-ref.png
             magick card-ref.png -resize 128x card-ref-128.png
        3. Rendre CETTE page à l'échelle 1 :
             "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
               --headless --disable-gpu --hide-scrollbars --window-size=1920,1080 \
               --default-background-color=000000ff --screenshot=web.png \
               file://$PWD/halo-harness.html
           Réémuler `filter: blur()` à ImageMagick ne marche PAS : la gamme et
           la prémultiplication font dériver le résultat d'environ 1,7×.
        4. Comparer par PROFIL de colonnes, pas à l'œil :
             magick X.png -alpha off -crop 152x400+1768+200 +repage \
               -resize 152x1! -depth 8 txt:-
           (`-alpha off` est obligatoire : sinon le parseur lit 4 composantes.)

      Deux pièges payés cher : relancer l'app (`simctl terminate` puis `launch`)
      pour repartir sur l'item 0, sinon les deux captures ne montrent pas la même
      affiche ; et FIGER les animations avant de mesurer — un souffle en cours
      décale toute la géométrie et se lit comme un bug de géométrie.
    -->
    <style>
      html, body { margin: 0; background: #000; width: 1920px; height: 1080px; overflow: hidden; }
      .cadre { position: absolute; left: 242px; top: 54px; width: 1526px; height: 670px; }

      /* — Le halo : copie de HeroAmbilight.tsx — */
      .halo { position: absolute; inset: 0; opacity: .55; pointer-events: none; }
      .halo .boite {
        position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%;
        transform: scale(8); transform-origin: top left;
      }
      .halo img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        filter: blur(6px) saturate(1.7); /* 48/8 et 1,7 — surfaces.css */
      }

      /* — La carte — */
      .carte {
        position: relative; width: 100%; height: 100%;
        border-radius: 20px; overflow: hidden;
        box-shadow: inset 0 0 0 1px rgba(139, 92, 246, .22);
      }
      .carte img { width: 100%; height: 100%; object-fit: cover; display: block; }
    </style>
  </head>
  <body>
    <div class="cadre">
      <div class="halo"><div class="boite"><img src="card-ref-128.png" alt="" /></div></div>
      <div class="carte"><img src="card-ref.png" alt="" /></div>
    </div>
  </body>
</html>

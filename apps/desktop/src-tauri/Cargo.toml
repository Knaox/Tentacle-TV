[package]
name = "tentacle-desktop"
version = "1.11.0"
edition = "2021"

[dependencies]
# macos-private-api est requise par la config DMG/dev (transparence de fenêtre).
# Le build Mac App Store la NEUTRALISE via la config (`macOSPrivateApi: false`
# dans tauri.appstore.conf.json) → le code privé reste dormant (approche
# recommandée par Tauri pour le MAS).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-libmpv = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Services_Store",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio",
  "Win32_System_Com",
] }
windows-future = "0.2"
windows-core = "0.61"
# ContrÃ´les mÃ©dia systÃ¨me (SMTC) : touches mÃ©dia + overlay "lecture en cours".
souvlaki = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication", "NSOpenGL", "NSOpenGLView"] }
libloading = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

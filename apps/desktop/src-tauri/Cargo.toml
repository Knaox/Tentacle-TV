[package]
name = "tentacle-desktop"
version = "1.15.0"
edition = "2021"

[dependencies]
# macos-private-api est requise par la config DMG/dev (transparence de fenêtre).
# Le build Mac App Store la NEUTRALISE via la config (`macOSPrivateApi: false`
# dans tauri.appstore.conf.json) → le code privé reste dormant (approche
# recommandée par Tauri pour le MAS).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Mode Hors ligne & Téléchargements : index local + cache de session (SQLite
# embarqué, aucune dépendance système — cf. src/downloads/).
rusqlite = { version = "0.32", features = ["bundled"] }
# Espace disque libre du volume de la racine de téléchargements.
fs4 = "0.13"
# Sélecteur de dossier natif (emplacement des téléchargements, hors MAS).
tauri-plugin-dialog = "2"
# Client HTTP du moteur de téléchargement (streaming + Range). Déjà utilisé
# par l'updater Linux — promu en dépendance commune aux 3 OS.
ureq = "2"
# Serveur HTTP loopback qui sert affiches/méta/trickplay locaux à la webview
# (le protocole asset de Tauri est buggé/ignoré en dev — cf. localserver.rs).
tiny_http = "0.12"
# Jeton aléatoire du serveur loopback (déjà dans l'arbre via ring).
getrandom = "0.2"

[dev-dependencies]
# Tests du store de téléchargements (suppression physique, refcount).
tempfile = "3"

# Auto-updater Linux (aucun store) : téléchargement HTTPS + vérif SHA256.
# Lecteur Linux : mpv Render API OpenGL dessiné dans un GtkGLArea, webview
# WebKitGTK transparente au-dessus dans un GtkOverlay (une seule fenêtre —
# remplace l'embarquement `--wid` de tauri-plugin-libmpv, qui laissait la vidéo
# native opaque cacher l'overlay HTML des contrôles). Cf. src/linux/.
# - gtk : GtkGLArea/GtkOverlay + reparentage de la webview.
# - webkit2gtk : set_background_color(alpha 0) sur la WebView Tauri.
# - libloading : dlopen libmpv.so.2 + symboles du Render API (comme macOS).
[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"
hex = "0.4"
gtk = "0.18"
webkit2gtk = "2"
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
# mpv embarqué via `--wid` (fenêtre enfant WS_CHILD) : conservé sur Windows où
# WebView2 sait composer l'overlay HTML transparent au-dessus. Linux utilise
# désormais le Render API custom (cf. src/linux/), macOS le sien (src/macos/).
# FORK VENDORED (base 0.3.2) : l'upstream tenait son mutex global pendant les
# appels FFI bloquants → deadlock + gel total de l'app capturé en prod le
# 15.07.2026 (freeze-probe). Verrouillage par instance — cf. VENDORED.md.
tauri-plugin-libmpv = { path = "vendored/tauri-plugin-libmpv" }
windows = { version = "0.61", features = [
  "Services_Store",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
] }
windows-future = "0.2"
windows-core = "0.61"
# ContrÃ´les mÃ©dia systÃ¨me (SMTC) : touches mÃ©dia + overlay "lecture en cours".
souvlaki = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSResponder", "NSApplication", "NSRunningApplication", "NSOpenGL", "NSOpenGLView"] }
libloading = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

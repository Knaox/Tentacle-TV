<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Tentacle TV — harnais de fiche</title>
    <!--
      La fiche média, aux cotes RÉELLES du rendu téléviseur (1280×720) — et
      c'est le correctif du harnais lui-même : l'ancienne version compressait
      les ordonnées (Retour→actions ≈ 150 px au lieu de ~420) et alignait
      « Retour » sur un bouton INTERNE à la zone d'actions. Elle validait donc
      la branche qui marche (la redirection de zone) et ne pouvait pas
      produire le défaut observé sur la dalle : le vrai gagnant géométrique
      est une tuile d'extras HORS de toute zone, absente du banc.

      Ce que cette géométrie doit produire, séquence par séquence :

      - « bas » depuis Retour        → AVANT correctifs : la 1re tuile d'extras
        (elle chevauche Retour à l'horizontale → désalignement nul, score ~600,
        contre ~790 pour « Reprendre » décalé à droite). APRÈS : « Reprendre »
        — la bande la plus proche l'emporte, et la zone y fait entrer.
      - « bas » depuis Ma liste (ronde de droite), extras MASQUÉS
        (`.extras` en display:none — la fiche sans bande-annonce, le cas
        du signalement) → AVANT : la 1re ligne d'épisode. La rangée des
        onglets ne compte que TROIS saisons, comme les vraies fiches : elle
        s'arrête bien avant l'abscisse de Ma liste, son désalignement est
        payé ×3, et la ligne pleine largeur (désalignement nul) l'enjambe.
        APRÈS : l'onglet de la saison ACTIVE (S2), par la zone « saisons ».
        Extras visibles → une tuile d'extras, avant comme après (la bande
        suivante l'emporte déjà).
      - « bas » depuis une tuile d'extras → l'onglet de la saison ACTIVE (S2),
        par la zone « saisons », jamais une ligne d'épisode.
      - « bas » répété jusqu'au fond → la page se colle au fond et y RESTE
        (pas d'aller-retour de 800 ms) ; « haut » répété → collée à zéro.

      NB banc d'essai : un Entrée synthétique (CDP ou __appui) ne déclenche
      pas l'activation native d'un bouton — ouvrir les éléments par .click().
    -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #14101f; color: #eee; font-family: sans-serif; }
      :focus { outline: 3px solid #c084fc; outline-offset: 2px; }

      .rail-tv {
        position: fixed; top: 0; bottom: 0; left: 0; width: 90px;
        display: flex; flex-direction: column; gap: 12px; padding: 24px 12px;
        background: #1d1730; z-index: 40;
      }
      .rail-tv a { display: block; padding: 10px 8px; color: #cbc3e3; text-decoration: none; font-size: 13px; }

      button { border: 1px solid #555; background: #241d3a; color: #eee; border-radius: 999px; }

      /* Retour vit dans la gouttière gauche, comme sur la dalle : c'est ce
         chevauchement avec la colonne des extras qui fabrique le bug. */
      .retour { position: absolute; left: 72px; top: 40px; height: 46px; padding: 0 18px; }

      .hero { display: flex; gap: 24px; margin-top: 300px; padding: 0 56px; }
      .poster { width: 224px; height: 336px; border-radius: 12px; background: #33294f; flex-shrink: 0; }
      .colonne { flex: 1; }
      h1 { font-size: 40px; line-height: 44px; margin-bottom: 120px; }

      /* Le déplié du synopsis : un petit bouton texte, juste AU-DESSUS des
         actions — la première bande sous Retour, donc l'épreuve de la zone
         élargie (l'entrée doit rester « Reprendre », pas lui). */
      .voir-plus { display: block; height: 24px; padding: 0 10px; font-size: 13px;
                   border: none; background: none; color: #b8aed6; border-radius: 6px; }

      [data-tv-zone="actions-fiche"] { display: flex; gap: 10px; align-items: center; margin-top: 13px; }
      .cta-primary-harnais { height: 56px; padding: 0 32px; font-weight: 700; background: #eee; color: #222; }
      .secondaire { height: 56px; padding: 0 24px; }
      .ronde { width: 56px; height: 56px; flex-shrink: 0; }

      .extras { margin-top: 4px; padding: 0 56px; }
      .extras h2 { font-size: 18px; margin-bottom: 16px; color: #cbc3e3; }
      .extras [data-tv-piste] { display: flex; gap: 16px; overflow-x: auto; }
      .extras button { flex: 0 0 208px; height: 117px; border-radius: 10px; background: #2c3a52; }

      .saisons { display: flex; gap: 12px; overflow-x: auto; margin-top: 153px; padding: 0 32px; }
      .saisons button { flex: 0 0 auto; height: 42px; padding: 0 26px; }
      .saisons [aria-selected="true"] { background: #6d28d9; }

      /* Les lignes d'épisode occupent TOUTE la largeur, comme sur la dalle :
         leur désalignement est nul depuis n'importe quelle abscisse — c'est
         l'aimant que la restriction de bande doit neutraliser. */
      .episodes { margin-top: 28px; padding: 0 32px; display: flex; flex-direction: column; gap: 5px; }
      .episodes [data-tv-carte] {
        height: 125px; border-radius: 10px; background: #241d3a;
        display: flex; align-items: center; padding: 0 18px;
      }

      footer { height: 400px; }
    </style>
  </head>
  <body>
    <nav class="rail-tv" aria-label="Navigation">
      <a href="#accueil" data-rail="accueil">Accueil</a>
      <a href="#films" data-rail="films">Films</a>
      <a href="#series" data-rail="series" aria-current="page">Séries</a>
    </nav>

    <main>
      <button type="button" class="retour" data-cle="retour">← Retour</button>

      <div class="hero">
        <div class="poster"></div>
        <div class="colonne">
          <h1>Une série factice</h1>
          <button type="button" class="voir-plus" data-cle="voir-plus">Voir plus</button>
          <div data-tv-zone="actions-fiche">
            <button type="button" class="cta-primary-harnais cta-primary" data-cle="lecture">Reprendre S4 · E2</button>
            <button type="button" class="secondaire" data-cle="trailer">Bande-annonce</button>
            <button type="button" class="ronde" data-cle="favori">❤</button>
            <button type="button" class="ronde" data-cle="liste">🔖</button>
          </div>
        </div>
      </div>

      <section class="extras">
        <h2>Extras</h2>
        <div data-tv-piste data-harnais-extras></div>
      </section>

      <div class="saisons" role="tablist" data-tv-piste data-tv-zone="saisons" data-harnais-saisons></div>

      <div class="episodes" data-harnais-episodes></div>

      <footer></footer>
    </main>

    <script src="/tv/harnais-shims.js"></script>
    <script type="module">
      import { installerMoteurFocus } from "/tv/src/focus/moteur.ts";
      import { amorcerFocus } from "/tv/src/focus/entree.ts";

      // Les extras sont des <button> nus, hors de toute zone — le vrai DOM de
      // la rangée de bandes-annonces, et le vrai gagnant géométrique du bug.
      const extras = document.querySelector("[data-harnais-extras]");
      for (let index = 1; index <= 5; index++) {
        const tuile = document.createElement("button");
        tuile.type = "button";
        tuile.setAttribute("data-cle", `extra-${index}`);
        tuile.textContent = `Extra ${index}`;
        extras.appendChild(tuile);
      }

      // TROIS saisons, pas huit : une vraie rangée d'onglets s'arrête loin
      // avant l'abscisse des pastilles rondes — c'est ce vide qui fait payer
      // aux onglets le désalignement ×3 et laisse gagner la ligne d'épisode.
      const saisons = document.querySelector("[data-harnais-saisons]");
      for (let index = 1; index <= 3; index++) {
        const pill = document.createElement("button");
        pill.type = "button";
        pill.setAttribute("role", "tab");
        pill.setAttribute("aria-selected", index === 2 ? "true" : "false");
        pill.setAttribute("data-cle", `s${index}`);
        pill.textContent = `Saison ${index}`;
        saisons.appendChild(pill);
      }

      const episodes = document.querySelector("[data-harnais-episodes]");
      for (let index = 1; index <= 10; index++) {
        const ligne = document.createElement("div");
        ligne.setAttribute("role", "button");
        ligne.setAttribute("tabindex", "0");
        ligne.setAttribute("data-tv-carte", "");
        ligne.setAttribute("data-tv-cle", `ep-${index}`);
        ligne.textContent = `Épisode ${index}`;
        episodes.appendChild(ligne);
      }

      installerMoteurFocus();
      amorcerFocus(true);
    </script>
  </body>
</html>

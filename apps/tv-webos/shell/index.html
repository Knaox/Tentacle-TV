<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <!-- Même canevas que le client : 1920, celui de la dalle. Sur webOS c'est
       `appinfo.json → resolution` qui décide, le `meta` ne sert qu'au
       simulateur et au navigateur de développement — mais les deux doivent
       rester d'accord, sinon la coquille et le client ne composent pas à la
       même échelle et le passage de l'un à l'autre se voit. -->
  <meta name="viewport" content="width=1920, initial-scale=1" />
  <title>Tentacle TV</title>
  <link rel="stylesheet" href="css/shell.css" type="text/css" />
  <script src="js/webOSTV.js" charset="utf-8"></script>
  <script src="js/storage.js" charset="utf-8"></script>
  <script src="js/deviceInfo.js" charset="utf-8"></script>
  <script src="js/relay.js" charset="utf-8"></script>
  <script src="js/pairingView.js" charset="utf-8"></script>
  <script src="js/pairingStates.js" charset="utf-8"></script>
  <script src="js/shell.js" charset="utf-8"></script>
</head>
<body>
  <!-- La carte centrée d'Android TV : le logo, puis le contenu de l'étape.
       Pas de titre — l'écran natif n'en porte pas, et un titre en plus était
       la seconde chose qui distinguait les deux à l'œil. -->
  <div class="cadre">
    <div class="carte-jumelage">
      <img class="logo-jumelage" src="images/tentacle-logo-pirate.svg" alt="Tentacle TV" />
      <!-- Rempli par `pairingView.js` : code, compte à rebours, ou message. -->
      <div id="etape-jumelage" class="etape"></div>
    </div>
  </div>

  <script>window.demarrerCoquille();</script>
</body>
</html>

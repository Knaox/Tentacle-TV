<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Canevas 1920×1080 — la résolution de la dalle, au pixel près.

      **Ce n'est pas ce `meta` qui décide sur un téléviseur.** webOS ignore le
      viewport : le canevas d'une application vient du champ `resolution`
      d'`appinfo.json`, et LG le documente ainsi — « pour connaître la
      résolution d'une application web, lire `window.innerWidth` ». Le `meta`
      est ici pour que le navigateur de développement et le simulateur — qui,
      lui, force un zoom de son propre chef — composent sur le même canevas que
      la dalle. Les deux valeurs doivent rester d'accord.

      Composer en 1280 et laisser le téléviseur agrandir de moitié a été
      essayé, et écarté : la couche graphique est alors rastérisée en 720p puis
      étirée, et TOUT le texte s'en ressent. Aucun correctif ne rattrape ça,
      parce que le mal est fait avant la mise à l'échelle.

      En 1920, les composants d'`apps/web` gardent exactement les proportions du
      client web — c'est le rendu de référence, et c'est voulu. Ce qui doit
      grossir est le mobilier propre au salon : rail, overscan, anneau de focus,
      plancher typographique. Chacun porte sa valeur et son commentaire, dans
      les feuilles de `styles/`.
    -->
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>Tentacle TV</title>
    <!--
      Politique de sécurité de la variante téléviseur.

      `worker-src blob:` est indispensable : le rendu des sous-titres PGS passe
      par libpgs, qui instancie son démultiplexeur depuis un blob. Sans cette
      directive, le worker est refusé, le rendu client échoue, et la
      négociation retombe sur une incrustation côté serveur — c'est-à-dire un
      transcodage complet là où la dalle n'avait qu'à décoder.

      `connect-src` couvre trois choses, et pas une de plus.

      `'self'` — le client est servi par le serveur Tentacle et tout le reste
      passe par son proxy same-origin.

      `ws:` et `wss:` — Chrome 53 ne fait PAS entrer un WebSocket de même
      origine dans `'self'`, là où les navigateurs récents le font. Sans eux,
      `ws://…/api/ws` est refusé et le temps réel est muet sur webOS 4 : c'est
      l'erreur qui remplissait la console de l'émulateur.

      `https://pair.tentacletv.app` — le relais de jumelage. Le client en a
      besoin depuis qu'« oublier cet appareil » mène à un écran de code au lieu
      de fermer l'application : c'est lui qui demande le code et sonde sa
      confirmation. La coquille, elle, y accédait sans rien déclarer — elle est
      servie depuis `file://`, où cette politique ne s'applique pas.

      **Les bandes-annonces, et pourquoi la même liste est écrite DEUX fois.**
      Cette politique avait été réécrite de zéro pour le téléviseur et n'avait
      jamais repris l'autorisation d'embarquer YouTube que porte celle du client
      web. Aucune bande-annonce ne pouvait donc s'ouvrir : le cadre était refusé
      avant même qu'une requête ne parte.

      `frame-src` est la directive du niveau 3, celle que lisent les moteurs
      récents. Chromium 53 — les dalles de 2018 et 2019 — n'en est qu'au niveau
      2, où les cadres sont gouvernés par `child-src`, `frame-src` y étant
      déprécié. Une seule des deux ne couvrirait donc que la moitié du parc, et
      elles doivent porter la même liste.

      `worker-src` reste séparé pour les moteurs récents ; sur Chromium 53 les
      workers retombent eux aussi sur `child-src`, dont le `blob:` les couvre.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; connect-src 'self' ws: wss: https://pair.tentacletv.app; worker-src 'self' blob:; frame-src 'self' blob: https://www.youtube-nocookie.com https://www.youtube.com; child-src 'self' blob: https://www.youtube-nocookie.com https://www.youtube.com"
    />
    <script>
      /* Le thème avant le premier tracé, et il n'y en a qu'un.
         Un téléviseur n'a pas de réglage système clair/sombre à suivre, et une
         interface de salon se regarde dans une pièce dont on a baissé la
         lumière : le mode clair n'y a aucun emploi. Il est donc figé ici comme
         il l'est dans le client (`shims/themeSombre.ts` remplace le store
         d'apparence), et la section Apparence des réglages a disparu avec lui.
         Poser l'attribut avant le premier tracé reste nécessaire : sans cela la
         page apparaît en clair puis bascule, ce qui se voit d'autant plus sur
         une grande dalle. */
      document.documentElement.setAttribute("data-theme", "dark");
      document.documentElement.style.background = "#000000";
    </script>
  </head>
  <body class="bg-tentacle-bg text-content-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tv.tsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Canevas 1280×720, agrandi ×1,5 par le téléviseur vers sa dalle 1080p.

      C'est la mise à l'échelle du client, et elle ne se fait pas autrement.
      Agrandir la police racine ne met à l'échelle que les `rem` : les cent
      trente-quatre classes en pixels d'`apps/web` ne suivent pas, les styles
      en ligne non plus, et les media queries continuent d'évaluer contre la
      largeur réelle — la bibliothèque sortait huit affiches par rangée avec du
      texte agrandi, et la barre de navigation rendait son contenu hors écran.

      En composant à 1280, tout suit d'un coup : rem, pixels, vh, bordures,
      images, styles en ligne, et les rectangles que le moteur de focus mesure.
      Les composants d'`apps/web` se retrouvent dans la configuration d'un
      portable à 1280 — celle pour laquelle ils ont été écrits.

      **Mais ce n'est PAS ce `meta` qui l'obtient sur un téléviseur.** webOS
      ignore le viewport : le canevas d'une application vient du champ
      `resolution` d'`appinfo.json`, et LG le documente ainsi — « pour connaître
      la résolution d'une application web, lire `window.innerWidth` ». Relevé
      sur l'émulateur webOS 4.0 avec `resolution: "1920x1080"` : `innerWidth`
      valait 1920, donc toute l'interface sortait aux deux tiers de sa taille,
      texte compris. Le simulateur, lui, force un zoom à 1280 de son propre
      chef : c'est pour cela, et pour cela seulement, qu'il paraissait juste.

      Le `meta` reste, et il sert : c'est lui qui donne le même canevas au
      navigateur de développement et au simulateur. Sur la dalle, c'est
      `appinfo.json` qui fait autorité — les deux doivent rester d'accord.
    -->
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>Tentacle TV</title>
    <!--
      Politique de sécurité de la variante téléviseur.

      `worker-src blob:` est indispensable : le rendu des sous-titres PGS passe
      par libpgs, qui instancie son démultiplexeur depuis un blob. Sans cette
      directive, le worker est refusé, le rendu client échoue, et la
      négociation retombe sur une incrustation côté serveur — c'est-à-dire un
      transcodage complet là où la dalle n'avait qu'à décoder.

      `connect-src` reste en `'self'` : le client est servi par le serveur
      Tentacle, tout passe par le proxy same-origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:"
    />
    <script>
      /* Le thème avant le premier tracé, et il n'y en a qu'un.
         Un téléviseur n'a pas de réglage système clair/sombre à suivre, et une
         interface de salon se regarde dans une pièce dont on a baissé la
         lumière : le mode clair n'y a aucun emploi. Il est donc figé ici comme
         il l'est dans le client (`shims/themeSombre.ts` remplace le store
         d'apparence), et la section Apparence des réglages a disparu avec lui.
         Poser l'attribut avant le premier tracé reste nécessaire : sans cela la
         page apparaît en clair puis bascule, ce qui se voit d'autant plus sur
         une grande dalle. */
      document.documentElement.setAttribute("data-theme", "dark");
      document.documentElement.style.background = "#000000";
    </script>
  </head>
  <body class="bg-tentacle-bg text-content-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tv.tsx"></script>
  </body>
</html>

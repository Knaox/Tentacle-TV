server {
    listen 80;
    server_name tentacle.rouge-informatique.ch;

    root /var/www/tentacle;
    index index.html;

    # --- Cache: index.html JAMAIS caché ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # --- Cache: assets Vite (hash dans le nom) = cache agressif ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Client téléviseur (LG webOS) : proxifié, jamais servi d'ici ---
    #
    # Sans ce bloc, /tv/ tombe dans le SPA ci-dessous et sert l'index.html du
    # client WEB : un téléviseur y chargerait l'application de bureau. Le
    # backend, lui, sert apps/tv-webos/client/dist et applique le filtre
    # d'agent — une seule règle, valable ici comme dans l'image Docker.
    #
    # `^~` l'emporte sur les préfixes concurrents et évite que /tv/assets/
    # reparte dans le bloc /assets/ ci-dessus, qui pointe la racine du web.
    location ^~ /tv {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # L'agent doit arriver intact au backend : c'est sur lui que porte le
        # filtre. Nginx le transmet par défaut, on l'écrit pour que personne ne
        # le retire par mégarde en ajoutant un `proxy_set_header` ici.
        proxy_set_header User-Agent $http_user_agent;
    }

    # --- SPA: toutes les routes vers index.html ---
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- API proxy vers backend Node.js ---
    location /api/ {
        # CORS — nécessaire pour les apps Desktop (Tauri), Mobile, TV
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Emby-Authorization, X-Emby-Token' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Emby-Authorization, X-Emby-Token' always;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
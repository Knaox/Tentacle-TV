# ══════════════════════════════════════════════════════════════════════════
#  Tentacle TV — Tentacle ALONE, for an existing Jellyfin
# ══════════════════════════════════════════════════════════════════════════
#  For those who already run Jellyfin, e.g. on a NAS. No database to set up:
#  Tentacle keeps its data in a file (SQLite) of the tentacle-data volume.
#
#  1. Put this file in an empty folder as compose.yaml, then run:
#       docker compose up -d          (Podman: podman compose up -d)
#  2. Open  http://<this-machine>:3000  and follow the setup wizard. From your
#     home network, no code; from elsewhere it asks for one, printed in
#     Tentacle's log (Portainer: the container's Logs).
#     It then picks your Jellyfin and its administrator.
#
#  UPGRADING an installation that uses your own MariaDB or MySQL (before
#  1.25)? Keep its settings (DB_* variables, DATABASE_URL, or the database
#  chosen in the old wizard) until the dashboard confirms the migration:
#  Tentacle copies that database by itself, read-only, then says how to
#  remove it. https://tentacletv.app/docs/server/sqlite-migration/
# ══════════════════════════════════════════════════════════════════════════

services:
  tentacle:
    image: ghcr.io/knaox/tentacle-tv:${TENTACLE_VERSION:-latest}
    restart: unless-stopped
    environment:
      TENTACLE_STACK: only
      TENTACLE_HOST_PORT: ${TENTACLE_PORT:-3000} # the setup link printed in the logs
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      # Web interface: uncomment to turn it off — / answers 404. The apps
      # (desktop, mobile, TV), the LG TV client under /tv and the setup wizard
      # (until setup is done) keep working. Back on: set "on" and restart, or
      # run `tentacle web on` in this container (no restart needed).
      # TENTACLE_WEB_UI: "off"
    ports:
      - "${TENTACLE_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway" # reaches a Jellyfin (or an old database) on this machine
    volumes:
      - tentacle-data:/app/apps/backend/data

volumes:
  tentacle-data:
